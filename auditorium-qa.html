<!doctype html>
<!--
  DINK DONK - SCENE 2: the auditorium (Screen 1), shown while the picked film downloads.

  Background = the latest approved Codex draft (roxy3d/qa11/cinema_draft_NN.png) with its layout JSON
  (seats, tiers, stairs, the entrance tunnel route). Every chatter who walks in comes through the tunnel
  from the back of the hall, climbs the stairs and takes a seat; their own row's seat backs hide their
  lower body. Chatters speak once visible; tunnel messages are bounded until they emerge.
  Options: draft=09 (which qa11 draft), tag= / everyone=1 (who walks in, see shared/cinema.js), demo=1,
  live=1 (auto-reload on file change), phase=seating|dim|film|up, screen=green (always OBS green),
  director=0|<seconds>, zoom=<1.2-3>, ctl=0 (no control panel connection). Keys F/R/W/D as in the lobby.
  bridge=0 (inside OBS: don't send the screen corners to obs-bridge.js), bridge=<host:port> (bridge elsewhere, default <this host>:18790).
  Testing: janidle=<s> (janny clocks off), doze=<s> (quiet time before a chatter nods off), chatty=<n> (messages a
  minute that get the phone out and a shush in the dark), qb=<0-1> (pretend a download at that progress, for the
  loading slide) and qbname=<torrent name> (its name), kick=<0-1> (chance the usher's flashlight visit ends in a kick, default 0.5).
  leave=<minutes> (off by default): in a full house with people waiting outside, the longest-dozing chatter (quiet that long)
  heads home to free a seat. maxres=<height>: cap the art resolution (e.g. 1080: no 4K art). slidefade=seq: pre-show slides fade out, then in (no cross-fade).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>DINK DONK - Screen 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { background: #0b0a12; font-family: Oswald, 'Arial Narrow', Arial, sans-serif; color: #fff; }
  #world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 0; }
  /* will-change: the camera's moves and zooms are a compositor transform of one raster (kept at the zoomed scale)
     instead of re-rastering the whole room every frame (perf 8 Nov) */
  #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; will-change: transform; }
  #names { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 1; pointer-events: none; }
  #bg, #bg-dim { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .slice, .sheet { position: absolute; pointer-events: none; }
  .sheet { left: 0; top: 0; }
  #screenq { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; display: none; z-index: 70000; }
  /* No filter at rest: an identity brightness(1) on every slice, sheet and emote made each one its own offscreen
     pass whenever its tiles re-rasterised (QA 04 Nov: 66 -> 170 fps uncapped with ~60 chatters). The filter (and its
     6 s fade from/to none) only applies where it does something: art without dim twins, emotes while dark. */
  #stage:not(.has-dim-art) #bg, #stage:not(.has-dim-art) .slice, #stage:not(.has-dim-art) .sheet { transition: filter 6s ease-in-out; }
  /* (its own class, lights-flat = lights down without dim twins: in a .lights-down rule these selectors made every
     lights toggle restyle all ~4600 slice images, ~20 ms in one frame; perf 8 Nov) */
  .lights-flat #bg, .lights-flat .slice, .lights-flat .sheet { filter: brightness(.45); }
  /* One fade value for every dim twin: a piece shown mid-fade (a chatter walks behind it) picks up the room's current
     level instead of starting at its end value, which left dark or bright blocks over the seats (owner 05 Nov).
     The value is driven from script (stepDim) and written only to the dim pieces on screen: as an inherited CSS
     custom property with a 6 s transition it restyled all ~9000 elements every frame of the fade
     (perf 8 Nov: 430 ms/s style, 21-33 fps, hitches up to 0.7 s). */
  .dim-art { opacity: 0; pointer-events: none; }
  /* the full-frame dim picture on its own GPU layer: its fade is a compositor opacity change, not a repaint of the
     whole room each frame */
  #bg-dim { will-change: opacity; }
  /* The lit art stays drawn under the dim art when it is fully up (it used to be hidden at dim-done): hidden, Chrome
     dropped its decoded images and every lights-up decoded them again in its first frames (perf 8 Nov: 509 -> 117 ms
     of decoding; no cost in the dark at rest). */
  /* emotes and items at rest; the 6 s dimming between is stepped from script (stepDim): a 6 s CSS filter transition on
     every chatter repainted each one every frame of the fade (perf 8 Nov: ~94 -> ~136 fps uncapped without it) */
  .lights-down .w .em { filter: brightness(.5); }

  /* A flat projection, clipped before its affine mapping into the matte screen. */
  #preshow { position: absolute; left: 0; top: 0; width: 960px; height: 540px; overflow: hidden;
    transform-origin: 0 0; display: none; pointer-events: none; color: #eadbb9; background: #282224; z-index: 70000;
    filter: brightness(.85) sepia(.13); }
  #preshow::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse, transparent 25%, rgba(8,5,6,.56)); box-shadow: inset 0 0 38px #171315; }
  .ps-slide { position: absolute; inset: 0; padding: 42px 64px; box-sizing: border-box; display: flex;
    flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px;
    opacity: 0; transition: opacity .8s; text-shadow: 0 0 3px #d8c39444; }
  .ps-slide.active { opacity: 1; }
  .ps-small { font-size: 26px; letter-spacing: .16em; text-transform: uppercase; }
  .ps-slide h2 { margin: 0; font-size: 72px; font-weight: 500; line-height: 1.08; }
  .ps-slide p { margin: 0; font-size: 34px; line-height: 1.25; }
  .ps-feature { display: flex; align-items: center; justify-content: center; gap: 30px; width: 100%; min-height: 220px; }
  #ps-title { font-size: 54px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4;
    -webkit-box-orient: vertical; overflow: hidden; }
  #ps-poster { width: 140px; height: 210px; object-fit: contain; opacity: .85; flex-shrink: 0; }
  /* room around the bar, and not much wider than the text: on the slanted screen a long bar flush against
     the digits reads as striking through them */
  #ps-progress { display: flex; flex-direction: column; align-items: center; gap: 26px; }
  #ps-progress[hidden] { display: none; }
  #ps-percent { font-size: 80px; line-height: 1; }
  #ps-bar { position: relative; width: 340px; height: 12px; background: #a798752b; }
  #ps-fill { height: 100%; width: 0; background: #c7b585; transition: width 2s linear; }
  /* while downloading: what it is (poster, title, IMDb rating) on the left, a DGG meme (emote + caption) on the
     right, chat's top emote riding the bar, and the emotes chat posts floating up the screen's edges.
     The row stays within about 12-88 % of the screen so the floating emotes keep clear of it. */
  .ps-loadrow { display: flex; align-items: center; justify-content: center; gap: 36px; }
  .ps-loadcol { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 340px; }
  #ps-film { width: 130px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #ps-film[hidden], #ps-film-poster[hidden], #ps-ftitle[hidden], #ps-fsub[hidden] { display: none; }
  #ps-film-poster { width: 130px; height: 195px; object-fit: cover; opacity: .88; box-shadow: 0 0 0 2px #c7b58533; }
  .ps-slide #ps-rating { font-size: 24px; letter-spacing: .04em; white-space: nowrap; }
  #ps-rating b { color: #f2c94c; font-weight: 500; }
  .ps-slide #ps-ftitle { margin: 0; font-size: 42px; font-weight: 500; line-height: 1.08; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ps-slide #ps-fsub { font-size: 22px; letter-spacing: .06em; opacity: .8; }
  #ps-meme { width: 180px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  #ps-meme[hidden] { display: none; }
  #ps-meme-em { height: 112px; display: flex; align-items: flex-end; }
  .ps-slide #ps-meme-cap { font-size: 27px; line-height: 1.2; font-style: italic; }
  #ps-rider { position: absolute; top: 50%; left: 0; transform: translate(-50%, -50%); transition: left 2s linear; }
  #ps-rider > * { display: block; animation: ps-hop .8s ease-in-out infinite; }
  @keyframes ps-hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  #ps-pops { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .ps-pop { position: absolute; bottom: -70px; animation: ps-rise 5s ease-out forwards; }
  @keyframes ps-rise { 0% { transform: translateY(0); opacity: 0; } 12% { opacity: .9; } 70% { opacity: .9; }
    100% { transform: translateY(-330px); opacity: 0; } }
  #ps-eta { font-size: 28px; }
  #ps-audience { position: relative; width: 100%; height: 280px; overflow: hidden; }
  #ps-credits { position: absolute; top: 0; width: 100%; font-size: 38px; line-height: 1.6;
    animation: ps-roll 24s linear infinite; }
  @keyframes ps-roll { from { transform: translateY(280px); } to { transform: translateY(-100%); } }
  @media (prefers-reduced-motion: reduce) { .ps-slide, #ps-fill { transition: none; } }

  /* no will-change: a GPU layer per chatter forces the depth slices between them onto layers too, which thrash
     tile memory when the director zooms in (3 fps at 1.85x with 60 chatters; ~95 fps without) */
  .w { position: absolute; left: 0; top: 0; }
  .w .sh { position: absolute; left: -14px; top: -5px; width: 28px; height: 10px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0,0,0,.5), rgba(0,0,0,0)); }
  .w.sit .sh { display: none; }
  .w .bod { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  .w .em { position: absolute; bottom: 0; }
  /* popcorn / soda (the lobby's rendered item sprites) and the phone some seated chatters check */
  .w .item { position: absolute; pointer-events: none; }
  .lights-down .w .item { filter: brightness(.5); }
  /* screen glow (queue 58): the film's light around the screen (bloom) and spilling onto the floor, seats and people */
  #glowbloom { position: absolute; left: 0; top: 0; width: 960px; height: 540px; transform-origin: 0 0; pointer-events: none;
    z-index: 69990; mix-blend-mode: screen; opacity: 0; transition: opacity 1.5s; }
  #glowspill { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; z-index: 69980;
    mix-blend-mode: screen; opacity: 0; transition: opacity 1.5s; }
  /* aisle lights (queue 61, A2): step-nosing strips, row-end lamps, the stage cove strip and exit-sign halos.
     Depth-sorted like the walkers; they come up as the house lights go down */
  .alamp { position: absolute; pointer-events: none; opacity: 0; }   /* the 6 s fade: stepDim */
  .lights-down .alamp { opacity: 1; }
  .alamp.nose { height: 2px; border-radius: 1px; background: #ffc061; transform-origin: 0 50%;
    box-shadow: 0 0 3px 1px rgba(255, 170, 70, .7), 0 0 9px 3px rgba(255, 150, 50, .22); }
  .alamp.dot { width: 4px; height: 3px; margin: -1.5px 0 0 -2px; border-radius: 2px; background: #ffd08a;
    box-shadow: 0 0 3px 1px rgba(255, 175, 80, .9), 0 0 10px 4px rgba(255, 150, 50, .3); }
  .alamp.cove { height: 3px; border-radius: 2px; background: #9ad8ff; transform-origin: 0 50%;
    box-shadow: 0 0 4px 1px rgba(110, 200, 255, .9), 0 0 16px 5px rgba(90, 180, 255, .35); }
  .alamp.halo { border-radius: 50%; mix-blend-mode: screen; }
  /* projector beam (queue 61, A3): a soft beam from a port in the back wall to the screen, with drifting dust;
     on while the film plays with the lights down, brightness and tint follow the film like the screen glow */
  #pbeam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; z-index: 69970;
    mix-blend-mode: screen; opacity: 0; transition: opacity 1.5s; overflow: visible; }
  #pdust { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; z-index: 69971;
    mix-blend-mode: screen; opacity: 0; transition: opacity 1.5s; }
  /* the drift is a Web Animation per mote (placeBeam): a CSS keyframe with var() values ran on the main thread, 48
     style recalcs a frame, even with the dust off (perf 9 Nov); it pauses while the dust is off (stepGlow) */
  #pdust i { position: absolute; border-radius: 50%; background: #fff6e2; opacity: .15; }
  /* litter (queue 60): pieces on the floor, depth-sorted with the art like the walkers */
  /* the 1.5 s CSS filter transition of up to 140 pieces repainted every one of them every frame at the start of each
     lights change; now stepDim steps the filter with the room's fade (perf 9 Nov). Tried and dropped: baking the two
     looks into the SVGs (swapping 140 SVG images per fade cost more than the filter). */
  .litter { position: absolute; pointer-events: none; filter: brightness(.9) saturate(.9); transition: opacity 2s; }
  .lights-down .litter { filter: brightness(.42) saturate(.8); }
  .w .phone { position: absolute; width: 5px; height: 8px; border-radius: 1px; background: #0d0f14; display: none;
    border: 1px solid #0d0f14; box-sizing: content-box; }
  .w .phone::after { content: ''; position: absolute; inset: 0; border-radius: 1px; background: #bfe0ff;
    box-shadow: 0 0 5px 2px rgba(130, 190, 255, .55), 0 0 14px 5px rgba(110, 170, 255, .22); }
  .w .phone.on { display: block; }
  #names .fl { position: absolute; left: 0; top: 0; white-space: nowrap; font: 600 16px/1 Oswald, sans-serif; letter-spacing: .04em;
    text-shadow: 0 0 6px rgba(255, 140, 200, .8), 0 1px 2px #000; }
  /* dozing chatters: little z's drifting up from the head */
  #names .zz { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  #names .zz span { position: absolute; left: 0; bottom: 0; font: 600 12px/1 Oswald, sans-serif; color: #d8e6ff; opacity: 0;
    text-shadow: 0 0 4px rgba(120, 160, 255, .8), 0 1px 2px #000; animation: zz 3.6s linear infinite; }
  #names .zz span:nth-child(2) { font-size: 15px; animation-delay: 1.2s; }
  #names .zz span:nth-child(3) { font-size: 18px; animation-delay: 2.4s; }
  @keyframes zz { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: .95; } 100% { transform: translate(16px, -32px); opacity: 0; } }
  /* the usher's flashlight (lights down only) */
  #names .beam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; display: none; }
  #names .nm { position: absolute; left: 0; top: 5px; transform: translateX(-50%); white-space: nowrap;
    font: 500 12px/1 Oswald, 'Arial Narrow', sans-serif; letter-spacing: .02em; padding: 0 4px 1px; border-radius: 2px;
    background: rgba(8, 6, 18, .5); text-shadow: 0 1px 2px #000, 0 0 4px #000; transition: opacity .6s; }

  /* DGG tier 5 subs: the moving rainbow name of DGG chat (same gradient as the DSA script) */
  .rbt { background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bff95, #67d8ff, #b28dff, #ff78c6, #ff6b6b);
    background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-fill-color: transparent; animation: rbt 4s linear infinite; }
  @keyframes rbt { to { background-position: -220% 0; } }
  #bubbles { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 86000; pointer-events: none; }
  /* the lobby's dialog box: square, plain 90s game style */
  .bub { position: absolute; left: 0; top: 0; max-width: 300px; padding: 5px 10px 6px; border-radius: 3px;
    background: rgba(10, 9, 22, .9); border: 1px solid rgba(200, 220, 255, .6); color: #f4f4ff;
    font: 700 16px/1.28 Verdana, Tahoma, 'Segoe UI', sans-serif; white-space: normal; overflow-wrap: anywhere;
    box-shadow: 2px 2px 0 rgba(0, 0, 0, .55); }
  .bub .bn { font: 700 12px/1.2 Verdana, Tahoma, sans-serif; margin-bottom: 1px; letter-spacing: .02em; }
  .bub .bt { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .bub::after { content: ''; position: absolute; left: calc(50% + var(--tail, 0px)); bottom: -8px; margin-left: -7px;
    border: 7px solid transparent; border-top-color: rgba(200, 220, 255, .6); border-bottom: 0; }
  .bub.below::after { bottom: auto; top: -8px; border-top-color: transparent; border-bottom: 7px solid rgba(200, 220, 255, .6); border-top: 0; }
  .bub .sb-emote { vertical-align: middle; margin: 0 2px; }
  /* ---- bubble look drafts (07 Nov 2026), ?bubstyle=1..5; none = the current dialog box ----
     every look keeps the same box model (padding, max-width, 3-line clamp), so placement and stacking are unchanged */
  :is(.bs1, .bs2, .bs3, .bs4, .bs5) .bub::after { border-top-color: var(--tc); }
  :is(.bs1, .bs2, .bs3, .bs4, .bs5) .bub.below::after { border-top-color: transparent; border-bottom-color: var(--tc); }
  /* light looks: the name sits on a dark chip so pale flair colors stay readable */
  .bs1 .bub .bn, .bs2 .bub .bn, .bs4 .bub .bn { display: inline-block; padding: 1px 6px; margin-bottom: 3px; border-radius: 3px; background: #1c1524; }

  /* 1 MARQUEE: warm cream marquee panel with a row of bulbs along the top */
  .bs1 .bub { --tc: #3a2410; background: linear-gradient(#fff4d2, #f0d99c); color: #1f1408; border: 2px solid #3a2410;
    border-radius: 4px; padding-top: 11px; box-shadow: 0 0 10px rgba(255, 196, 90, .45), 2px 3px 0 rgba(0, 0, 0, .6);
    font: 800 18px/1.25 'Trebuchet MS', Verdana, sans-serif; }
  .bs1 .bub::before { content: ''; position: absolute; left: 6px; right: 6px; top: 3px; height: 5px;
    background: radial-gradient(circle, #fff7c0 0 1.6px, #ffb43a 2.2px, transparent 2.8px) 0 0 / 10px 5px repeat-x; }

  /* 2 TICKET STUB: off-white admit-one stub, notched sides, typewriter text, red stamped name */
  .bs2 .bub { --tc: #efe4cc; color: #2a2017; border: 0; border-radius: 2px; padding: 6px 16px 7px;
    background: radial-gradient(circle at 0 50%, transparent 7px, #efe4cc 7.5px) left / 51% 100% no-repeat,
                radial-gradient(circle at 100% 50%, transparent 7px, #efe4cc 7.5px) right / 51% 100% no-repeat;
    box-shadow: none; filter: drop-shadow(2px 3px 0 rgba(0, 0, 0, .55)); font: 700 17px/1.28 'Courier New', Courier, monospace; }
  .bs2 .bub::before { content: ''; position: absolute; left: 9px; top: 4px; bottom: 4px; border-left: 2px dashed rgba(120, 30, 30, .35); }
  .bs2 .bub .bn { background: #8e1d1d; color: #fff3e0 !important; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
  .bs2 .bub .bn .rbt { -webkit-text-fill-color: #fff3e0; }

  /* 3 NEON: dark glass with a rounded outline and a soft glow in the speaker's own name color */
  .bs3 .bub { --tc: var(--nc, #9fd0ff); background: rgba(8, 6, 20, .86); border: 2px solid var(--nc, #9fd0ff); border-radius: 12px;
    color: #fbf8ff; box-shadow: 0 0 8px color-mix(in srgb, var(--nc, #9fd0ff) 70%, transparent), inset 0 0 6px color-mix(in srgb, var(--nc, #9fd0ff) 35%, transparent);
    font: 700 18px/1.28 Verdana, Tahoma, sans-serif; padding: 5px 12px 7px; }
  .bs3 .bub .bn { text-shadow: 0 0 6px currentColor; }

  /* 4 COMIC: white rounded speech balloon with a thick black outline */
  .bs4 .bub { --tc: #111; background: #fff; color: #111; border: 3px solid #111; border-radius: 16px; padding: 5px 12px 7px;
    box-shadow: 3px 3px 0 rgba(0, 0, 0, .55); font: 700 18px/1.25 'Comic Sans MS', 'Trebuchet MS', sans-serif; }
  .bs4 .bub::after { border-width: 9px; margin-left: -9px; bottom: -11px; }
  .bs4 .bub.below::after { top: -11px; bottom: auto; }

  /* 5 RPG WINDOW: blue gradient game window, white double frame, drop-shadowed text, name over a rule */
  .bs5 .bub { --tc: #e8ecff; background: linear-gradient(#3248b0, #121c5c 70%, #0b1240); color: #fff; border: 2px solid #e8ecff;
    border-radius: 6px; outline: 2px solid #0a0d22; box-shadow: inset 0 0 0 2px #0a0d22, inset 0 0 0 3px rgba(232, 236, 255, .35), 3px 4px 0 rgba(0, 0, 0, .5);
    text-shadow: 2px 2px 0 #000; padding: 6px 12px 8px; font: 700 18px/1.28 Verdana, Tahoma, sans-serif; }
  .bs5 .bub .bn { padding-bottom: 2px; margin-bottom: 3px; border-bottom: 1px solid rgba(232, 236, 255, .35); }
</style>
</head>
<body>
<div id="stage">
  <!-- everything in the world zooms together; speech stays screen-sized -->
  <div id="cam">
  <div id="world">
    <img id="bg" alt="">
    <svg id="screenq" viewBox="0 0 1920 1080"><polygon id="screenpoly"/></svg>
    <svg id="glowspill" viewBox="0 0 1920 1080"><defs><radialGradient id="spillg"><stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
      <ellipse id="spill" fill="url(#spillg)"/></svg>
    <div id="glowbloom"></div>
    <svg id="pbeam" viewBox="0 0 1920 1080"><defs><linearGradient id="pbg" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".65"/><stop offset=".3" stop-color="#fff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".08"/></linearGradient>
      <radialGradient id="pport"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".35" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
      <g id="pbeams"></g><circle id="pportc" r="16" fill="url(#pport)"/></svg>
    <div id="pdust"></div>
    <div id="preshow">
      <div class="ps-slide active"><div class="ps-small" id="ps-kicker">DINK DONK cinema</div>
        <div class="ps-feature"><img id="ps-poster" alt="" hidden><h2 id="ps-title">Next movie coming up</h2></div>
        <p>Moobies starting soon, take a seat...</p></div>
      <div class="ps-slide"><div class="ps-loadrow">
          <div id="ps-film" hidden><img id="ps-film-poster" alt="" hidden><p id="ps-rating" hidden></p></div>
          <div class="ps-loadcol"><p id="ps-loading">The feature will begin shortly</p>
            <h2 id="ps-ftitle" hidden></h2><p id="ps-fsub" class="ps-small" hidden></p>
            <div id="ps-progress" hidden><div id="ps-percent"></div><div id="ps-bar"><div id="ps-fill"></div><div id="ps-rider"></div></div><p id="ps-eta"></p></div></div>
          <div id="ps-meme" hidden><div id="ps-meme-em"></div><p id="ps-meme-cap"></p></div>
        </div>
        <div class="ps-small">Thank you for your patience</div></div>

<script>
(() => {
  'use strict';
  const q = new URLSearchParams(location.search);
  const QB_TEST = q.has('qb') && Number.isFinite(Number(q.get('qb'))) ? Math.max(0, Math.min(1, Number(q.get('qb')))) : null;
  const $ = (id) => document.getElementById(id);
  const h = (tag, cls, text) => { const el = document.createElement(tag); if (cls) el.className = cls; if (text != null) el.textContent = text; return el; };
  const drawn = new WeakMap();
  const style = (el, prop, value) => {

  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const rand = (a, b) => a + Math.random() * (b - a);

  const DRAFT = /^\d{2}$/.test(q.get('draft') || '') ? q.get('draft') : '13';   // draft 13 = draft 12 (lobby's padded door) + re-seated step lights at 45 % (04 Nov)
  const ART = 'roxy3d/qa11/';
  const world = $('world');
  const nameLayer = $('names');
  const bubLayer = $('bubbles');
  // bubble look: neon (owner's pick, 07 Nov 2026); ?bubstyle=0 the old dialog box, 1..5 the other drafts
  // (the control panel can switch it live: setBubStyle, "panel settings" further down)
  let BUB_STYLE = Math.min(5, Math.max(0, Math.round(Number(q.get('bubstyle') ?? 3)) || 0));
  if (BUB_STYLE) document.documentElement.classList.add(`bs${BUB_STYLE}`);
  function setBubStyle(v) {
    document.documentElement.classList.remove(`bs${BUB_STYLE}`);
    BUB_STYLE = Math.min(5, Math.max(0, Math.round(Number(v)) || 0));
    if (BUB_STYLE) document.documentElement.classList.add(`bs${BUB_STYLE}`);
  }

  // ---------- pre-show + house lights ----------
  const phases = ['seating', 'dim', 'film', 'up'];
  const show = { phase: phases.includes(q.get('phase')) ? q.get('phase') : 'seating', auto: true,
    download: { available: false }, completedAt: 0, name: '', slide: 0, audience: '',
    shot: 'push',     // how the film is framed: push (Film), movie (Movie, no zoom) or outro (Film outro)
    lightsOn: false,
    screen: 'auto',   // the panel's screen picker: auto (slides, then the film in the Film phase), upnext / loading /
                      // audience (that slide held), film (the film whatever the phase)
    litter: true,     // the panel's Litter toggle
    fullAt: 0 };      // Date.now() when the house first reached 60% (the litter clock); 0 = not yet / swept
  const SLIDES = ['upnext', 'loading', 'audience'];
  const filmOnScreen = () => show.screen === 'film' || (show.screen === 'auto' && show.phase === 'film');
  // litter (queue 60, see stepLitter)
  const LITTER = { DELAY: 10 * 60000, GROW: 25 * 60000, MAX: 140, FULL: 0.6 };
  const LITTER_PREVIEW = q.has('littermin') ? Math.max(0, Number(q.get('littermin')) || 0) * 60000 : null;
  let litterSpots = null, litterList = null, litterSeed = 0, litterShown = 0;
  const litterEls = [];
  let alwaysGreen = q.get('screen') === 'green';   // (panel setting "Screen always green", live)
  // Once the dim art has fully faded in, the lit art under it stops being drawn, so only one set is decoded.
  let dimDoneTimer = 0, lightsAt = -1e9;
  let pushWanted = false;   // Film (push) with the lights down; Lights down alone keeps the wide shot (owner 7 Nov)
  function scheduleDimDone() {
    clearTimeout(dimDoneTimer);
    const st = $('stage').classList;
    if (!st.contains('lights-down')) { st.remove('dim-done'); return; }
    if (st.contains('dim-ready')) dimDoneTimer = setTimeout(() => { if (st.contains('lights-down')) st.add('dim-done'); }, 6500);
  }
  function syncFlat() { const st = $('stage').classList; st.toggle('lights-flat', st.contains('lights-down') && !st.contains('has-dim-art')); }
  function applyPhase() {
    // lightsOn: the house lights come up while the film keeps playing (credits); the next phase brings them back
    const down = (show.phase === 'dim' || show.phase === 'film') && !show.lightsOn;
    const dimmed = down !== $('stage').classList.contains('lights-down');
    if (dimmed) {
      $('stage').classList.toggle('lights-down', down);
      syncFlat();
      lightsAt = performance.now();
      scheduleDimDone();
    }
    // Film only: the director moves onto the screen 10 s after the lights go down, or at once when they already are
    // (Lights down -> Film). Lights down alone, Movie and Film outro keep the wide shot.
    const wantPush = down && show.phase === 'film' && show.shot === 'push';
    if (wantPush !== pushWanted || (dimmed && wantPush)) {
      pushWanted = wantPush;
      director.screenAt = wantPush ? performance.now() + (dimmed ? 10000 : 0) : 0;
    }
    const green = alwaysGreen || filmOnScreen();
    holdSlide();
    $('screenq').style.display = screenPoly && green ? 'block' : 'none';
    $('preshow').style.display = screenPoly && !green ? 'block' : 'none';
    $('stage').dataset.phase = show.phase;
    screenFill();
    sendScreen();
  }
  function setPhase(phase, manual = false) {
    if (!phases.includes(phase)) return;
    if (manual) { show.auto = false; show.completedAt = 0; }
    if (phase !== show.phase) { show.shot = 'push'; show.lightsOn = false; }
    if (phase === 'seating') houseOut = false;
    show.phase = phase;
    applyPhase();
  }
  function autoPhase(now) {
    const d = show.download;
    if (!show.auto || !d.available) return;
    if (d.progress >= .9 && (show.phase === 'seating' || show.phase === 'up')) setPhase('dim');
    if (d.completed && show.completedAt && now - show.completedAt >= 10000 && show.phase !== 'film') setPhase('film');
  }
  function eta(seconds) {
    if (!Number.isFinite(seconds) || seconds < 0) return '';
    if (seconds < 60) return 'Less than a minute';
    const mins = Math.ceil(seconds / 60);
    return mins < 60 ? `About ${mins} min` : `About ${Math.floor(mins / 60)} h ${mins % 60} min`;
  }
  // polls forever: a throw while showing the result (below) no longer stops the polling, and with it the automatic
  // dim and film phases (QA 05 Nov)
  async function pollDownload() {
    try { await pollDownloadOnce(); } catch (error) { console.error('[auditorium] download', error); }
    setTimeout(pollDownload, 2000);
  }
  async function pollDownloadOnce() {
    let d = { available: false };
    try {
      const r = await fetch('/qb/progress', { cache: 'no-store', signal: AbortSignal.timeout(3500) });
      const j = r.ok && await r.json();
      if (j?.available && typeof j.name === 'string' && Number.isFinite(j.progress)) {
        d = { available: true, name: j.name, progress: clamp(j.progress, 0, 1),
          eta_s: Number.isFinite(j.eta_s) ? j.eta_s : null, state: String(j.state || ''), completed: j.completed === true };
      }
    } catch { /* old server or Web UI offline: keep a calm, useful pre-show */ }
    if (QB_TEST !== null) d = { available: true, name: q.get('qbname') || 'Test feature', progress: QB_TEST, eta_s: 240, state: 'downloading', completed: false };
    const now = performance.now();
    if (!show.auto || !d.available || !d.completed || d.name !== show.name) show.completedAt = 0;
    if (show.auto && d.completed && !show.completedAt) show.completedAt = now;
    show.name = d.name || '';
    show.download = d;
    $('ps-progress').hidden = !d.available;
    // Stay below 100 until qBittorrent actually reports completion.
    $('ps-percent').textContent = d.available ? `${d.completed ? 100 : Math.min(99, Math.floor(d.progress * 100))}%` : '';
    $('ps-fill').style.width = `${d.available ? d.progress * 100 : 0}%`;
    $('ps-eta').textContent = d.available ? (d.completed ? 'The feature is ready. Settle in...' : eta(d.eta_s)) : '';
    $('ps-meme').hidden = !d.available;
    if (d.available) ride(d.progress);
    showFeature(d.available ? d.name : '');
    autoPhase(now);
  }

  // ---------- what's downloading: title, poster and IMDb rating ----------
  // From the torrent name: the English title(s) and year of a tracker-style name
  // ("Телефонная будка / Phone Booth (Джоэл Шумахер / Joel Schumacher) [2002, США, триллер, BDRip]") or the title,
  // season and year of a scene-style one ("Black.Mirror.S03.1080p.BluRay.x265-KONTRAST"). Looked up on Cinemeta
  // (Stremio's open IMDb mirror: no key, CORS open); with no match the cleaned-up title still shows.
  function parseRelease(name) {
    const s = String(name || '');
    const yearM = s.match(/[[(]\s*((?:19|20)\d\d)\b/) || s.match(/\b((?:19|20)\d\d)\b/);
    const year = yearM ? +yearM[1] : null;
    if (s.includes(' / ')) {
      const parts = s.split(/\s[[(]/)[0].split(' / ').map((p) => p.trim()).filter(Boolean);
      const latin = parts.filter((p) => /[a-z]/i.test(p) && !/[а-яё]/i.test(p));
      const seasonM = s.match(/(?:Сезон|Season)\s*:?\s*(\d{1,2})/i);
      const series = !!seasonM || /Сери[ия]|Спецэпизод|Episode/i.test(s) || latin.length > 1;
      return { title: latin[0] || parts[0] || s, extra: latin.length > 1 ? latin.slice(1).join(' · ') : '',
        season: seasonM ? +seasonM[1] : null, year, series };
    }
    const clean = s.replace(/\.(mkv|mp4|avi|m4v|ts)$/i, '').replace(/[._]+/g, ' ');
    const cut = clean.search(/\b(S\d{1,2}(E\d{1,3})?|(19|20)\d\d|\d{3,4}p|BluRay|BDRip|BRRip|WEB|WEBRip|HDTV|DVDRip|REMUX|x26[45]|HEVC|UHD|4K)\b/i);
    const se = clean.match(/\bS(\d{1,2})(?:E(\d{1,3}))?\b/i);
    return { title: (cut > 0 ? clean.slice(0, cut) : clean).replace(/[\s([-]+$/, '').trim() || s, extra: '',
      season: se ? +se[1] : null, episode: se?.[2] ? +se[2] : null, year, series: !!se };
  }
  const CINEMETA = 'https://v3-cinemeta.strem.io';
  const norm = (t) => String(t || '').toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '');
  async function cinemeta(path) {
    const r = await fetch(`${CINEMETA}/${path}`, { signal: AbortSignal.timeout(8000) });
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }
  async function lookupRelease(rel) {
    const startYear = (m) => parseInt(m.releaseInfo || m.year, 10);
    for (const type of rel.series ? ['series', 'movie'] : ['movie', 'series']) {
      const found = (await cinemeta(`catalog/${type}/top/search=${encodeURIComponent(rel.title)}.json`)).metas || [];
      const named = found.filter((m) => norm(m.name) === norm(rel.title));
      // a film's year within one (release dates differ by country); a series started on or before the release
      const fits = (m) => !rel.year || (type === 'movie' ? Math.abs(startYear(m) - rel.year) <= 1 : !(startYear(m) > rel.year));
      const pick = named.find(fits) || (!rel.year && named[0]) || found.find((m) => fits(m) && norm(m.name).includes(norm(rel.title)));
      if (!pick) continue;
      const meta = (await cinemeta(`meta/${type}/${pick.id}.json`)).meta || pick;
      return { type, name: meta.name || pick.name, year: meta.releaseInfo || meta.year || pick.releaseInfo || '',
        rating: Number(meta.imdbRating) > 0 ? Number(meta.imdbRating).toFixed(1) : '',
        genres: (meta.genres || []).slice(0, 2), poster: `https://images.metahub.space/poster/medium/${pick.id}/img` };
    }
    return null;
  }
  // one lookup per release name, remembered for a week across reloads
  const featureCache = new Map();
  function featureInfo(name) {
    if (!featureCache.has(name)) {
      featureCache.set(name, (async () => {
        const key = `auditorium-feature:${name}`;
        try { const c = JSON.parse(localStorage.getItem(key) || 'null'); if (c && Date.now() - c.at < 7 * 86400000) return c.info; } catch { /* no storage */ }
        const rel = parseRelease(name);
        let found = null;
        try { found = await lookupRelease(rel); } catch { featureCache.delete(name); }   // offline: try again next poll
        const info = { rel, found };
        if (found) try { localStorage.setItem(key, JSON.stringify({ at: Date.now(), info })); } catch { /* no storage */ }
        return info;
      })());
    }
    return featureCache.get(name);
  }
  let featureShown = null, tonightFeature = null;
  async function showFeature(name) {
    if (name === featureShown) return;
    featureShown = name;
    const info = name ? await featureInfo(name) : null;
    if (name !== featureShown) return;   // the download changed while this was looked up
    // the lookup failed (offline; featureInfo dropped it from the cache): look again in a minute. It never retried,
    // since the next poll returned early on the same name (QA 05 Nov)
    if (name && !featureCache.has(name)) setTimeout(() => { if (featureShown === name) featureShown = null; }, 60000);
    const { rel, found } = info || {};
    $('ps-loading').textContent = name ? 'Now loading' : 'The feature will begin shortly';
    $('ps-ftitle').hidden = !info;
    $('ps-ftitle').textContent = found?.name || rel?.title || '';
    const sub = [];
    if (rel?.extra) sub.push(rel.extra);
    else if (rel?.season) sub.push(`Season ${rel.season}${rel.episode ? `, episode ${rel.episode}` : ''}`);
    // the release's own year first (a season or special, not when the series started); genres when there's room
    const year = rel?.year || (found?.type === 'series' ? '' : found?.year);
    if (year) sub.push(String(year));
    if (found?.genres?.length && sub.length < 2) sub.push(found.genres.join(', '));
    $('ps-fsub').hidden = !sub.length;
    $('ps-fsub').textContent = sub.join(' · ');
    $('ps-film').hidden = !found;
    const im = $('ps-film-poster');
    im.hidden = !found?.poster;
    im.onerror = () => { im.hidden = true; };
    if (found?.poster) im.src = found.poster; else im.removeAttribute('src');
    $('ps-rating').hidden = !found?.rating;
    // (text nodes, not innerHTML: the rating comes from an outside API)
    $('ps-rating').replaceChildren(...(found?.rating ? [h('b', '', `★ ${found.rating}`), ' IMDb'] : []));
    tonightFeature = found;
    tonight();
  }

  // ---------- download memes ----------
  // DGG jokes (from roxy3d/memes/SHORTLIST.md), each with an emote that fits: a new one each time the loading
  // slide comes round
  const MEMES = [
    ['WWWWaiting', 'Feature in 5™'],
    ['Hmm', 'The slow blade penetrates the shield.'],
    ['DinkDonk', 'BREAKING NEWS: still loading'],
    ['NOTHINGBURGER', 'Nothing ever happens.'],
    ['YesHoney', 'YES OR NO: is it done yet?'],
    ['Clueless', 'Seeding after the movie, right?'],
    ['CINEMA', 'Absolute cinema. Soon.'],
    ['glorp', 'It came from the chat.'],
  ];
  let memeAt = Math.floor(Math.random() * MEMES.length);
  // an emote at most `height` tall and `maxW` wide
  const emoteFit = (name, height, maxW) => { const { w, h: eh } = SB.emoteSize(name); return SB.emoteEl(name, Math.min(height, maxW * eh / w)); };
  function nextMeme(step = 1) {
    memeAt += step;
    const [emote, cap] = MEMES[memeAt % MEMES.length];
    $('ps-meme-em').replaceChildren(emoteFit(emote, 96, 170));
    $('ps-meme-cap').textContent = cap;
  }
  // chat's most-posted emote of the last 3 minutes rides the progress bar (Buddy when chat is quiet)
  const chatEmotes = [];
  let riderName = '';
  function topEmote(now) {
    while (chatEmotes.length && now - chatEmotes[0][0] > 180000) chatEmotes.shift();
    const count = new Map();
    for (const [, e] of chatEmotes) count.set(e, (count.get(e) || 0) + 1);
    let best = 'dggL', n = 0;
    for (const [e, c] of count) if (c > n) { best = e; n = c; }
    return best;
  }
  function ride(progress) {
    const name = topEmote(performance.now());
    if (name !== riderName) {
      riderName = name;
      const el = emoteFit(name, 30, 70);
      SB.faceEmote(el, name, 1);   // looks the way the bar fills
      $('ps-rider').replaceChildren(el);
    }
    $('ps-rider').style.left = `${progress * 100}%`;
  }
  // every emote chat posts while the feature loads floats up one of the screen's edges, a few at a time
  let lastPop = 0;
  function popEmote(name) {
    const now = performance.now(), pops = $('ps-pops');
    if (!name || now - lastPop < 900 || pops.childElementCount >= 6) return;
    lastPop = now;
    const el = h('div', 'ps-pop');
    // the outer strips only, clear of the meme and the progress (the row spans about 13-87 % of the screen)
    el.appendChild(emoteFit(name, 46, 70));
    el.style.left = `${Math.random() < 0.5 ? rand(1, 5) : rand(88, 92)}%`;
    el.addEventListener('animationend', () => el.remove());
    pops.appendChild(el);
  }
  SB.on('msg', (m) => {
    const names = [...new Set(m.emotes || [])];
    const now = performance.now();
    for (const e of names) chatEmotes.push([now, e]);
    // trimmed here too: topEmote() only runs while a download shows, and hours without one grew this without end
    while (chatEmotes.length && now - chatEmotes[0][0] > 180000) chatEmotes.shift();
    if (show.download.available && $('preshow').style.display === 'block') popEmote(names[0]);
  });
  nextMeme(0);
  // emote art arrives after the page starts: redraw the meme and the rider with it
  SB.on('emotes', () => { nextMeme(0); riderName = ''; });
  // The film coming up = the winner of the newest film poll, unless it has been played already. A played poll winner
  // shows up in the ratings (and in history with that poll's id), so "Tonight" never names the film that just ended.
  // A conductor's pick without a poll can't be known in advance: then the screen stays on the generic title.
  const titleKey = (t) => String(t || '').replace(/\s*\(\d{4}\)\s*$/, '').toLowerCase().replace(/[^a-z0-9]+/g, '');
  function upcomingFilm(data) {
    const ended = (p) => data?.details?.polls?.[p.id]?.endedAt || 0;
    const polls = (data?.polls || []).map((p, i) => ({ p, i, w: p.winners?.[0] }))
      .filter(({ w }) => w && (w.poster || /\(\d{4}\)\s*$/.test(w.title || '')))   // film polls only (not "Yes", "Conductor choice")
      .sort((a, b) => ended(b.p) - ended(a.p) || a.i - b.i);                         // newest first; the list order breaks ties
    const latest = polls[0];
    if (!latest) return null;
    const key = titleKey(latest.w.title);
    const rated = [...(data?.ratings || []), ...Object.values(data?.details?.ratings || {})].some((r) => titleKey(r.title) === key);
    const played = (data?.history || []).some((h) => h.polls?.includes(latest.p.id) || (titleKey(h.title) === key && h.watchedTs >= ended(latest.p)));
    if (rated || played) return null;
    return { title: latest.w.title.replace(/\s*\(\d{4}\)\s*$/, ''), poster: latest.w.poster };
  }
  // Up next: the poll winner (said as such); without one, what is downloading (once it is found on Cinemeta); without
  // either, no title is claimed
  let pollFilm = null;
  Cinema.onRooms((rooms, data) => {
    const film = upcomingFilm(data);
    const card = film && [...(data?.ratings || []), ...(data?.best || []), ...(data?.worst || [])].find((r) => titleKey(r.title) === titleKey(film.title));
    pollFilm = film && { title: film.title, poster: film.poster || card?.poster };
    tonight();
  });
  function tonight() {
    const film = pollFilm || (tonightFeature && { title: tonightFeature.name, poster: tonightFeature.poster });
    $('ps-kicker').textContent = pollFilm ? 'Up next · chat voted for' : film ? 'Up next' : 'DINK DONK cinema';
    $('ps-title').textContent = film ? film.title : 'Next movie coming up';
    const poster = film?.poster;
    const im = $('ps-poster');
    im.hidden = !poster;
    im.onerror = () => { im.hidden = true; };

  }
  // ?slidefade=seq: the old slide fades out (0.4 s) before the next fades in (0.4 s), so two are never half visible
  // together (default: the 0.8 s cross-fade)
  let SEQ_FADE = q.get('slidefade') === 'seq';   // (panel setting "Pre-show slide change", live: setSeqFade)
  function setSeqFade(on) {
    SEQ_FADE = !!on;
    document.querySelectorAll('.ps-slide').forEach((el) => { el.style.transition = SEQ_FADE ? 'opacity .4s' : ''; });
  }
  if (SEQ_FADE) setSeqFade(true);
  // the panel's screen picker holds one slide (no rotation); auto rotates them
  function showSlide(i) {
    const slides = document.querySelectorAll('.ps-slide');
    if (i === show.slide) return;
    slides[show.slide].classList.remove('active');
    show.slide = i;
    if (slides[i].contains($('ps-meme'))) nextMeme();
    const next = slides[i];
    if (SEQ_FADE) setTimeout(() => { if (show.slide === i) next.classList.add('active'); }, 400); else next.classList.add('active');
  }
  function holdSlide() { const i = SLIDES.indexOf(show.screen); if (i >= 0) showSlide(i); }
  setInterval(() => {
    if (show.screen !== 'auto') return;
    const slides = document.querySelectorAll('.ps-slide');
    slides[show.slide].classList.remove('active');
    show.slide = (show.slide + 1) % slides.length;
    if (slides[show.slide].contains($('ps-meme'))) nextMeme();
    const next = slides[show.slide];
    if (SEQ_FADE) setTimeout(() => next.classList.add('active'), 400); else next.classList.add('active');
  }, 8000);
  function audience() {
    const seated = [...walkers.values()].filter((w) => w.sitting);
    const key = seated.map((w) => `${w.key}:${w.nm.style.color}:${w.rainbow}`).join('|');
    if (key === show.audience) return;
    show.audience = key;
    const credits = $('ps-credits');
    credits.replaceChildren();
    for (const w of seated) {
      const line = h('div');
      line.style.color = w.nm.style.color;
      line.append(h('span', w.rainbow ? 'rbt' : '', w.nick));
      credits.append(line);
    }
    credits.style.animationDuration = `${Math.max(24, seated.length * 1.6)}s`;
  }
  let scale = 1;
  const ZOOM = clamp(Number(q.get('zoom')) || 1.85, 1.2, 3);
  const DIRECTOR_ON = q.get('director') !== '0';
  // ?maxres=<px height> (off by default): never pick art sharper than this output height needs, zoom included
  const MAXK = q.has('maxres') ? clamp((Number(q.get('maxres')) || 1080) / 1080, 0.5, 4) : Infinity;
  const dpr = () => Math.min(MAXK, scale * (devicePixelRatio || 1) *
    (director.on || director.follow || director.wantNext || director.screenAt ? director.zoom : 1));
  const artImgs = [];           // { im, file, file_2x }; geometry always stays in 1920x1080 coordinates
  const dimImgs = [];           // paired directly above their lit image, at the same depth
  let artTwo = null;
  let doorFile = '';

    const bod = el.appendChild(h('div', 'bod'));
    const { w: ew, h: eh } = SB.emoteSize(m.emote);
    const em = SB.emoteEl(m.emote, Math.min(EH, MAXW * eh / ew));
    em.classList.add('em');
    em.style.left = `${-parseFloat(em.style.width) / 2}px`;
    bod.append(em);
    // most bring something from the snack bar (owner: most should have popcorn); some check their phone once seated
    const item = rr() < 0.85 ? itemEl(rr() < 0.2 ? 'soda' : 'popcorn') : null;
    if (item) bod.append(item);
    const phone = rr() < PHONE_SHARE ? bod.appendChild(h('div', 'phone')) : null;
    const nm = nameLayer.appendChild(h('div', 'nm', m.nick));
    nm.style.visibility = 'hidden';
    world.append(el);
    const w = { key, nick: m.nick, el, sh, bod, em, emName: m.emote, nm, bounce: 0, emW: parseFloat(em.style.width) || EH, emH: parseFloat(em.style.height) || EH, path: [], seg: 0, t: 0, pos: [0, 0, 0], seat: null, sitting: false,
      pending: [], bub: null, bubT: 0, alpha: 0, phase: rand(0, 6.28), nameT: 0, lookT: 0, seen: false,
      item, phone, phoneT: rand(8, 40), hideLocal: 0, lastMsg: performance.now(), dozeAfter: DOZE * rand(0.8, 1.6), recent: [] };
    placeItem(w);
    nameStyle(w, m);
    checkAvatar(w);
    return w;
  }

  // a free seat: friends you mention first, then the middle of the hall, leaving a gap to strangers
  // The front row is the wheelchair row (owner's joke): YEE chatters sit there and only there, everyone else
  // keeps out of it - unless their side of the hall is full.
  // every yee emote counts: the source names of the DSA userscript's IDEOLOGICAL_EMOTE_MAP
  const YEE_EMOTES = new Set(['YEE', 'diNoThanks', 'YeeMODS', 'YeeLaugh', 'YeeSmug', 'nathanYee', 'TeddYEE', 'ComfYEE',
    'diNOWAY', 'YEEHAW', 'FeelsPeekMan', 'KYEK', 'YAM']);
  function chooseSeat(m) {
    const front = (s) => s.row === rows[0];
    const yee = YEE_EMOTES.has(m.emote);
    let free = seats.filter((s) => !s.taken && front(s) === yee);
    if (!free.length && yee) free = seats.filter((s) => !s.taken);   // front row ONLY for Yee (owner 8 Nov)
    if (!free.length) return null;
    const text = (m.text || '').toLowerCase();
    for (const w of walkers.values()) {
      if (!w.seat || !text.includes(w.key)) continue;
      const near = free.filter((s) => s.row === w.seat.row && Math.abs(s.u - w.seat.u) < 0.9);
      if (near.length) return near[0];
    }
    const full = 1 - free.length / seats.length;
    const mid = (14.1 + 4.5) / 2;
    const weight = (s) => {
      let wgt = { B: 0.5, C: 0.8, D: 1.1, E: 1.4, F: 1.5, G: 1.3, H: 1, I: 0.8 }[s.row.name] ?? 1;
      wgt *= s.block === 'main' ? 1.6 - Math.abs(s.u - mid) / 8 : 0.55;
      if (full < 0.5 && seats.some((o) => o.taken && o.row === s.row && Math.abs(o.u - s.u) < 0.9)) wgt *= 0.3;
      return Math.max(0.02, wgt);
    };
    let total = 0;
    const ws = free.map((s) => (total += weight(s)));
    const r = Math.random() * total;
    return free[ws.findIndex((x) => x >= r)];
  }

  // tunnel -> cross-aisle -> stair aisle (left, or right for the right edge block) -> legroom -> seat
  function routeTo(seat) {
    const pts = L.walk_route.rear_portal_to_cross_aisle.map((p) => [...p]);
    const row = seat.row;
    const right = seat.block === 'right';
    const aisleU = right ? 15.15 : 3.475;
    const cross = pts[pts.length - 1];
    if (right) pts.push([aisleU, cross[1], 24]);
    const legV = row.v - LEG_DV;
    if (row.flat) {
      pts.push([aisleU, legV, row.z]);
    } else {
      for (const [a, b, z] of treads) {
        const mv = (a + b) / 2;
        if (mv > legV) break;
        pts.push([aisleU, mv, z]);
      }
      pts.push([aisleU, legV, row.z]);
    }
    pts.push([seat.u, legV, row.z]);
    return pts;
  }

  function spawn(m) {
    if (guests() >= seats.length) return false;
    const portal = L.walk_route.rear_portal_to_cross_aisle[0];
    for (const w of walkers.values()) {
      if (!w.sitting && Math.hypot(w.pos[0] - portal[0], w.pos[1] - portal[1], (w.pos[2] - portal[2]) / 60) < WALK_GAP) return false;
    }
    // shared room: the server picked the seat (waiting outside until it has one); a seat already taken here (this
    // screen drifted) falls back to the page's own choice
    let seat;
    if (m.room) {
      if (!m.seat) return false;
      seat = seatById(m.seat);
      if (!seat || seat.taken) seat = chooseSeat(m);
    } else seat = chooseSeat(m);
    if (!seat) return false;   // full house: retain the head of the FIFO outside the portal
    seat.taken = true;
    const w = makeWalker(m);
    w.seat = seat;
    w.path = routeTo(seat);
    w.pos = [...w.path[0]];
    // the entrance door opens for them; they wait outside until it's open
    if (door) { playDoor(); w.wait = DOOR_WAIT; }
    pendingSpeech(w, m.tokens);
    pendingSpeech(w, m.more);
    walkers.set(w.key, w);
    directorArrival(w, m);
    return true;
  }
  const seatById = (id) => seats.find((s) => `${s.row.name}:${s.block}:${s.u}` === id) || null;

  function onMessage(m) {
    const nick = String(m.nick || '').trim().slice(0, 25);
    if (!nick) return;
    if (m.features?.includes('moderator')) return;   // mods are the jannies (onModMessage): they never take a seat
    m = { nick, emote: m.emote || Cinema.defaultEmote(nick), text: String(m.text || '').slice(0, 512),
      tokens: shortTokens(m.tokens), color: m.color, rainbow: !!m.rainbow,
      room: !!m.room, seat: m.seat ?? null, seed: m.seed, follow: !!m.follow };
    const key = nick.toLowerCase();
    const w = walkers.get(key);
    if (!w) {
      const queued = arrivals.find((a) => a.nick.toLowerCase() === key);
      const now = performance.now();
      if (!queued) {
        // a full queue makes room by dropping whoever has been quiet longest (it used to refuse every new nick, so a
        // long night locked the queue to its first 270 chatters; QA 05 Nov)
        if (arrivals.length >= MAX_QUEUE) arrivals.splice(arrivals.reduce((o, x, i) => (x.at < arrivals[o].at ? i : o), 0), 1);
        m.at = now;
        arrivals.push(m);
      } else { if (m.tokens.length) queued.more = m.tokens; queued.color = m.color; queued.rainbow = m.rainbow; queued.at = now; if (m.seat) queued.seat = m.seat; }
      return;
    }
    if (w.out) return;   // on their way out (banned / muted)
    nameStyle(w, m);
    if (!m.tokens?.length) return;
    // they talk wherever they are; only someone out of sight (in the tunnel) saves it for when they come out
    if (w.seen) say(w, m.tokens);
    else pendingSpeech(w, m.tokens);
  }

  function removeWalker(w) {
    if (director.follow?.w === w) endFollow();
    dropBubble(w);
    w.el.remove();
    w.nm.remove();
    if (w.seat) w.seat.taken = false;
    walkers.delete(w.key);
    if (w.jan) jannies.delete(w.key);
    // a janny removed on its way to escort someone (purged, panel): they leave alone instead of waiting in their seat
    // for good (onPurge ignores anyone already on the way out; QA 05 Nov)
    const et = w.jan && w.escortT;
    if (et && et !== w && walkers.get(et.key) === et && et.sitting && et.out) standUp(et);
    doze(w, false);
    if (w === usher) { if (w.queued) w.queued.shushBy = null; if (w.spotQ) w.spotQ.spotBy = null; usher = null; }
    w.pending.length = 0;
    w.path.length = 0;
  }
  function removeNick(key) {
    const w = walkers.get(key);
    if (w) removeWalker(w);
    for (let i = arrivals.length - 1; i >= 0; i--) if (arrivals[i].nick.toLowerCase() === key) arrivals.splice(i, 1);
  }

  // ---------- jannies: DGG mods mop the front of the hall ----------
  // Same as the lobby (lobby.html "jannies"): no janitor at the start; any chat message from a DGG moderator (tagged
  // or not) brings a cpMOP penguin wearing their name in through the entrance. Owner (04 Nov): here they mop the
  // front part (the floor between the screen and row B) and never sit down. One janny per spot, 10-18 s per spot,
  // their messages are said as bubbles, and 10 min without a message they clock off the way they came.
  let JAN_IDLE = clamp(Number(q.get('janidle')) || 600, 20, 3600) * 1000;   // ?janidle=<s> for testing
  const JAN_IMG = 'assets/cpMOP.webp';
  const JAN_U = [1.4, 5.0, 7.6, 10.2, 12.8, 16.2];   // front floor spots; row B's own aisle (u 3.475) leads down to it
  const JAN_V = 1.55;
  const jannies = new Map();   // nick (lower case) -> walker with jan: true
  function onModMessage(m) {
    if (!L || !m.features?.includes('moderator')) return;
    const key = String(m.nick || '').trim().toLowerCase();
    if (!key) return;
    let j = jannies.get(key);   // one already clocking off still leaves; the next message brings them back
    if (!j) {
      const seated = walkers.get(key);   // came in as a chatter before they spoke as a mod
      if (seated) removeWalker(seated);
      j = addJanny(m);
    }
    if (!j) return;
    j.lastMsg = performance.now();
    nameStyle(j, m);
    const tokens = shortTokens(m.tokens);
    if (!tokens.length) return;
    if (j.seen) say(j, tokens); else pendingSpeech(j, tokens);
  }
  function addJanny(m) {
    if (jannies.size >= JAN_U.length) return null;   // every spot has its janny
    const key = m.nick.toLowerCase();
    const el = h('div', 'w jan');
    const sh = el.appendChild(h('div', 'sh'));
    const bod = el.appendChild(h('div', 'bod'));
    // the cpMOP penguin (mop and bucket) instead of an emote, at the lobby's size for this camera (52 of its 50 px)
    const emH = EH * 52 / 50, emW = Math.round(emH * 144 / 128);
    const em = bod.appendChild(h('img', 'em'));
    em.alt = '';
    em.src = JAN_IMG;
    Object.assign(em.style, { height: `${emH}px`, width: `${emW}px`, left: `${-emW / 2}px` });
    Object.assign(sh.style, { width: '30px', left: '-15px' });
    const nm = nameLayer.appendChild(h('div', 'nm', m.nick));
    nm.style.visibility = 'hidden';
    world.append(el);
    const portal = L.walk_route.rear_portal_to_cross_aisle;
    const w = { key, nick: m.nick, el, sh, bod, em, emName: 'cpMOP', nm, bounce: 0, emW, emH, path: [...portal.map((p) => [...p])], seg: 0, t: 0,
      pos: [...portal[0]], seat: null, sitting: false, pending: [], bub: null, bubT: 0, alpha: 0, phase: rand(0, 6.28), nameT: 8,
      lookT: 0, seen: false, item: null, phone: null, phoneT: 0, hideLocal: 0, jan: true, spot: null, mopUntil: 0, lastMsg: performance.now() };
    if (door) { playDoor(); w.wait = DOOR_WAIT; }
    w.onArrive = janNext;
    walkers.set(key, w);
    jannies.set(key, w);
    return w;
  }
  // from the cross-aisle down row B's aisle to the front floor, then along it to a free spot, and mop it
  function janNext(j) {
    if (j.leaving) return;
    if (j.queued) { const next = j.queued; j.queued = null; next(j); return; }   // called in to escort someone out
    if (performance.now() - j.lastMsg > JAN_IDLE) { janLeave(j); return; }
    const taken = new Set([...jannies.values()].filter((o) => o !== j && !o.leaving).map((o) => o.spot));
    const free = JAN_U.map((_, i) => i).filter((i) => i !== j.spot && !taken.has(i));
    const next = free.length ? free[Math.floor(Math.random() * free.length)] : j.spot ?? 0;
    const z = rows[0]?.z ?? 24;
    const at = [JAN_U[next] + rand(-0.3, 0.3), JAN_V + rand(-0.25, 0.25), z];
    const path = [[...j.pos]];
    if (j.spot == null) path.push([3.475, 2.9, z], [3.475, JAN_V, z]);   // first time: down from the cross-aisle
    path.push(at);
    j.spot = next;
    j.mopUntil = 0;
    j.path = path;
    j.seg = 0;
    j.t = 0;
    j.onArrive = (x) => { x.mopUntil = performance.now() + rand(10, 18) * 1000; SB.faceEmote(x.em, x.emName, Math.random() < 0.5 ? 1 : -1); };
  }
  // clocks off: back up the aisle and out through the entrance
  function janLeave(j) {
    j.leaving = true;
    j.mopUntil = 0;
    const z = rows[0]?.z ?? 24;
    // down the aisle to the front first only from the rows: from the cross aisle that was a detour down and back up
    const crossV = L.walk_route.rear_portal_to_cross_aisle.at(-1)[1];
    const down = j.pos[1] < crossV - 0.5 ? [[3.475, j.pos[1], z], [3.475, 2.9, z]] : [];
    j.path = [[...j.pos], ...down, ...[...L.walk_route.rear_portal_to_cross_aisle].reverse().map((p) => [...p])];
    j.seg = 0;
    j.t = 0;
    j.onArrive = (x) => removeWalker(x);
  }
  // the lobby's floating text, in world space (it zooms with the camera, like the names)
  function floatAt(w, text, color) {
    const [x, y] = P(...w.pos);
    const el = nameLayer.appendChild(h('div', 'fl', text));
    el.style.color = color;
    const top = y - w.emH - 30;
    el.animate([
      { transform: `translate(${x}px, ${top}px) translate(-50%, 0)`, opacity: 0 },
      { transform: `translate(${x}px, ${top - 10}px) translate(-50%, 0)`, opacity: 1, offset: 0.15 },
      { transform: `translate(${x}px, ${top - 38}px) translate(-50%, 0)`, opacity: 0 },
    ], { duration: 1500, easing: 'ease-out' }).onfinish = () => el.remove();
  }
  function stepJannies(now) {
    for (const j of jannies.values()) if (j.mopUntil && now > j.mopUntil) janNext(j);
  }
  SB.on('msg', onModMessage);

  // ---------- staff errands: walking into a row and back ----------
  const dark = () => show.phase === 'dim' || show.phase === 'film';
  function go(w, path, next) { w.path = path; w.seg = 0; w.t = 0; w.onArrive = next; }
  function hold(w, secs, next) { go(w, [[...w.pos], [...w.pos]], next); w.wait = secs; }
  // from the cross-aisle, up the stair aisle of that block (the right one for the right edge block) to the row's
  // legroom, then along it to u - the same way chatters go to their seats (routeTo)
  function aisleTo(row, block, u) {
    const aisleU = block === 'right' ? 15.15 : 3.475;
    const crossV = L.walk_route.rear_portal_to_cross_aisle.at(-1)[1];
    const legV = row.v - LEG_DV;
    const pts = [[aisleU, crossV, 24]];
    if (!row.flat) for (const [a, b, z] of treads) { const mv = (a + b) / 2; if (mv > legV) break; pts.push([aisleU, mv, z]); }
    pts.push([aisleU, legV, row.z], [u, legV, row.z]);
    return pts;
  }
  // a spot in the legroom beside a seated chatter: on the far side from the aisle (so the chatter leads the way
  // out), or on the aisle side at the end of a block
  function besideU(t) {
    const seat = t.seat;
    const us = seats.filter((s) => s.row === seat.row && s.block === seat.block).map((s) => s.u);
    const toAisle = seat.block === 'left' ? 1 : -1;
    const far = seat.u - toAisle * 0.75;
    return far >= Math.min(...us) - 0.2 && far <= Math.max(...us) + 0.2 ? far : seat.u + toAisle * 0.75;
  }
  // a janny starts on the front floor (row B's legroom is that floor), the usher on the cross-aisle
  function visitPath(s, t) {
    const row = t.seat.row, u = besideU(t);
    const crossV = L.walk_route.rear_portal_to_cross_aisle.at(-1)[1];
    if (s.jan && row === rows[0] && s.pos[1] < crossV - 0.5) return [[...s.pos], [u, row.v - LEG_DV, row.z]];
    const pre = s.jan ? [[...s.pos], [3.475, s.pos[1], 24], [3.475, crossV, 24]] : [[...s.pos]];
    return [...pre, ...aisleTo(row, t.seat.block, u)];
  }
  const freeJanny = (j) => !j.leaving && !j.task && !j.queued && j.spot != null && j.seen;
  function nearestJanny(t) {
    let best = null, bd = Infinity;
    for (const j of jannies.values()) {
      if (!freeJanny(j)) continue;
      const d = Math.hypot(j.pos[0] - t.pos[0], j.pos[1] - t.pos[1]);
      if (d < bd) { bd = d; best = j; }
    }
    return best;
  }
  function faceToward(s, t) { SB.faceEmote(s.em, s.emName, P(...t.pos)[0] - P(...s.pos)[0]); }
  // back to the spot it left, mopping again for a bit
  function janBack(j) { j.task = null; if (!j.leaving) j.mopUntil = performance.now() + rand(6, 12) * 1000; }

  // ---------- dozing: quiet chatters nod off; their next message wakes them ----------
  let DOZE = clamp(Number(q.get('doze')) || 600, 10, 7200) * 1000;   // ?doze=<s> for testing
  const ZZ_MAX = 12;   // z's on at most this many sleepers (the rest just nod)
  let zzCount = 0;
  function doze(w, on) {
    if (!!w.dozing === on) return;
    w.dozing = on;
    if (on) {
      if (w.phone) { w.phone.classList.remove('on'); w.texting = false; }
      if (zzCount < ZZ_MAX) {
        w.zz = nameLayer.appendChild(h('div', 'zz'));
        w.zz.append(h('span', '', 'z'), h('span', '', 'z'), h('span', '', 'Z'));
        zzCount += 1;
      }
    } else if (w.zz) { w.zz.remove(); w.zz = null; zzCount -= 1; }
  }

  // ---------- phones in the dark: a chatter who keeps talking gets the phone out and a shush ----------
  let CHATTY = clamp(Number(q.get('chatty')) || 3, 2, 20);   // messages within a minute
  // Every chat message of someone already inside counts, tagged or not (only tagged ones become bubbles):
  // quiet in chat = nodding off, busy in chat in the dark = on their phone.
  SB.on('msg', (m) => {
    const w = walkers.get(String(m.nick || '').trim().toLowerCase());
    if (w && !w.jan && !w.usher && !w.out) noteMessage(w);
  });
  function noteMessage(w) {
    const now = performance.now();
    w.lastMsg = now;
    w.dozeAfter = DOZE * rand(0.8, 1.6);
    doze(w, false);
    w.recent = w.recent.filter((t) => now - t < 60000);
    w.recent.push(now);
    if (dark() && w.sitting && !w.texting && w.recent.length >= CHATTY && !(w.shushCool > now)) {
      if (!w.phone) w.phone = w.bod.appendChild(h('div', 'phone'));
      w.phone.classList.add('on');
      w.texting = true;
      w.phoneT = 30;
      placeItem(w);
      requestShush(w);
    }
  }
  // the nearest free janny walks over; with none on duty the usher does it after the current round
  function requestShush(t) {
    if (t.shushBy && walkers.get(t.shushBy.key) === t.shushBy) return;
    t.shushBy = null;
    const j = nearestJanny(t);
    if (j) shush(j, t);
    else if (usher && !usher.leaving && !usher.queued) { usher.queued = t; t.shushBy = usher; }
  }
  function shush(s, t) {
    s.task = 'shush';
    s.mopUntil = 0;
    s.sweep = null;
    t.shushBy = s;
    const there = visitPath(s, t);
    go(s, there, (x) => {
      if (walkers.get(t.key) === t && t.sitting && !t.out) {
        faceToward(x, t);
        floatAt(t, '🤫 shh!', '#ffd27a');
        if (t.phone) t.phone.classList.remove('on');
        t.texting = false;
        t.phoneT = rand(60, 120);
        t.shushCool = performance.now() + 120000;
        if (x.usher) x.spot = { w: t, until: performance.now() + 2500 };
      }
      t.shushBy = null;
      hold(x, 2, (y) => go(y, [...there].reverse(), y.jan ? janBack : usherNext));
    });
  }

  // ---------- bans / mutes: a janny walks them out ----------
  // The mod who did it comes over if they're on duty (or is called in through the entrance if there's a free
  // spot), else the nearest janny; with no janny at all the chatter gets up and leaves alone.
  const modActs = new Map();   // target (lower case) -> { kind, by }: shared/core.js sends it just before 'purge'
  SB.on('modAction', (a) => {
    if (modActs.size > 50) modActs.delete(modActs.keys().next().value);
    modActs.set(String(a.nick || '').toLowerCase(), a);
  });
  function onPurge(nick) {
    const key = String(nick).trim().toLowerCase();
    const info = modActs.get(key);
    modActs.delete(key);
    const w = walkers.get(key);
    if (w?.out) return;
    if (!L || !w || !w.sitting || w.jan || w.usher) { removeNick(key); return; }
    for (let i = arrivals.length - 1; i >= 0; i--) if (arrivals[i].nick.toLowerCase() === key) arrivals.splice(i, 1);
    escort(w, info);
  }
  function escort(t, info) {
    goingOut(t, info?.kind === 'MUTE' ? '🔇 muted' : '🚫 banned');
    const by = String(info?.by || '').toLowerCase();
    let j = by && jannies.get(by);
    if (!j || !freeJanny(j)) j = nearestJanny(t);
    if (j) { escortWalk(j, t); return; }
    if (by && !jannies.has(by)) {
      // the mod came in as a chatter first: that figure goes (as in onModMessage), else the janny replaced it in
      // `walkers` and it stayed frozen in its seat for good, seat taken, drawn through the rows (QA 05 Nov)
      const seated = walkers.get(by);
      if (seated === t) { standUp(t); return; }   // banned / muted themselves: they just walk out
      if (seated && seated !== t && !seated.jan && jannies.size < JAN_U.length) removeWalker(seated);   // (only if one can come)
      const called = addJanny({ nick: String(info.by).slice(0, 25) });
      if (called) { called.queued = (x) => escortWalk(x, t); called.escortT = t; return; }
    }
    standUp(t);
  }
  function escortWalk(j, t) {
    j.task = 'escort';
    j.escortT = t;   // if this janny is removed on the way, t leaves alone (removeWalker)
    j.mopUntil = 0;
    if (walkers.get(t.key) !== t || !t.sitting) { j.task = null; if (j.spot == null) janNext(j); else janBack(j); return; }
    const there = visitPath(j, t);
    go(j, there, (x) => {

    cullPieces();
    stepCamera(dt);

    for (const w of bubOrder) if (w.bub && w.bubbleMeasured !== w.bub) {

  // Neighbours who sit down together both showed their names on top of each other (QA 04 Nov: 16 clashes in 5 min,

  // overlap a name already shown waits (fades out) until it is clear.
  const nameRank = (w) => (director.follow?.w === w ? 1e6 : 0) + (w.jan ? 1e5 : 0) + w.nameT;
  function showNames() {
    const shown = [];

      const clash = shown.some((s) => r[0] < s[2] + 2 && r[2] > s[0] - 2 && r[1] < s[3] && r[3] > s[1]);

  // Project earlier walkers onto the next stretch of this route. Looking past short tread segments and
  // corners preserves the gap at bends; height separates the tunnel from the seats above it. Seated
  // people never block the legroom. Only earlier arrivals block, so branches cannot create a wait cycle.
  function blockedAhead(w, travel, ahead) {
    let allowed = travel;
    let along = 0;
    for (let i = w.seg; i < w.path.length - 1 && along < WALK_GAP + travel; i++) {
      const a = i === w.seg ? w.pos : w.path[i];

    }
    if (w.sitting && w.lookT > 0) {
      w.lookT = Math.max(0, w.lookT - dt);
      if (!w.lookT) SB.faceEmote(w.em, w.emName, 1);
    }
    // dozing: leans over and sinks a little into the seat, breathing slowly
    w.dozeK = (w.dozeK || 0) + ((w.dozing ? 1 : 0) - (w.dozeK || 0)) * Math.min(1, dt * 1.2);

    // the depth slices cover them; without slices they fade out

    const inTunnel = u < 2.9 && v > 8.8 && z < 10;
    if (!w.seen && !inTunnel) { w.nameT = 5; if (w.jan && !w.leaving && !w.onDuty) { w.onDuty = true; floatAt(w, '🧹 janny on duty', '#7ff7f0'); } }
    w.seen = !inTunnel;
    w.alpha += ((w.seen || layers ? 1 : 0) - w.alpha) * Math.min(1, dt * 8);

    const inRow = w.sitting || (!layers && w.seat && w.seg >= w.path.length - 2 && Math.abs(v - (w.seat.v - LEG_DV)) < 0.05);

    style(w.sh, 'transform', `translateY(${lift.toFixed(1)}px) scale(${shS.toFixed(2)})`);
    style(w.sh, 'opacity', shS.toFixed(2));
    style(w.el, 'opacity', w.alpha.toFixed(3));
    const zi = layers ? depthZ(u, v, z) : Math.round((u + v) * 100) + 10;
    style(w.el, 'zIndex', String(zi));

    w.box = [x - w.emW * grow / 2 - 10, y - lift - w.emH * grow - 10, x + w.emW * grow / 2 + 10, y + 8, zi];
    w.nameT = Math.max(0, w.nameT - dt);

      // it is hidden but its clock runs (the camera can hold on the screen for a whole film): off-view bubbles were
      // clamped into the screen's corner and piled up there (QA 04 Nov)
      const [vx, vy] = toScreen(x, y - lift);
      style(w.bub, 'visibility', w.seen && vx > 10 && vx < 1910 && vy > 10 && vy < 1075 ? '' : 'hidden');  // QA perf: cached write
      if (w.seen) w.bubT -= dt;
      if (w.bubT <= 0) dropBubble(w); else { w.bx = x; w.by = y; }   // standing height: hops and the seat bounce no longer bob the bubble
    }
    if (w.zz) {
      style(w.zz, 'transform', `translate(${(x + w.emW * grow * 0.3).toFixed(1)}px, ${(y - lift - w.emH * grow + 6).toFixed(1)}px)`);
      style(w.zz, 'opacity', (w.alpha * w.dozeK).toFixed(2));
      style(w.zz, 'visibility', w.bub ? 'hidden' : '');
    }
    style(w.nm, 'transform', `translate(${x.toFixed(1)}px, ${(y - lift).toFixed(1)}px) translateX(-50%)`);
    style(w.nm, 'visibility', w.seen && !w.bub ? '' : 'hidden');

    w.nameWant = (w.nameT > 0 || w.jan || director.follow?.w === w) && !w.bub && w.seen && !w.usher;   // (the usher has none)

  // ---------- camera + zoom director ----------

  const camEl = $('cam');

  // the control panel still cut away; W / "wide" cancels the shot until the lights go down again).

    return [(x0 + x1) / 2, (y0 + y1) / 2, clamp(Math.min(1920 / (x1 - x0), 1080 / (y1 - y0)) * 0.94, 1, 3)];
  }

    director.wantNext = false;

  // ---------- control panel (control.html) through the standby server ----------

    if (w.jan) return w.task === 'escort' ? 'janny, escorting' : w.task === 'shush' ? 'janny, shushing' : w.leaving ? 'janny, clocking off' : 'janny';
    if (w.out) return w.outWhy === 'kicked' ? 'kicked by the usher' : w.sitting ? 'banned/muted, waiting for a janny' : 'banned/muted, leaving';

  }
  // ---------- panel settings (control.html "Scene settings", shared/settings.js; 7 Nov 2026) ----------
  // The URL options are the defaults. The server remembers what the panel changed and sends this scene's settings

  // setting the panel clears goes back to this screen's URL value. Units as in the panel (seconds/minutes, not ms).
  const SETTINGS = {

    screen: { get: () => alwaysGreen, set: (v) => { alwaysGreen = !!v; applyPhase(); } },
    slidefade: { get: () => (SEQ_FADE ? 'seq' : 'cross'), set: (v) => setSeqFade(v === 'seq') },
    sitscale: { get: () => SIT_SCALE, set: (v) => { SIT_SCALE = clamp(Number(v) || 1.2, 0.5, 2); } },
    sitz: {

    doze: {

    phones: { get: () => PHONE_SHARE, set: (v) => { PHONE_SHARE = clamp(Number.isFinite(Number(v)) ? Number(v) : 0.3, 0, 1); } },
    kick: { get: () => KICK, set: (v) => { KICK = clamp(Number.isFinite(Number(v)) ? Number(v) : 0.5, 0, 1); } },

      case 'director': director.on = !!c.on; if (director.on) director.next = Math.min(director.next, now + 20000); break;
      case 'every': if (Number.isFinite(+c.value)) director.every = clamp(+c.value, 30, 1800); break;

    }
  }
  function resetHall() {
    houseOut = false;
    show.fullAt = 0;   // a reset also sweeps the litter (the room does the same)
    director.wantNext = false;
    endFollow();
    arrivals.length = 0;
    nextArrival = 0;
    for (const w of [...walkers.values()]) removeWalker(w);
    for (const s of seats) s.taken = false;
    bubOrder.length = 0;
    bubLayer.replaceChildren();
    audience();
    if (doorShot) { doorShot.el.remove(); doorShot = null; doorCutout(false); }
  }

  // ---------- shared room (web/PLAN-shared-rooms.md, shared/room.js) ----------
  // The server decides who is in the hall, who sits where and who waits outside; this screen draws it. A snapshot
  // (on load and after every reconnect) puts everyone straight into their seat; this screen's own extras (jannies,
  // the usher) stay its own.
  const inRoom = () => !!Cinema.room?.page && Cinema.room.live;
  function tellRoom(cmd, nick, why) {
    if (!inRoom()) return;
    fetch('/ctl/cmd', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd, page: 'auditorium', nick, why }), signal: AbortSignal.timeout(3500) }).catch(() => {});
  }
  const shortMsg = (m) => ({ ...m, tokens: shortTokens(m.tokens) });
  // someone already seated in the room: in their seat at once, no walk in
  function seatNow(m) {
    const seat = seatById(m.seat);
    if (!seat || seat.taken) return false;
    seat.taken = true;
    const w = makeWalker(shortMsg(m));
    w.seat = seat;
    w.sitting = true;
    w.seen = true;
    w.alpha = 1;
    w.el.classList.add('sit');
    w.pos = [seat.u, seat.v + SIT_DV, seat.z + SIT_Z];

    placeItem(w);

    return true;
  }
  // the room's screen picker and litter clock (fullAt is server time: shift it by the server's clock offset)
  function roomShow(s, serverNow) {
    if (['auto', ...SLIDES, 'film'].includes(s.screen)) show.screen = s.screen;
    if (typeof s.litter === 'boolean') show.litter = s.litter;
    const off = Number.isFinite(serverNow) ? Date.now() - serverNow : 0;
    show.fullAt = Number.isFinite(s.fullAt) && s.fullAt > 0 ? s.fullAt + off : 0;
    stepLitter();
  }
  let pendingSnapshot = null;
  function applySnapshot(ev) {
    if (!L || !seats.length) { pendingSnapshot = ev; return; }
    pendingSnapshot = null;
    const s = ev.show;
    if (s) {
      if (s.phase !== show.phase) setPhase(s.phase);
      Object.assign(show, { shot: s.shot, lightsOn: !!s.lightsOn, auto: !!s.auto });
      if (houseOut !== !!s.houseOut) { houseOut = !!s.houseOut; nextLeaver = 0; }
      roomShow(s, ev.now);
      applyPhase();
    }
    if (ev.director) {
      director.on = !!ev.director.on;
      if (Number.isFinite(ev.director.every)) director.every = clamp(ev.director.every, 30, 1800);
      if (Number.isFinite(ev.director.zoom)) director.zoom = clamp(ev.director.zoom, 1.2, 3);
    }
    const want = new Map(ev.roster.map((m) => [m.nick.toLowerCase(), m]));
    // gone from the room while this screen was away: out (staff and anyone already leaving stay)
    for (const w of [...walkers.values()]) if (!w.jan && !w.usher && !w.out && !w.leaving && !want.has(w.key)) removeWalker(w);
    for (let i = arrivals.length - 1; i >= 0; i--) if (!want.has(arrivals[i].nick.toLowerCase())) arrivals.splice(i, 1);
    const now = performance.now();
    for (const [key, m] of want) {
      if (walkers.has(key)) continue;
      const queued = arrivals.find((a) => a.nick.toLowerCase() === key);
      if (queued) { queued.seat = m.seat; continue; }
      if (m.seat && seatNow(m)) continue;
      arrivals.push({ ...shortMsg(m), at: now });   // waiting outside, or a seat this screen has taken already
    }
    audience();
  }
  Cinema.onRoom((ev) => {
    const key = String(ev.nick || '').toLowerCase();
    switch (ev.t) {
      case 'snapshot': applySnapshot(ev); break;
      case 'show': if (ev.show) { roomShow(ev.show, ev.now); applyPhase(); } break;
      case 'seat': { const a = arrivals.find((x) => x.nick.toLowerCase() === key); if (a) a.seat = ev.seat; break; }
      case 'follow': followSomeone(key); break;
      case 'clear': resetHall(); break;
      case 'remove': {
        const w = walkers.get(key);
        // the leading screen's usher kicked them (or they went home): the same exit here, without the usher
        if ((ev.why === 'kicked' || ev.why === 'home') && w && w.sitting && !w.out) {
          goingOut(w, ev.why === 'kicked' ? '🔦 kicked' : '💤 heading home');

        } else if (ev.why !== 'kicked' && ev.why !== 'home') removeNick(key);
        break;
      }
      default: break;
    }
  });
  const pageId = Cinema.room?.page ? Cinema.room.id : Math.random().toString(36).slice(2, 8);
  if (q.get('ctl') !== '0' && location.protocol.startsWith('http')) {
    let alive = true;
    let statePending = false;
    const es = new EventSource(`/ctl/events?page=auditorium&id=${pageId}`);
    es.onmessage = (e) => { try { control(JSON.parse(e.data)); } catch (error) { console.error('[auditorium] control', error); } };
    const postState = () => {
      if (!alive || statePending) return;
      const f = director.follow;
      // obs: this screen is the OBS source (the panel shows it before a bigger preview tab)
      const body = { id: pageId, page: 'auditorium', ts: Date.now(), size: [innerWidth, innerHeight], obs: !!window.obsstudio,
        settings: currentSettings(), urlSettings,   // the panel shows what this screen uses, and its URL's values
        preshow: { phase: show.phase, shot: show.shot, lightsOn: show.lightsOn, houseOut, auto: show.auto, download: show.download, alwaysGreen,
          screen: show.screen, litter: show.litter, litterIn: litterIn(), litterPieces: litterShown },
        house: { capacity: seats.length, occupied: guests(), waiting: arrivals.length, queueLimit: MAX_QUEUE },
        director: { on: director.on, every: director.every, zoom: director.zoom, wantNext: director.wantNext,
          following: f?.w.nick || null, nextIn: Math.max(0, Math.round((director.next - performance.now()) / 1000)) },
        chatters: [...walkers.values()].map((w) => ({ nick: w.nick, emote: w.emName, status: statusOf(w), followed: f?.w === w }))
          .concat(arrivals.map((m) => ({ nick: m.nick, emote: m.emote, status: 'waiting outside', followed: false }))) };
      statePending = true;
      fetch('/ctl/state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: AbortSignal.timeout(3500) })
        .then((r) => { if (r.status === 404) { alive = false; es.close(); } })
        .catch(() => {}).finally(() => { statePending = false; });
    };
    postState();
    setInterval(postState, 1500);
  }


  // ---------- screen glow (queue 58) ----------
  // While the film is on the screen with the lights down, the screen glows: a soft bloom round its edges and its light
  // spilling down onto the floor in front, the front rows and the people in them (screen blend, so it only lightens).
  // The colour follows the film: inside OBS the bridge samples the film's average colour about twice a second and sends
  // {glow: [r, g, b]} (look OK'd by the owner 8 Nov). Without readings (outside OBS, or none for 3 s) a cool screen
  // white. Tests: ?glow=<hex> holds a colour, ?glow=cycle runs through film-like colours.
  const GLOW_Q = q.get('glow');
  const GLOW_IDLE = [150, 170, 210];
  const glow = { cur: [0, 0, 0], want: GLOW_IDLE, film: null, filmAt: 0, key: '' };
  const hexRgb = (hx) => { const m = /^#?([0-9a-f]{6})$/i.exec(hx || ''); return m ? [0, 2, 4].map((i) => parseInt(m[1].slice(i, i + 2), 16)) : null; };
  if (hexRgb(GLOW_Q)) glow.want = hexRgb(GLOW_Q);
  function filmColour(rgb) {
    if (rgb.length !== 3 || !rgb.every((c) => Number.isFinite(c) && c >= 0 && c <= 255)) return;
    // a film's average sits low and greyish: lift it so the glow reads as light, keeping its hue and how bright it is
    const mx = Math.max(...rgb, 1), lum = (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]) / 255;
    const level = Math.min(255, 70 + 300 * lum);   // dark scenes still glow faintly, bright ones fully
