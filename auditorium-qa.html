  }
  const GLOW_CYCLE = [[90, 140, 255], [255, 170, 80], [240, 240, 255], [80, 220, 140], [255, 80, 70], [160, 120, 255]];
  function placeSpill() {
    // an ellipse on the floor in front of the screen, stretched towards the camera (screen x = u - v, y = u + v)
    const [x0, y0] = P(9.4, 2.4, 24), [x1, y1] = P(9.4, 7.5, 70);
    const e = $('spill');
    const ang = Math.atan2(y1 - y0, x1 - x0) * 180 / Math.PI;
    e.setAttribute('cx', ((x0 + x1) / 2).toFixed(1));
    e.setAttribute('cy', ((y0 + y1) / 2).toFixed(1));
    e.setAttribute('rx', (Math.hypot(x1 - x0, y1 - y0) * 0.95).toFixed(1));
    e.setAttribute('ry', (430 * K).toFixed(1));
    e.setAttribute('transform', `rotate(${ang.toFixed(1)} ${((x0 + x1) / 2).toFixed(1)} ${((y0 + y1) / 2).toFixed(1)})`);
  }
  function stepGlow() {
    const now = performance.now();
    const on = filmOnScreen() && $('stage').classList.contains('lights-down') && !!screenPoly;
    if (GLOW_Q === 'cycle') glow.want = GLOW_CYCLE[Math.floor(now / 2500) % GLOW_CYCLE.length];
    else if (!hexRgb(GLOW_Q)) glow.want = glow.film && now - glow.filmAt < 3000 ? glow.film : GLOW_IDLE;
    const k = 0.18;   // ~0.6 s to follow a cut: smooth, never flickering with every frame

    const key = `${on} ${r},${g},${b}`;
    if (key === glow.key) return;
    glow.key = key;
    $('glowbloom').style.opacity = on ? '1' : '0';
    $('glowspill').style.opacity = on ? (0.22 + lum * 0.28).toFixed(3) : '0';
    $('glowbloom').style.boxShadow = `0 0 ${(90 * K).toFixed(0)}px ${(28 * K).toFixed(0)}px rgba(${r},${g},${b},${(0.32 + lum * 0.3).toFixed(2)}), ` +
      `0 0 ${(260 * K).toFixed(0)}px ${(60 * K).toFixed(0)}px rgba(${r},${g},${b},${(0.12 + lum * 0.14).toFixed(2)})`;

      for (const st of $('pbg').children) st.setAttribute('stop-color', `rgb(${tint})`);
      for (const st of $('pport').children) st.setAttribute('stop-color', `rgb(${tint})`);

  // ---------- aisle lights (queue 61, A2) ----------
  // Picked by the owner from the 8 Nov improvement drafts. Amber strips on the nosing of every stair tread, a small lamp
  // at each raised row's aisle end, a cool cove strip along the stage edge and halos round the two EXIT signs. All from
  // the layout JSON (stairs, rows, aisles), depth-sorted with the walkers, fading in with lights down. ?aisle=0: off.
  const AISLE_ON = q.get('aisle') !== '0';
  function aisleStrip(cls, u0, u1, v, z, extra) {
    // a strip lying along u on the floor or a tread: screen direction of +u is (60K, 30K) per tile

    Object.assign(el.style, { left: `${x0.toFixed(1)}px`, top: `${y0.toFixed(1)}px`, width: `${Math.hypot(x1 - x0, y1 - y0).toFixed(1)}px`,
      transform: `rotate(${(Math.atan2(y1 - y0, x1 - x0) * 180 / Math.PI).toFixed(2)}deg)`, zIndex: String(layers ? depthZ(u0, v, z) : Math.round((u0 + v) * 100) + 5) }, extra || {});
    world.append(el);
  }
  function placeAisleLights() {
    if (!AISLE_ON || !L) return;
    for (const [ua, ub] of L.stairs?.u_ranges || []) for (const [v0, , z] of treads) aisleStrip('nose', ua + 0.1, ub - 0.1, v0, z);
    const A = L.aisles || {};
    for (const r of L.rows || []) {
      if (r.section === 'flat front') continue;
      const b = r.seat_u_by_block || {}, ends = [];
      if (A.left_u) { ends.push(A.left_u[1] - 0.05); if (b.left?.length) ends.push(A.left_u[0] + 0.05); }
      if (A.right_u) { ends.push(A.right_u[0] + 0.05); if (b.right?.length) ends.push(A.right_u[1] - 0.05); }
      for (const u of ends) {
        const v = r.v - 0.15, z = r.floor_zpx_world + 12, [x, y] = P(u, v, z);

      Object.assign(el.style, { left: `${x - 34}px`, top: `${y - 22}px`, width: '68px', height: '44px', zIndex: '69960',
        background: `radial-gradient(closest-side, rgba(${c}, .45), rgba(${c}, .12) 60%, rgba(${c}, 0))` });
      world.append(el);
    }
  }

  // ---------- projector beam (queue 61, A3) ----------
  // A soft beam from a port high in the back wall (the cut-away wall nearest the camera) to the four screen corners.
  // No blur filter (it would re-rasterise on every zoom): three nested hulls, each a little narrower and brighter, give the
  // soft edge. Dust drifts inside it. Colour and brightness follow the screen glow (stepGlow). ?beam=0: off.
  const BEAM_ON = q.get('beam') !== '0';
  function placeBeam() {
    if (!BEAM_ON || !L || !screenPoly) { $('pbeam').remove(); $('pdust').remove(); return; }
    const room = L.room || { u: [0, 17.5], v: [0, 14.9] };
    const su = L.screen?.u || [4.9, 13.9];
    // the booth sits above the back wall, a little left of the screen's axis (where the owner's picked draft had it)
    const apex = P((su[0] + su[1]) / 2 - 2.3, room.v[1], 580);
    const [TL, TR, BR, BL] = screenPoly;
    const mid = [(TL[0] + BR[0]) / 2, (TL[1] + BR[1]) / 2];
    const g = $('pbg');
    g.setAttribute('x1', apex[0].toFixed(1)); g.setAttribute('y1', apex[1].toFixed(1));
    g.setAttribute('x2', mid[0].toFixed(1)); g.setAttribute('y2', mid[1].toFixed(1));
    const toward = (p, t) => [p[0] + (mid[0] - p[0]) * t, p[1] + (mid[1] - p[1]) * t];
    const hull = (t) => [apex, toward(TL, t), toward(TR, t), toward(BR, t), toward(BL, t)].map((p) => p.map((n) => n.toFixed(1)).join(',')).join(' ');
    $('pbeams').innerHTML = [[0, 0.5], [0.1, 0.6], [0.24, 0.75]].map(([t, o]) => `<polygon points="${hull(t)}" fill="url(#pbg)" opacity="${o}"/>`).join('');
    $('pportc').setAttribute('cx', apex[0].toFixed(1)); $('pportc').setAttribute('cy', apex[1].toFixed(1));
    // dust: points inside the beam, between a tenth of the way out and the screen
    const dust = $('pdust');
    dust.style.clipPath = `polygon(${[apex, TL, TR, BR, BL].map((p) => `${p[0].toFixed(1)}px ${p[1].toFixed(1)}px`).join(', ')})`;
    let seed = 0x5eed;
    const rnd = () => { seed = (seed * 1103515245 + 12345) >>> 0; return seed / 4294967296; };
    for (let i = 0; i < 48; i++) {
      const a = rnd(), b2 = rnd(), t = 0.12 + 0.86 * rnd();
      const top = [TL[0] + (TR[0] - TL[0]) * a, TL[1] + (TR[1] - TL[1]) * a], bot = [BL[0] + (BR[0] - BL[0]) * a, BL[1] + (BR[1] - BL[1]) * a];
      const s = [top[0] + (bot[0] - top[0]) * b2, top[1] + (bot[1] - top[1]) * b2];
      const x = apex[0] + (s[0] - apex[0]) * t, y = apex[1] + (s[1] - apex[1]) * t, sz = 1.2 + rnd() * 1.8;
      const el = document.createElement('i');
      Object.assign(el.style, { left: `${x.toFixed(1)}px`, top: `${y.toFixed(1)}px`, width: `${sz.toFixed(1)}px`, height: `${sz.toFixed(1)}px` });
      // (same draws from rnd() in the same order as the old CSS version, so every mote keeps its path)
      const d = 7 + rnd() * 9, o = 0.45 + rnd() * 0.5, dx = (rnd() - 0.5) * 40, dy = (rnd() - 0.6) * 30, delay = -rnd() * 10;
      dust.append(el);
      const anim = el.animate([{ transform: 'translate(0px, 0px)', opacity: 0.15 }, { opacity: +o.toFixed(2), offset: 0.5 },
        { transform: `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`, opacity: 0.2 }],
      { duration: Math.round(d * 10) * 100, delay: Math.round(delay * 10) * 100, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' });

    }
  }

  // ---------- litter (queue 60) ----------
  // About 10 min after the house is first 60% seated, popcorn, boxes, cups, wrappers and napkins start to pile up on
  // the floor (legroom, cross-aisle, the front, the stairs), a few at a time over the next 25 min. The room decides
  // the moment (show.fullAt) and every screen grows the same pieces from it; the panel's Litter toggle sweeps it up.
  // ?littermin=<minutes>: QA preview, as if the house had been 60% full that long.
  // (LITTER, LITTER_PREVIEW and the litter state are declared with the show state: the screen report reads them)
  const svgUrl = (vb, body) => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}">${body}</svg>`);
  const LIT_LOOK = [0.9, 0.9], DARK_LOOK = [0.42, 0.8];   // the litter filter, lit and dark (CSS .litter)
  const litterArt = new Map();
  // one small SVG per kind and variant, lying on the floor; w x h in world px at K = 1
  function litterImage(kind, variant) {
    const id = kind + variant;
    if (litterArt.has(id)) return litterArt.get(id);
    const r = seeded(0x51A7 + variant * 977 + kind.length * 131);
    const sh = (cx, cy, rx, ry, o = 0.35) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#000" opacity="${o}"/>`;
    const kernel = (x, y, k = 1) => `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${Math.round(r() * 360)}) scale(${k.toFixed(2)})">` +
      '<circle cx="-1.1" cy="0" r="1.5" fill="#f3ead0" stroke="#7d6a45" stroke-width=".35"/>' +
      '<circle cx="1" cy="-.5" r="1.35" fill="#f8f1dc" stroke="#7d6a45" stroke-width=".35"/>' +
      '<circle cx=".2" cy="1" r="1.2" fill="#efe2bd" stroke="#7d6a45" stroke-width=".35"/>' +
      '<circle cx=".3" cy=".1" r=".55" fill="#e2b545"/></g>';
    let out;
    if (kind === 'kernels') {
      let g = sh(24, 12, 20, 6, 0.22);
      const n = 6 + Math.floor(r() * 5);
      for (let i = 0; i < n; i++) { const a = r() * 6.28, d = Math.sqrt(r()); g += kernel(24 + Math.cos(a) * d * 17, 11 + Math.sin(a) * d * 5.5, 0.85 + r() * 0.35); }
      out = { url: svgUrl('0 0 48 22', g), w: 15, h: 7 };
    } else if (kind === 'box') {
      // a tipped-over popcorn box, red and white stripes, spilling kernels out of its open end
      let g = sh(22, 17, 19, 5) + '<defs><clipPath id="b"><polygon points="5,9 26,4 30,15 9,21"/></clipPath></defs>' +
        '<polygon points="5,9 26,4 30,15 9,21" fill="#f2efe6"/>' +
        '<g clip-path="url(#b)" fill="#c8242c">' + [0, 1, 2, 3, 4].map((i) => `<polygon points="${3 + i * 6},0 ${6 + i * 6},0 ${10 + i * 6},24 ${7 + i * 6},24"/>`).join('') + '</g>' +
        '<polygon points="5,9 26,4 30,15 9,21" fill="none" stroke="#4a1a1a" stroke-width=".6"/>' +
        '<ellipse cx="28" cy="9.5" rx="2.6" ry="6" transform="rotate(-14 28 9.5)" fill="#3a2a22" stroke="#4a1a1a" stroke-width=".5"/>';
      for (let i = 0; i < 5; i++) g += kernel(31 + r() * 9, 8 + r() * 11, 0.9);
      out = { url: svgUrl('0 0 44 24', g), w: 12, h: 6.5 };
    } else if (kind === 'cup') {
      // a soda cup on its side: white with a coloured band, the lid, a straw, a small spill
      const band = ['#c8242c', '#1f5fbf', '#e0a020'][variant % 3];
      const g = '<ellipse cx="27" cy="15" rx="10" ry="3" fill="#5a3a20" opacity=".45"/>' + sh(19, 14.5, 15, 3.5) +
        '<polygon points="5,8 27,5 27,15 5,13" fill="#f4f2ec" stroke="#555" stroke-width=".5"/>' +
        `<polygon points="12,7 20,6 20,14.2 12,13.6" fill="${band}"/>` +
        '<ellipse cx="5" cy="10.5" rx="1.6" ry="2.6" fill="#d8d4c8" stroke="#555" stroke-width=".5"/>' +
        '<ellipse cx="27" cy="10" rx="2.4" ry="5.2" fill="#e8e6e0" stroke="#555" stroke-width=".5"/>' +
        `<line x1="28" y1="9.5" x2="36" y2="6" stroke="${band}" stroke-width="1.1" stroke-linecap="round"/>`;
      out = { url: svgUrl('0 0 40 20', g), w: 10, h: 5 };
    } else if (kind === 'wrapper') {
      const c = ['#7a3fd0', '#2fae5a', '#e8672a', '#e2c13a'][variant % 4];
      const g = sh(10, 8, 8, 2.5, 0.3) + `<polygon points="2,6 6,3 10,5 15,2 18,6 15,9 10,8 5,10" fill="${c}" stroke="#222" stroke-width=".5"/>` +
        '<polyline points="5,6 9,5.5 13,4.5" fill="none" stroke="#fff" stroke-width=".7" opacity=".7"/>';
      out = { url: svgUrl('0 0 20 12', g), w: 5, h: 3 };
    } else {
      // a crumpled napkin
      const g = sh(9, 8, 7, 2.5, 0.3) + '<path d="M3,7 Q4,3 8,3.5 Q12,2 14,5 Q16,8 12,9.5 Q8,10.5 5,9.5 Q2,9 3,7Z" fill="#eeeae2" stroke="#8a857a" stroke-width=".5"/>' +
        '<path d="M6,6 Q8,5 9,7 M10,4.5 Q11,6 13,6" fill="none" stroke="#b5afa2" stroke-width=".5"/>';
      out = { url: svgUrl('0 0 18 12', g), w: 5, h: 3.2 };
    }
    litterArt.set(id, out);
    rasterLitter(out);
    return out;
  }
  // Each design is drawn once into a bitmap (4x its stage size: sharp at a 3x zoom on 1440p): Chrome redraws an
  // SVG <img> from its vector shapes on every repaint of its tiles, and 140 of them made the lights changes of a full
  // house ~10 fps slower at 60 (perf 9 Nov). Pieces placed before the bitmap is ready switch to it when it is.
  // One design at a time, on a CPU canvas, encoded with toBlob: a GPU canvas's toDataURL waits for a readback from the
  // busy GPU process, and on a fresh load with litter down all ~20 designs did it at once (hitches of 390-490 ms,
  // perf 9 Nov).
  const rasterQ = [];
  let rasterBusy = false;
  function rasterLitter(art) { rasterQ.push(art); if (!rasterBusy) rasterNext(); }
  function rasterNext() {
    const art = rasterQ.shift();
    if (!art) { rasterBusy = false; return; }
    rasterBusy = true;
    const next = () => setTimeout(rasterNext, 40);
    const im = new Image();
    im.onerror = next;
    im.onload = () => {
      const vb = (decodeURIComponent(art.url).match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/) || []).slice(1).map(Number);
      const c = document.createElement('canvas');
      const k = 4 * K * 2.6;
      c.width = Math.ceil(art.w * k); c.height = Math.ceil(art.h * k);
      // the <img> box shows the SVG with preserveAspectRatio meet: the same fit here
      const fit = vb.length === 2 ? Math.min(c.width / vb[0], c.height / vb[1]) : 0;
      const dw = fit ? vb[0] * fit : c.width, dh = fit ? vb[1] * fit : c.height;
      c.getContext('2d', { willReadFrequently: true }).drawImage(im, (c.width - dw) / 2, (c.height - dh) / 2, dw, dh);
      try {
        c.toBlob((b) => {
          if (b) {
            art.bmp = URL.createObjectURL(b);
            for (const el of litterEls) if (el.litArt === art) el.src = art.bmp;
          }
          next();
        }, 'image/png');
      } catch { next(); }
    };
    im.src = art.url;
  }
  // weighted floor areas, each a function rnd -> [u, v, zpx_world]
  function litterSpotList() {
    const out = [];
    for (const r of L.rows) {
      for (const us of Object.values(r.seat_u_by_block)) {
        if (!us.length) continue;
        const a = us[0] - 0.3, b = us[us.length - 1] + 0.3;
        // the legroom in front of the row (towards the screen), on the row's own tier
        out.push([us.length, (rnd) => [a + rnd() * (b - a), r.v - 0.32 - rnd() * 0.2, r.floor_zpx_world]]);
      }
    }
    out.push([16, (rnd) => [4.3 + rnd() * 10, 3.35 + rnd() * 1.6, 24]]);    // the cross-aisle
    out.push([10, (rnd) => [0.9 + rnd() * 15.8, 0.9 + rnd() * 1.4, 24]]);   // the front, below the screen
    const tr = L.stairs.treads_v0_v1_zpx_world;
    for (const [a, b] of L.stairs.u_ranges) {
      out.push([7, (rnd) => { const t = tr[Math.floor(rnd() * tr.length)]; return [a + 0.12 + rnd() * (b - a - 0.24), t[0] + 0.06 + rnd() * Math.max(0, t[1] - t[0] - 0.12), t[2]]; }]);
    }
    return out;
  }
  function litterPieces(seed) {
    const rnd = seeded(seed);
    const spots = litterSpots ||= litterSpotList();
    const total = spots.reduce((t, x) => t + x[0], 0);
    const kinds = [['kernels', 0.44], ['box', 0.12], ['cup', 0.15], ['wrapper', 0.18], ['napkin', 0.11]];
    const out = [];
    for (let i = 0; i < LITTER.MAX; i++) {
      let pickS = rnd() * total, spot = spots[spots.length - 1];
      for (const x of spots) { if ((pickS -= x[0]) <= 0) { spot = x; break; } }
      const [u, v, z] = spot[1](rnd);
      let pickK = rnd(), kind = 'napkin';
      for (const [k, w] of kinds) { if ((pickK -= w) <= 0) { kind = k; break; } }
      out.push({ u, v, z, kind, variant: Math.floor(rnd() * 4), flip: rnd() < 0.5 });
    }
    return out;
  }
  // ms since the house was 60% full (null: no litter clock)
  function litterAge() {
    if (!show.litter) return null;
    if (LITTER_PREVIEW != null) return LITTER_PREVIEW;
    return show.fullAt ? Date.now() - show.fullAt : null;
  }
  // seconds until the first piece (0 = it has started), or null: for the panel
  function litterIn() { const a = litterAge(); return a == null ? null : Math.max(0, Math.round((LITTER.DELAY - a) / 1000)); }
  function stepLitter() {
    if (!L || !seats.length) return;
    // without a shared room this screen keeps its own clock
    if (!inRoom() && show.litter && !show.fullAt && guests() / seats.length >= LITTER.FULL) show.fullAt = Date.now();
    const age = litterAge();
    const want = age == null ? 0 : Math.ceil(LITTER.MAX * Math.min(1, Math.max(0, (age - LITTER.DELAY) / LITTER.GROW)));
    const seed = LITTER_PREVIEW != null ? 0x11773 : Math.round(show.fullAt / 1000) >>> 0;
    if (!want || !litterList || seed !== litterSeed) {
      for (const el of litterEls.splice(0)) el.remove();
      litterList = want ? litterPieces(seed) : null;
      litterSeed = seed;
    }
    for (let i = litterEls.length; i < want; i++) {
      const p = litterList[i];
      const art = litterImage(p.kind, p.variant);
      const [x, y] = P(p.u, p.v, p.z);
      const w = art.w * K * 2.6, hgt = art.h * K * 2.6;   // cartoon scale: readable next to the big emote heads
      const im = h('img', 'litter');
      im.alt = '';
      im.litArt = art;
      im.src = art.bmp || art.url;
      Object.assign(im.style, { left: `${(x - w / 2).toFixed(1)}px`, top: `${(y - hgt * 0.62).toFixed(1)}px`, width: `${w.toFixed(1)}px`,
        height: `${hgt.toFixed(1)}px`, zIndex: String(layers ? depthZ(p.u, p.v, p.z) : Math.round((p.u + p.v) * 100) + 5),
        transform: p.flip ? 'scaleX(-1)' : '', opacity: '0' });
      world.append(im);
      requestAnimationFrame(() => { im.style.opacity = '1'; });
      litterEls.push(im);
    }
    litterShown = litterEls.length;
  }
  setInterval(stepLitter, 1000);

  // ---------- start ----------
  Cinema.onWalkIn(onMessage);
  Cinema.onPurge(onPurge);
  setInterval(() => { if (pendingSnapshot && L && seats.length) applySnapshot(pendingSnapshot); }, 500);

  (async () => {
    try {
      const res = await fetch(`${ART}cinema_layout_${DRAFT}.json`, { cache: 'no-store' });
      L = await res.json();
    } catch (error) { console.error('[auditorium] layout', error); }
    if (L) {
      ({ k: K, Ox: OX, Oy: OY } = L.camera);
      EH = 45 * K;
      MAXW = 66.6 * K;
      treads = L.stairs.treads_v0_v1_zpx_world;
      rows = L.rows.map((r) => ({ name: r.row, v: r.v, z: r.floor_zpx_world, flat: r.floor_zpx_world <= 24 }));
      for (const [i, r] of L.rows.entries()) {
        for (const [block, us] of Object.entries(r.seat_u_by_block)) {
          for (const u of us) seats.push({ row: rows[i], u, v: r.v, z: r.floor_zpx_world, block, taken: false });
        }
      }
      if (L.page_layers && Array.isArray(L.page_layers.slices)) {
        layers = L.page_layers;
        $('stage').classList.toggle('has-dim-art', !!layers.dim);
        syncFlat();
        const dimSlices = new Map((layers.dim?.slices || []).map((s) => [s.name, s]));
        if (Number.isFinite(layers.key_z_divisor)) KZ = layers.key_z_divisor;
        const okRect = (p) => p && typeof p.file === 'string' && [p.x, p.y, p.w, p.h].every(Number.isFinite);
        for (const s of layers.slices) {
          if (!okRect(s) || !Number.isFinite(s.z_index)) continue;   // skip broken entries
          const twin = dimSlices.get(s.name);
          // Banded slices (roxy3d/tools/band-slices.mjs): the same picture as horizontal bands trimmed to their
          // visible pixels. A diagonal row's bounding box is mostly empty, and Chrome decodes all of it: the
          // whole slices are ~25 screens of pixels (they overflow the image cache at 4K), the bands ~5.
          const banded = Array.isArray(s.pieces) && s.pieces.length && s.pieces.every(okRect) &&
            (!twin || (Array.isArray(twin.pieces) && twin.pieces.length === s.pieces.length && twin.pieces.every(okRect)));
          const parts = banded ? s.pieces : [s];
          const twinParts = twin ? (banded ? twin.pieces : [twin]) : [];
          const sc = layers.entrance_door?.static_slice_cutout;
          const inSlice = sc?.slices?.includes(s.name);
          for (const [n, p] of parts.entries()) {
            // only the pieces over the door's cutout get its mask: outside that rect the mask is fully opaque anyway,
            // and masking all of them (497 pieces + dim twins) made every door opening re-render ~1000 masked
            // images (QA 04 Nov: 95 of the 497 touch the cutout)
            const cut = inSlice && (![sc.x, sc.y, sc.w, sc.h].every(Number.isFinite)
              || (p.x < sc.x + sc.w && p.x + p.w > sc.x && p.y < sc.y + sc.h && p.y + p.h > sc.y));
            const im = h('img', 'slice');
            im.alt = '';
            im.decoding = 'async';
            artImgs.push({ im, file: p.file, file_2x: p.file_2x });
            Object.assign(im.style, { left: `${p.x}px`, top: `${p.y}px`, width: `${p.w}px`, height: `${p.h}px`, zIndex: String(s.z_index), display: 'none' });
            world.append(im);
            if (cut) doorSlices.push(im);
            const tp = twinParts[n];
            let dim = null;
            if (tp) {
              dim = im.cloneNode();
              dim.classList.add('dim-art');
              world.append(dim);
              dimImgs.push({ im: dim, file: tp.file, file_2x: tp.file_2x, piece: true });
              if (cut) doorSlices.push(dim);
            }
            addPiece({ im, dim, x0: p.x, y0: p.y, x1: p.x + p.w, y1: p.y + p.h, z: s.z_index });
          }
        }
        const d = layers.entrance_door;
        if (d && typeof d.file === 'string' && [d.x, d.y, d.frame_width, d.frame_height, d.frames, d.columns, d.z_index].every(Number.isFinite)) door = d;
        if (Number.isFinite(layers.spawn?.wait_seconds)) DOOR_WAIT = layers.spawn.wait_seconds;
      }
      const c = L.screen.corners_1920x1080;
      screenPoly = [c.TL, c.TR, c.BR, c.BL];
      $('screenpoly').setAttribute('points', screenPoly.map((p) => p.join(',')).join(' '));
      screenFill();
      bridgeConnect();
      // Columns are TL->TR / 960 and TL->BL / 540: all four corners match the layout exactly.
      $('preshow').style.transform = `matrix(${(c.TR[0] - c.TL[0]) / 960}, ${(c.TR[1] - c.TL[1]) / 960}, ${(c.BL[0] - c.TL[0]) / 540}, ${(c.BL[1] - c.TL[1]) / 540}, ${c.TL[0]}, ${c.TL[1]})`;
      $('glowbloom').style.transform = $('preshow').style.transform;
      placeSpill();
      placeAisleLights();
      placeBeam();
    }
    applyPhase();
    artImgs.push({ im: $('bg'), file: layers?.image || `cinema_draft_${DRAFT}.png`, file_2x: layers?.image_2x });
    if (layers?.dim?.image) {
      const im = h('img', 'dim-art');
      im.id = 'bg-dim';
      im.alt = '';
      $('bg').after(im);
      dimImgs.push({ im, file: layers.dim.image, file_2x: layers.dim.image_2x });
    }
    SB.mountStage($('stage'));
    requestAnimationFrame(frame);
    SB.start();
    pollDownload();
    setInterval(audience, 2000);
  })();
})();
</script>
</body>
</html>
