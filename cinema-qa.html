<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DinkDonk Cinema — OBS output</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block;
  opacity: 0; pointer-events: none; }
iframe[data-active="true"] { opacity: 1; pointer-events: auto; z-index: 1; }
</style>
</head>
<body>
<iframe id="lobby" title="Cinema lobby" data-active="false" aria-hidden="true" inert allow="autoplay; fullscreen"></iframe>
<iframe id="auditorium" title="Cinema auditorium" data-active="false" aria-hidden="true" inert allow="autoplay; fullscreen"></iframe>
<script src="shared/journey.js"></script>
<script>
(() => {
  'use strict';
  const frames = { lobby: document.getElementById('lobby'), auditorium: document.getElementById('auditorium') };
  const id = crypto.randomUUID().slice(0, 16);
  const options = new URLSearchParams(location.search);
  window.CinemaJourney = window.CinemaJourney.create();
  let active = '', busy = false;
  const loaded = new Set();
  function notify(frame) {
    frame.contentWindow.postMessage({ type: 'cinema-output-visibility' }, location.origin);
  }
  function show(view) {
    if (active === view) return;
    active = view;
    for (const [name, frame] of Object.entries(frames)) {
      const visible = name === active;
      frame.dataset.active = String(visible);
      frame.setAttribute('aria-hidden', String(!visible));
      frame.inert = !visible;
      frame.tabIndex = visible ? 0 : -1;
      if (loaded.has(name)) notify(frame);
    }
    if (loaded.has(active)) frames[active].contentWindow.focus();
  }
  // Each page is loaded once. Hidden scenes retain their full viewport, live
  // chat, animation timers, camera state and audience; only compositing changes.
  for (const [view, frame] of Object.entries(frames)) {
    frame.addEventListener('load', () => {
      if (!frame.getAttribute('src')) return;
      loaded.add(view);
      notify(frame);
      if (active === view) frame.contentWindow.focus();
      report();
    });
    const qa = location.pathname.endsWith('-qa.html');
    const url = new URL(`${view}${qa ? '-qa' : ''}.html`, location.href);
    url.search = options.toString();
    if (!options.has('everyone') && !options.has('tag')) url.searchParams.set('everyone', '1');
    url.searchParams.set('managed', '1');
    frame.src = url.href;
  }
  async function report() {
    if (!active || !loaded.has(active)) return;
    try {
      await fetch('/ctl/output', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, view: active, obs: !!window.obsstudio }), signal: AbortSignal.timeout(3000) });
    } catch { /* keep showing the scene during a server restart */ }
  }
  async function refresh() {
    if (busy) return;
    busy = true;
    try {
      const response = await fetch('/ctl/state', { cache: 'no-store', signal: AbortSignal.timeout(3000) });
      if (!response.ok) return;
      const state = await response.json();
      window.CinemaJourney.retry();
      const view = state.presentation?.view;
      if (['lobby', 'auditorium'].includes(view)) show(view);
      await report();
    } catch { /* reconnect on the next tick; never replace a working scene with an error */ }
    finally { busy = false; }
  }
  refresh();
  setInterval(refresh, 1000);
})();
</script>
</body>
</html>
