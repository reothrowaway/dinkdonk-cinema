<main><header><span>DinkDonk Cinema</span><a href="./index.html">Double-bill planner</a></header>
<h1>Movie-night handbill</h1><p id="empty">Choose two films in the double-bill planner to make a handbill.</p>
<div class="layout" id="editor" hidden>
<form onsubmit="return false"><label>Headline<input id="headline" maxlength="46" value="Double feature"></label>
<label>Where to watch<input id="venue" maxlength="90" value="DinkDonk Cinema"></label>
<label>Showtime<input id="start" type="datetime-local" step="60"><small id="zone"></small></label>
<label id="occurrence-wrap" hidden>Which occurrence?<select id="occurrence"><option value="0">First</option><option value="1">Second</option></select></label>
<div class="actions"><button type="button" id="png">Save handbill PNG</button><button type="button" id="print">Print four handbills</button><button type="button" id="copy">Copy invitation text</button></div>

</form>
