<!doctype html>
<!--
  DINK DONK CINEMA LOBBY (lobby.html, was roxy.html) - split-wings layout (BLOCKOUT: layout and flow first, final art later)

  Street strip in front -> glass doors -> lobby with the box office (queue) and the snack
  island -> usher gate at the back corner -> the corridor forks: left wing = screens 1-2 (+ WC),
  right wing = screens 3-5. Each door is in an outer wall; its auditorium is behind it.
  Screens 1-5 = the last five films on dinkdonk.mov (shared/cinema.js).

  Everything lives inside the world: no HUD, no green screen, no floating signs (owner, 02 Nov).
  No chat panel: every chatter talks in a bubble over their emote.
  Zoom director: now and then the camera follows one arriving chatter to their door (control.html,
  keys F/R/W/D). Options: demo=1, live=1 (auto-reload on file change), wet2x=1 (4K wet loops, heavy), crowd=<n> (people outside/in line before new chatters are skipped, 14; 0 = never), mist=1-4 (splash spray samples, off by default), morerain=0 (no extra rain/weather; 1-4 = one fixed style), weather=<x> (weather clock x times faster, testing), rainfps=<n> (extra rain steps per second, 24 like the baked loops; 0 = smooth), tag= / everyone=1 (who walks in,
  see shared/cinema.js), director=0|<seconds>, zoom=<1.2-3>, ctl=0 (no control panel link), maxres=<height> (cap the art
  resolution, e.g. 1080: no 4K art or loops even at 1440p; off by default), fit=cover (fill a squarer or wider source:
  crop the sides instead of black bars; the wide shot centres on fitx=<stage x>, 1040), rainspeed=<x> / raintune=1.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lobby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600&family=Yellowtail&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { background: #0b0a12; font-family: Oswald, 'Arial Narrow', Arial, sans-serif; color: #fff; }
  .layer { position: absolute; left: 0; top: 0; pointer-events: none; }
  #world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .prop { position: absolute; pointer-events: none; }

  .w { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  .w .sh { position: absolute; left: -19px; top: -7px; width: 38px; height: 14px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0,0,0,.55), rgba(0,0,0,0)); }
  .w .bod { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
  .w .em { position: absolute; bottom: 0; }
  .w .nm { position: absolute; left: 0; top: 7px; transform: translateX(-50%); white-space: nowrap;
    font: 500 14px/1 Oswald, 'Arial Narrow', sans-serif; letter-spacing: .02em;
    text-shadow: 0 1px 2px #000, 0 0 4px #000, 0 0 2px #000; }
  .w .nm { transition: opacity .4s; padding: 0 4px 1px; border-radius: 2px; background: rgba(8, 6, 18, .5); }
  .w.staff .nm { display: none; }
  /* DGG tier 5 subs: the moving rainbow name of DGG chat (same gradient as the DSA script) */
  .rbt { background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bff95, #67d8ff, #b28dff, #ff78c6, #ff6b6b);
    background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-fill-color: transparent; animation: rbt 4s linear infinite; }
  @keyframes rbt { to { background-position: -220% 0; } }
  /* staff wear a little uniform cap so they don't read as customers */
  /* shaded like the render: lit from the top-left, darker underside */
  .hat { position: absolute; left: -14px; bottom: 44px; width: 28px; height: 11px; border-radius: 4px 4px 1px 1px;
    background: linear-gradient(170deg, #c8394a, #8c1724 70%); box-shadow: inset 0 -3px 0 #b8933f, 0 2px 3px rgba(0,0,0,.6); }
  .hat.usher { background: linear-gradient(170deg, #6a2036, #34101c 70%); box-shadow: inset 0 -3px 0 #b8933f, 0 2px 3px rgba(0,0,0,.6); }
  .hat.usher::after { content: ''; position: absolute; left: 11px; top: -4px; width: 6px; height: 6px; border-radius: 50%; background: #f0c85a; }
  .ticket.torn { width: 9px; }
  .item { position: absolute; pointer-events: none; }
  .stub { position: absolute; bottom: 12px; width: 11px; height: 7px; background: linear-gradient(160deg, #f0d48a, #b8933f);
    border-radius: 1px; box-shadow: 0 1px 2px rgba(0,0,0,.6); transform: rotate(-14deg); }
  .umb { position: absolute; left: -30px; bottom: 54px; width: 60px; height: 22px; display: none;
    border-radius: 60px 60px 6px 6px / 44px 44px 6px 6px; background: var(--c);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.25), inset 10px 4px 0 rgba(255,255,255,.12), 0 2px 4px rgba(0,0,0,.5); }
  .umb::after { content: ''; position: absolute; left: 29px; top: 20px; width: 2px; height: 30px; background: #222; }
  .w.out .umb { display: block; }
  .w.out:not([data-lt]) .em { filter: brightness(.84) saturate(.9); }   /* night street: dimmer than the lobby (when the scene light, L6, is off or not loaded) */
  /* wet reflection under a chatter on the street (queue 63, L7): a flipped copy of the emote, fading out downwards */
  .refl { position: absolute; left: -42px; top: 1px; width: 84px; height: 48px; overflow: hidden; pointer-events: none; opacity: .44;
    transform-origin: 0 0; transform: scaleY(.82);
    -webkit-mask-image: linear-gradient(#000, rgba(0, 0, 0, .5) 45%, transparent); mask-image: linear-gradient(#000, rgba(0, 0, 0, .5) 45%, transparent); }
  .refl > .em { bottom: auto; top: 0; }
  .w .refl > .em.em { filter: none !important; }   /* the copy keeps the emote's own light: a dimmed one vanished on the dark pavement */
  /* golden WEOW (queue 65, L50): DGG's own gold WEOW (a cell of the emote's sheet) with a pulsing aura and sparkles,
     so it stands out from everyone. Rare (1 in 20 of the chatters wearing WEOW), so its shadows cost next to nothing. */
  .w.gold .em { filter: drop-shadow(0 0 3px rgba(255, 205, 70, .95)) !important; }
  .w.gold .nm { color: #ffd75a !important; text-shadow: 0 0 6px rgba(255, 200, 60, .9); }
  .aura { position: absolute; left: -62px; top: -88px; width: 124px; height: 124px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(closest-side, rgba(255, 214, 90, .5), rgba(255, 190, 50, .34) 50%, rgba(255, 170, 30, 0));
    animation: aura 1.5s ease-in-out infinite alternate; }
  @keyframes aura { from { transform: scale(.84); opacity: .68; } to { transform: scale(1.12); opacity: 1; } }
  .aura i { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #fffbe0;
    box-shadow: 0 0 6px 2px rgba(255, 220, 110, .9); animation: twinkle 1.2s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { transform: scale(.2); opacity: 0; } 50% { transform: scale(1); opacity: 1; } }
  .umbs { position: absolute; display: none; pointer-events: none; }
  .w.out .umbs { display: block; }
  /* the clipboard of the canvasser (queue 65, L32) */
  .clip { position: absolute; left: 13px; top: -31px; width: 11px; height: 15px; border: 2px solid #6e5232; border-radius: 2px; background: #efe6cf;
    transform: rotate(9deg); box-shadow: inset 0 3px 0 #9aa3ad; }
  .doorlight { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; opacity: 0; transition: opacity .35s;
    background: linear-gradient(180deg, rgba(255, 220, 160, .8), rgba(255, 190, 110, .5)); box-shadow: 0 0 14px 4px rgba(255, 196, 120, .32); }
  .doorlight.on { opacity: 1; }
  /* lobby props drawn by the page (queue 65): the Dear Leader portrait (L38), two posters on the corridor's end wall
     (L44 the J6 video, L51 Dogtober 7th), the snack menu's slop lines (L46), the gnome (L40) */
  .dlp { position: absolute; left: 0; top: 0; width: 36px; height: 46px; transform-origin: 0 0; pointer-events: none; box-sizing: border-box;
    border: 3px solid #b8903a; background: radial-gradient(circle at 50% 34%, #6a2028, #2a0c12 75%); box-shadow: inset 0 0 0 1px #5e4212, 0 2px 3px rgba(0, 0, 0, .55); }
  .dlp .face { position: absolute; left: 2px; top: 3px; width: 26px; height: 26px; }
  .dlp .face > * { position: absolute; left: 0; top: 0; }
  .dlp .plate { position: absolute; left: 1px; right: 1px; bottom: 2px; height: 6px; background: linear-gradient(#ecd07a, #a5822c); color: #2a1c06;
    font: 700 3.3px/6px Oswald, sans-serif; letter-spacing: .15px; text-align: center; white-space: nowrap; overflow: hidden; }
  .dlp .lamp { position: absolute; left: -6px; top: -12px; width: 42px; height: 22px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 226, 160, .5), rgba(255, 226, 160, 0)); }
  .pst { position: absolute; left: 0; top: 0; width: 47.2px; height: 64px; transform-origin: 0 0; pointer-events: none; overflow: hidden; font-family: Oswald, sans-serif; text-align: center; }
  .pst > * { position: absolute; left: 0; right: 0; }
  .pst b { font-weight: 700; display: block; }
  .pst .stk { right: auto; font: 700 3.6px/5px Oswald, sans-serif; padding: 0 1.6px; color: #1a1205; box-shadow: 0 .5px 1px rgba(0, 0, 0, .5); }
  .menut { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; overflow: hidden; white-space: nowrap; text-align: center;
    font: 600 8.4px/14px Oswald, sans-serif; letter-spacing: .5px; color: #33261e; }
  .menut span { display: block; transition: opacity .5s; }
  .gnome { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
  .gnome i { position: absolute; }
  /* lobby life (queue 64): a shivering emote (L20), the nothing-burger cloche (L26), the wet-floor sign (L29) */
  .w.shiver .em { animation: shiver .16s steps(2) infinite; }
  @keyframes shiver { 50% { translate: 1.5px 0; } }
  .cloche { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
  .cloche i { position: absolute; }
  .cloche .plate { left: -9px; top: -2px; width: 18px; height: 5px; border-radius: 50%; background: #c9ccd4; }
  .cloche .dome { left: -7px; top: -10px; width: 14px; height: 9px; border-radius: 9px 9px 2px 2px; background: linear-gradient(120deg, #f4f6fa, #9aa1ad 70%); }
  .cloche .dome::before { content: ''; position: absolute; left: 5px; top: -3px; width: 4px; height: 3px; border-radius: 50%; background: #dfe3ea; }
  .wetsign { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; transition: opacity 1.2s; }
  .wetsign i { position: absolute; left: -6px; top: -19px; width: 12px; height: 19px; background: #ffd21f; clip-path: polygon(22% 0, 78% 0, 100% 100%, 0 100%); }
  .wetsign i::after { content: '!'; position: absolute; left: 0; right: 0; top: 4px; text-align: center; font: 700 10px/10px Arial, sans-serif; color: #1c1508; }
  /* more street life (queue 64): puddle splash drops (L11), umbrellas in a gust (L12), a newspaper (L15), pigeons (L14),
     the dog in the window (L19) */
  .drop { position: absolute; left: 0; top: 0; width: 3px; height: 5px; margin: -3px 0 0 -2px; border-radius: 50%; pointer-events: none; background: rgba(205, 228, 255, .85); }
  .w .umbs, .w .umb { transition: transform .9s ease-in-out; transform-origin: 50% 70%; }
  #world.gust .w.out .umbs, #world.gust .w.out .umb { transform: rotate(-12deg); }
  #world .w.out .umbs.blown, #world .w.out .umb.blown { transform: rotate(-20deg) scaleY(-.7); transition-duration: .18s; }
  .paper { position: absolute; left: 0; top: 0; width: 13px; height: 9px; margin: -9px 0 0 -6px; pointer-events: none; background: linear-gradient(#d9d3c2, #a9a393); box-shadow: inset 0 -2px 0 rgba(60, 60, 60, .35); }
  .pigeon { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
  .pigeon i { position: absolute; left: -5px; top: -7px; width: 10px; height: 7px; border-radius: 55% 45% 50% 50%; background: #717a8c; }
  .pigeon i::before { content: ''; position: absolute; left: 7px; top: -3px; width: 4px; height: 4px; border-radius: 50%; background: #5a6274; }
  .pigeon i::after { content: ''; position: absolute; left: 1px; top: 2px; width: 6px; height: 3px; border-radius: 50%; background: #9aa3b4; }
  .wdog { overflow: hidden; transform-origin: 0 0; }
  .wdog > div { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform: matrix(1, -.5, 0, 1, 0, 0) translateY(6px); transition: transform .7s ease-in-out; }
  .wdog.up > div { transform: matrix(1, -.5, 0, 1, 0, 0) translateY(0); }
  .wdog i { position: absolute; background: #2a1d14; }
  /* chat-driven bits (queue 64): the roof bell's rings (L16), the siren light bar (L17) */
  .bellring { position: absolute; left: 0; top: 0; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; pointer-events: none;
    border: 3px solid rgba(255, 226, 120, .95); box-shadow: 0 0 14px rgba(255, 210, 90, .8); }
  .sirenbar { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
  .sirenbar i { position: absolute; top: -6px; width: 9px; height: 6px; border-radius: 2px; animation: sirenf .5s steps(1) infinite; }
  .sirenbar i:first-child { left: -10px; background: #ff3b3b; box-shadow: 0 0 16px 8px rgba(255, 50, 50, .75); }
  .sirenbar i:last-child { left: 1px; background: #3b7bff; box-shadow: 0 0 16px 8px rgba(60, 120, 255, .75); animation-delay: -.25s; }
  @keyframes sirenf { 0% { opacity: 1; } 50% { opacity: .12; } }
  /* "bridge out" roadworks board on the far sidewalk (queue 65, L30) */
  .rwboard { position: absolute; left: 0; top: 0; pointer-events: none; }
  .rwboard > * { position: absolute; }
  .rwboard .leg { width: 3px; background: #15171c; }
  .rwboard .panel { left: -42px; top: -80px; width: 84px; height: 38px; background: #07080a; border: 2px solid #20232b; border-radius: 2px; transform: skewY(26.565deg); }
  .rwboard canvas { position: absolute; left: 4px; top: 3px; width: 76px; height: 32px; }
  .rwboard .beacon { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(closest-side, #ffe9a8, rgba(255, 170, 40, .85) 30%, rgba(255, 150, 20, 0));
    animation: rwblink 1.3s steps(1) infinite; }
  .rwboard .beacon.b2 { animation-delay: -.65s; }
  @keyframes rwblink { 0% { opacity: 1; } 50% { opacity: .08; } }
  .rwboard .pool { left: -60px; top: -14px; width: 120px; height: 40px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 170, 40, .22), rgba(255, 170, 40, 0)); }
  .rwboard.fire .pool { background: radial-gradient(closest-side, rgba(255, 90, 20, .5), rgba(255, 90, 20, 0)); animation: rwfire .23s steps(2) infinite; }
  @keyframes rwfire { 0% { opacity: 1; } 50% { opacity: .55; } }
  .doorglow { position: absolute; left: 0; top: 0; width: 150px; height: 96px; margin: -48px 0 0 -75px; pointer-events: none;
    border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 196, 120, .55), rgba(255, 150, 80, .18) 55%, rgba(0,0,0,0));
    mix-blend-mode: plus-lighter; }
  .doorglow.arcadeglow { width: 70px; height: 56px; margin: -28px 0 0 -35px;
    background: radial-gradient(closest-side, rgba(120, 170, 255, .8), rgba(80, 120, 255, 0)); }
  .sheet { position: absolute; left: 0; top: 0; pointer-events: none; background-repeat: no-repeat; }
  .fxsheet { mix-blend-mode: plus-lighter; }
  .mqtext { position: absolute; left: 0; top: 0; width: 640px; height: 116px; transform-origin: 0 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; color: #17120e;
    font-family: 'Oswald', 'Bebas Neue', 'Arial Narrow', Impact, sans-serif; font-weight: 600; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; line-height: 1; opacity: .92; }
  .mqtext .mq1 { font-size: 44px; letter-spacing: 4px; }
  .mqtext .mq2 { font-size: 30px; letter-spacing: 5px; color: #3a2a20; }
  .proploop { position: absolute; pointer-events: none; mix-blend-mode: plus-lighter; background-repeat: no-repeat; }
  /* premiere-night sky (L3) and wet-street light (L4), queue 61: over the background, under #world's walkers and props */
  .fxl { width: 1920px; height: 1080px; z-index: 3; overflow: hidden; }
  .fxl > div { position: absolute; pointer-events: none; }
  #skyfx, #wetfx { mix-blend-mode: screen; }
  .sbeam { transform-origin: 50% 100%; will-change: transform;
    background: linear-gradient(0deg, rgba(234,243,255,.5), rgba(234,243,255,.16) 55%, rgba(234,243,255,0));
    clip-path: polygon(44% 100%, 56% 100%, 100% 0, 0 0);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 32%, #000 68%, transparent); mask-image: linear-gradient(90deg, transparent, #000 32%, #000 68%, transparent); }
  .sbA { animation: sweepA 23s ease-in-out infinite alternate; }
  .sbB { animation: sweepB 29s ease-in-out -9s infinite alternate; }
  @keyframes sweepA { from { transform: rotate(-50deg); } to { transform: rotate(-31deg); } }
  @keyframes sweepB { from { transform: rotate(27deg); } to { transform: rotate(46deg); } }
  .skyred { animation: skyred 2.4s steps(1) infinite; }
  /* neighborhood life (queue 63, L9): steam, apartment windows, a TV, neon dips. Same rules as the sky layers: no
     blur filters, motion is transform/opacity only. */
  .lwin { transform-origin: 0 0; opacity: 0; transition: opacity 1.8s ease-in-out; }
  .lwin.on { opacity: 1; }
  .ltv { transform-origin: 0 0; background: #9cc4ff; opacity: 0; animation: ltv 6.1s steps(1) infinite; }
  @keyframes ltv { 0% { opacity: .05; } 6% { opacity: .34; } 11% { opacity: .1; } 19% { opacity: .42; } 24% { opacity: .2; } 31% { opacity: 0; }
    38% { opacity: .36; } 45% { opacity: .12; } 52% { opacity: .46; } 61% { opacity: .2; } 70% { opacity: .04; } 78% { opacity: .38; } 87% { opacity: .15; } 94% { opacity: .3; } }
  .ldip { opacity: 0; }
  .ldip.dip { animation: ldip .95s steps(1) 1; }
  @keyframes ldip { 0% { opacity: .9; } 8% { opacity: 0; } 16% { opacity: .7; } 24% { opacity: 0; } 46% { opacity: .95; } 78% { opacity: .3; } 88% { opacity: 0; } }
  /* snarkers (queue 65, L31): two heads in a dark apartment window, a binocular glint; they duck now and then */
  .snark { overflow: hidden; transform-origin: 0 0; }
  .snark > div { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform: matrix(1, -.5, 0, 1, 0, 0) translateY(0); transition: transform .5s ease-in; }
  .snark.down > div { transform: matrix(1, -.5, 0, 1, 0, 0) translateY(22px); }
  .snark i { position: absolute; background: #2c3650; border-radius: 50% 50% 38% 38%; }
  .snark b { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #dff4ff; box-shadow: 0 0 3px 1px rgba(190, 235, 255, .9); opacity: 0; animation: sglint 5.3s steps(1) infinite; }
  @keyframes sglint { 0% { opacity: 1; } 5% { opacity: 0; } 46% { opacity: .8; } 49% { opacity: 0; } }
  .puff { left: -20px; top: -20px; width: 40px; height: 40px; border-radius: 50%; opacity: 0; will-change: transform, opacity;
    background: radial-gradient(closest-side, rgba(233, 238, 245, .55), rgba(233, 238, 245, .22) 55%, rgba(233, 238, 245, 0));
    animation: puff 7s linear infinite; }
  @keyframes puff { 0% { transform: translate(0, 0) scale(.3); opacity: 0; } 14% { opacity: .6; }
    100% { transform: translate(-38px, -150px) scale(2.3); opacity: 0; } }
  @keyframes skyred { 0% { opacity: 1; } 30% { opacity: .15; } }
  .wstreak { animation: wetsh 5s ease-in-out infinite alternate; }
  @keyframes wetsh { from { opacity: .7; } to { opacity: 1; } }
  .veh { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; }
  .vehlight { z-index: 4; mix-blend-mode: plus-lighter; }
  .vehrain { mix-blend-mode: plus-lighter; }   /* rendered roof rain, tyre spray and wake (additive loops) */
  .wetprint { position: absolute; left: 0; top: 0; width: 10px; height: 5px; margin: -2.5px 0 0 -5px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(170, 195, 235, .32), rgba(120, 150, 200, .12) 70%, rgba(0,0,0,0)); }
  .splash { position: absolute; left: 0; top: 0; width: 34px; height: 12px; margin: -6px 0 0 -17px; border-radius: 50%;
    border: 1px solid rgba(200, 225, 255, .35); }
  .carry { position: absolute; bottom: 4px; width: 16px; height: 19px; border-radius: 2px 2px 4px 4px;
    background: repeating-linear-gradient(90deg, #e8283c 0 3px, #fff 3px 6px); box-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .carry::before { content: ''; position: absolute; left: -2px; right: -2px; top: -7px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle at 30% 50%, #fff6c8 0 3px, transparent 4px), radial-gradient(circle at 70% 40%, #ffe28a 0 3px, transparent 4px), #ffd75a; }
  /* lobby props (queue 64: L18, L23, L24; art pack roxy3d/out10p): the TV's picture and the Buddy plush a winner carries */
  .tvscr { position: absolute; left: 0; top: 0; width: 96px; height: 72px; transform-origin: 0 0; overflow: hidden; pointer-events: none;
    background: linear-gradient(180deg, #2a55b8, #0d1f5c); font: 900 15px/15px Arial, sans-serif; color: #fff; text-align: center; white-space: pre-line; }
  .tvscr .bell { position: absolute; left: 7px; top: 3px; font-size: 25px; line-height: 30px; transform-origin: 50% 10%; }
  .tvscr .dgg { position: absolute; right: 6px; top: 6px; font-size: 11px; line-height: 12px; color: #cfe0ff; text-align: right; }
  .tvscr .band { position: absolute; left: 0; right: 0; bottom: 7px; padding: 3px 0 2px; background: #d81f2c; letter-spacing: .5px; box-shadow: 0 -2px 0 #fff; }
  .tvscr::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(180deg, rgba(0,0,0,.2) 0 1px, rgba(0,0,0,0) 1px 3px); }
  /* (the flash is stepped by the frame loop, not a CSS animation: those stall in throttled sources) */
  .tvscr.live .bell { transform: rotate(-24deg); transition: transform .2s; }

    const fx = document.getElementById('skyfx');

  }
  if (q.get('wet') !== '0') {

<script>
// ---------- neighborhood life (L9), queue 63 ----------
// Picked by the owner from the 9 Nov drafts (concepts/improve2/drafts/L9.png): the street around the cinema should not
// be frozen. Steam drifts from the roof vents and the noodle shop, apartment windows switch on and off over minutes,
// the blue window flickers like a TV, and the two neon signs dip for a moment like real tubes.
// Every position is measured on the render (lit_bg_dry@2x). Windows and dips follow the wall clock, so every screen of
// a shared room shows the same thing. ?life=0 turns it off; ?lifetest=1 shows every window overlay at once (to check
// that they sit on the render's windows) and dips the signs every 6 s.
(() => {
  const q = new URLSearchParams(location.search);
  if (q.get('life') === '0') return;
  const TEST = q.get('lifetest') === '1';
  const fx = document.getElementById('lifefx'), sky = document.getElementById('skyfx');
  const div = (parent, css, cls) => { const d = document.createElement('div'); if (cls) d.className = cls; d.style.cssText = css; parent.append(d); return d; };
  // a facade plane of the apartment block: x runs along the wall, which drops 1 px per 2 px (the iso 2:1)
  const wall = (x, y, w, hgt) => `left:0;top:0;width:${w}px;height:${hgt}px;transform:matrix(1,.5,0,1,${x},${y});`;
  const hash = (a, b) => { let x = (Math.imul(a, 374761393) + Math.imul(b, 668265263)) >>> 0; x = Math.imul(x ^ (x >>> 13), 1274126177) >>> 0; return ((x ^ (x >>> 16)) >>> 0) / 4294967296; };

  // steam: [x, y, size, seconds per puff]
  for (const [x, y, k, t] of [[636, 188, 1, 7], [206, 191, 0.55, 8.5], [329, 520, 0.5, 6], [150, 964, 1, 8], [1650, 905, 1.1, 7.5]]) {
    const at = div(fx, `left:${x}px;top:${y}px;transform:scale(${k})`);
    for (let i = 0; i < 3; i++) div(at, `position:absolute;animation-duration:${t}s;animation-delay:${(-i * t / 3).toFixed(2)}s`, 'puff');
  }

  // apartment windows. lit: a window that is lit in the render and can go dark; dark: one that can light up.
  // [x, y of the top-left corner, width, height, lit in the render, seconds per turn, share of turns it is switched]
  const DARK = 'background:linear-gradient(90deg,#07080b,#090a0e 60%,#060709);', WARM = 'background:linear-gradient(90deg,#b98a58 0 28%,#2a1c10 28% 34%,#ffdca6 34% 100%);box-shadow:inset 0 0 3px rgba(60,30,10,.8);';
  const wins = [[187, 301, 34, 38, true, 290, 0.35], [238, 326, 34, 38, true, 410, 0.3], [136, 331, 34, 36, true, 350, 0.3],
    [139, 280, 30, 27, false, 330, 0.4], [190, 360, 29, 28, false, 270, 0.35], [190, 414, 30, 27, false, 380, 0.3]]
    .map(([x, y, w, hgt, lit, period, share], i) => ({ el: div(fx, wall(x, y, w, hgt) + (lit ? DARK : WARM), 'lwin'), period, share, i }));
  // the blue window is someone's TV
  div(sky, wall(238, 438, 31, 29), 'ltv');
  // snarkers (queue 65, L31): two heads watching the cinema from the dark window above the TV, with a binocular glint.
  // They duck below the sill for 15 s of every 50 (wall clock). ?snark=0: none.
  let snark = null;
  if (q.get('snark') !== '0') {
    snark = div(fx, wall(240, 386, 30, 30), 'snark');
    snark.innerHTML = '<div><i style="left:5px;top:24px;width:9px;height:14px"></i><i style="left:16px;top:26px;width:9px;height:13px"></i>' +
      '<b style="left:11px;top:27px"></b><b style="left:22px;top:29px;animation-delay:-2.1s"></b></div>';
  }
  // neon dips: a dark patch over the tubes for an instant. [css, seconds between dips, offset]
  const dips = [[`left:284px;top:392px;width:64px;height:84px;border-radius:40%;background:radial-gradient(closest-side,rgba(6,4,9,.9),rgba(6,4,9,.7) 60%,rgba(6,4,9,0))`, 53, 11],
    [wall(99, 418, 91, 30) + 'background:rgba(4,9,9,.72);', 97, 40]].map(([css, period, off]) => ({ el: div(fx, css, 'ldip'), period: TEST ? 6 : period, off, slot: -1 }));

  function tick() {
    const now = Date.now() / 1000;
    for (const w of wins) w.el.classList.toggle('on', TEST || hash(w.i + 1, Math.floor(now / w.period) + w.i * 7) < w.share);
    if (snark) snark.classList.toggle('down', !TEST && now % 50 > 35);
    for (const d of dips) {
      const slot = Math.floor((now + d.off) / d.period);
      if (slot === d.slot) continue;
      const first = d.slot < 0;
      d.slot = slot;
      if (first) continue;   // not on load
      d.el.classList.remove('dip'); void d.el.offsetWidth; d.el.classList.add('dip');
    }
  }
  tick();
  setInterval(tick, 1000);
})();
</script>

  const ART = `roxy3d/${(q.get('artdir') || 'out10').replace(/[^a-z0-9_-]/gi, '')}/`;
  // L1 street marquee layer pack (roxy3d/out10m, mergeMarquee in the art section); ?marquee=0 leaves it out
  const MARQ_ON = q.get('marquee') !== '0';
  // auto = what the board writes by itself (screen 1's film); custom = the panel's / URL's own lines
  // (?marquee1= / ?marquee2=, "Marquee line 1/2" in the panel; empty = automatic, "-" = a blank line)
  const mqClean = (s) => String(s ?? '').replace(/[\u0000-\u001f\u007f]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 40);
  const MARQ = { quad: null, bands: [], key: '', foot: null, under: [], dry: null, auto: ['DINK DONK CINEMAS', 'MOVIE NIGHT'],
    custom: [mqClean(q.get('marquee1')), mqClean(q.get('marquee2'))] };
  // Marquee one-liners (queue 65, L47): while line 2 is on automatic, the last 12 s of every minute it shows one of the
  // community's stock lines instead of the screen/rating row (the film title on line 1 stays). The line is picked by the
  // wall clock, so every screen shows the same one. ?mqlines=0 turns them off.
  const MQ_LINES = ["IT'S OVER.", "I CAN'T BELIEVE THIS HAPPENED???", 'MANY SUCH CASES!', 'WAOW (BASED BASED BASED)', 'WE ARE SO BACK'];
  const MQ_LINES_ON = q.get('mqlines') !== '0';
  const mqOneLiner = () => {
    if (!MQ_LINES_ON || MARQ.custom[1]) return '';
    const t = Date.now();
    return t % 60000 >= 48000 ? MQ_LINES[Math.floor(t / 60000) % MQ_LINES.length] : '';
  };
  if (MQ_LINES_ON) setInterval(() => showMarquee(), 1000);   // (setMarqueeText does nothing while the text is the same)
  let marqDone;
  const marqReady = new Promise((ok) => { marqDone = ok; });   // the marquee pack is in (or there is none): startRain2 waits for it
  // on the sidewalk under the marquee's roof: no rain lands there
  const underMarquee = (u, v) => !!MARQ.foot && u > MARQ.foot.u_min && u < MARQ.foot.u_max && v > MARQ.foot.v_min && v < MARQ.foot.v_max;

  // ---------- iso projection: u runs down-right, v runs down-left, z is up (px) ----------
  const OX = 900;
  const OY = 350;
  const WALL = 170;
  const LOW = 34;
  const P = (u, v, z = 0) => [OX + (u - v) * 60, OY + (u + v) * 30 - z];
  const depth = (u, v) => 1000 + Math.round((u + v) * 100);
  const EH = 50;              // emote height

  // floor plan (tiles)
  const G = [3.7, 3.7];       // usher gate (lobby back corner)
  const J = [1.4, 1.4];       // corridor junction behind the gate
  // through the gap between the restroom corner (u 3.1, v 3.1) and the snack partition (u 4.4) before turning to J:
  // the straight line G -> J ran over the corner, so walkers clipped through the restroom wall (owner, 05 Nov)
  const GATE_OUT = [3.75, 2.45];
  const DOORS = [             // screens 1-5 -> room index 0-4
    { wall: 'u', at: 6.4 },   // left wing, wall u = 0, at v (screen 1 is the left-most)
    { wall: 'u', at: 4.0 },
    { wall: 'v', at: 4.8 },   // right wing, wall v = 0, at u
    { wall: 'v', at: 8.2 },
    { wall: 'v', at: 11.2 },
  ];
  const WC_V = 8.3;
  const QMAX = 6;
  // Where people queue, buy and get served. The art's manifest says which layout it was rendered for.
  const LAYOUTS = {
    1: { // pass-1 art: box office and snack bar as islands in the lobby
      windows: [{ at: [5.5, 8.38], cashier: 'cashier' }],
      slot: (i) => [6.1 + i * 0.6, 8.38],
      snack: [{ at: [9.0, 6.45], clerk: 'clerk' }, { at: [10.0, 6.45], clerk: 'clerk' }, { at: [11.0, 6.45], clerk: 'clerk' }],
      staff: { cashier: [5.5, 6.55], clerk: [10.0, 4.15], usher: [5.5, 3.75] },
      toSnack: [[7.6, 8.25], [7.6, 6.6]],
      fromSnack: [[7.4, 5.4]],
      toGate: [[7.6, 8.25], [6.6, 5.7]],
      gateIn: [4.4, 4.4],
    },
    2: { // counters against the walls: box office on the u = 3 wall, snack bar on the v = 3 wall
      windows: [{ at: [4.85, 7.4], cashier: 'cashier' }, { at: [4.85, 6.0], cashier: 'cashier2', opensAt: 3 }],
      slot: (i) => [5.5 + i * 0.62, 7.4],
      snack: [{ at: [6.6, 5.05], clerk: 'clerk1' }, { at: [8.2, 5.05], clerk: 'clerk2' }, { at: [9.8, 5.05], clerk: 'clerk3' }],
      staff: { cashier: [3.45, 7.4], cashier2: [3.45, 6.0], clerk1: [6.6, 3.75], clerk2: [8.2, 3.75], clerk3: [9.8, 3.75], usher: [5.3, 3.8] },
      toSnack: [[5.8, 5.7]],
      fromSnack: [[5.4, 5.2]],
      toGate: [[5.2, 5.4]],
      gateIn: [4.5, 4.6],
      // holding spots while the usher checks the one in front: two side by side on the free floor between the
      // podium and the box office, then by the end of the snack counter (clear of window 2, the usher and the
      // snack lines; every spot has a straight clear path to the gate)
      gateSlots: [[4.9, 4.6], [4.55, 4.95], [5.6, 5.0], [5.9, 5.45]],
      // the lobby bench (footprint u 11.2-12.6, v 6-6.4): its seat faces the street, reached round the arcade
      bench: { route: [[11.0, 7.0]], seat: [11.9, 6.66] },
    },
  };
  // pass 10: three screens on the right, restroom on the left, red-rope queue lane entered at its far end
  // Everyone lines up now, so the line snakes: 7 in the lane, then a second row back along the free floor between
  // the ropes and the glass front (v 8.25), whose head steps in at the lane's open end as places free up.
  LAYOUTS[3] = { ...LAYOUTS[2], queueEntry: [9.3, 7.4], lane: [5.2, 7.15, 9.25, 7.65], qmax: 14,
    slot: (i) => (i < 7 ? [5.47 + i * 0.62, 7.4] : [9.0 - (i - 7) * 0.62, 8.25]) };
  let L = LAYOUTS[1];
  let windows = [];
  let snackSpots = [];
  function useLayout(n) {
    L = LAYOUTS[n] || LAYOUTS[1];
    windows = L.windows.map((w) => ({ ...w, cur: null, t: 0 }));
    snackSpots = L.snack.map((s) => ({ ...s, line: [], t: 0 }));
  }
  useLayout(1);
  const CAP = 40;
  const HARD_CAP = 55;
  const JAYWALK = 0.06;   // share of arrivals on foot who walk along the road (and may get run over)

  // ---------- drawing helpers (ctx in stage px) ----------
  function poly(ctx, pts, fill, stroke, lw = 1.5) {
    ctx.beginPath();
    pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  }
  const quad = (ctx, u0, v0, u1, v1, fill, z = 0, stroke) => poly(ctx, [P(u0, v0, z), P(u1, v0, z), P(u1, v1, z), P(u0, v1, z)], fill, stroke);
  const faceU = (ctx, v, u0, u1, z0, z1, fill, stroke) => poly(ctx, [P(u0, v, z0), P(u1, v, z0), P(u1, v, z1), P(u0, v, z1)], fill, stroke);
  const faceV = (ctx, u, v0, v1, z0, z1, fill, stroke) => poly(ctx, [P(u, v0, z0), P(u, v1, z0), P(u, v1, z1), P(u, v0, z1)], fill, stroke);
  function box(ctx, u0, v0, u1, v1, z0, z1, top, front, side, stroke) {
    faceU(ctx, v1, u0, u1, z0, z1, front, stroke);
    faceV(ctx, u1, v0, v1, z0, z1, side, stroke);
    quad(ctx, u0, v0, u1, v1, top, z1, stroke);
  }
  const line = (ctx, a, b, color, w = 2) => {
    ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke();
  };
  function glow(ctx, x, y, r, color) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  function rng(seed) {
    return () => {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- static background ----------
  const bg = $('bg');
  let scale = 1;
  // the zoom director magnifies the world up to ZOOM x, so the art resolution is chosen with that headroom
  const ZOOM = clamp(Number(q.get('zoom')) || 1.85, 1.2, 3);
  // ?fit=cover: a squarer OBS source (owner, 05 Nov) is filled to its height and the sides are cropped; the wide
  // shot then centres on the lobby (stage x WIDE_X) as far as the art reaches
  const FIT_COVER = q.get('fit') === 'cover';
  const WIDE_X = clamp(Number(q.get('fitx')) || (FIT_COVER ? 1040 : 960), 0, 1920);
  const view = () => SB.view;   // the part of the stage on screen [x0, y0, x1, y1]
  const DIRECTOR_ON = q.get('director') !== '0';
  // ?maxres=<px height> (off by default): never pick art sharper than this output height needs, zoom included
  // (maxres=1080: the 1080p art and light loop even at 1440p and in zoom-ins; less memory and video decode, softer zooms)
  const MAXK = q.has('maxres') ? clamp((Number(q.get('maxres')) || 1080) / 1080, 0.5, 4) : Infinity;
  const dpr = () => Math.min(MAXK, scale * (devicePixelRatio || 1) * (DIRECTOR_ON ? ZOOM : 1));

  function drawSky(ctx) {
    const g = ctx.createLinearGradient(0, 0, 0, 760);
    g.addColorStop(0, '#120e2a'); g.addColorStop(0.6, '#2a1c4a'); g.addColorStop(1, '#3a2050');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 1920, 1080);
    const r = rng(7);
    for (let i = 0; i < 70; i++) { ctx.fillStyle = `rgba(255,255,255,${0.2 + r() * 0.5})`; ctx.fillRect(r() * 1920, r() * 300, 1.5, 1.5); }
    // skyline
    let x = -20;
    while (x < 1300) {
      const w = 60 + r() * 120;
      const top = 120 + r() * 230;
      ctx.fillStyle = r() < 0.5 ? '#171329' : '#1c1733';
      ctx.fillRect(x, top, w, 900);
      for (let wy = top + 14; wy < 640; wy += 22) {
        for (let wx = x + 10; wx < x + w - 12; wx += 18) {
          if (r() < 0.16) { ctx.fillStyle = r() < 0.7 ? 'rgba(255,214,140,.55)' : 'rgba(140,220,255,.5)'; ctx.fillRect(wx, wy, 8, 11); }
        }
      }
      x += w + 6 + r() * 20;
    }
    // the tower behind the cinema, carrying the video billboard
    const tg = ctx.createLinearGradient(1250, 0, 1920, 0);
    tg.addColorStop(0, '#1d1834'); tg.addColorStop(1, '#141026');
    ctx.fillStyle = tg; ctx.fillRect(1250, 0, 670, 1080);
    for (let wy = 420; wy < 1080; wy += 26) {
      for (let wx = 1270; wx < 1910; wx += 22) {
        if (r() < 0.12) { ctx.fillStyle = 'rgba(255,214,140,.4)'; ctx.fillRect(wx, wy, 9, 12); }
      }
    }

    ctx.fillStyle = '#0a0812'; ctx.fillRect(1280, 26, 608, 356);
    ctx.strokeStyle = '#ff5fb0'; ctx.lineWidth = 3; ctx.shadowColor = '#ff2a95'; ctx.shadowBlur = 14;
    ctx.strokeRect(1284, 30, 600, 348);
    ctx.strokeStyle = '#7ff7f0'; ctx.shadowColor = '#19e6dc'; ctx.strokeRect(1290, 36, 588, 336);

  }

  function drawStreet(ctx) {
    // asphalt, wet
    quad(ctx, -9, 10.6, 19, 13.5, '#1b1d26');
    const r = rng(11);
    for (let i = 0; i < 26; i++) {
      const u = -6 + r() * 22;
      const v = 10.9 + r() * 2.2;

    quad(ctx, -9, 9.15, 19, 10.5, '#3f414d');
    for (let u = -9; u < 19; u += 1) line(ctx, P(u, 9.15), P(u, 10.5), 'rgba(0,0,0,.25)', 1);

      glow(ctx, 0, 0, 120, 'rgba(255,95,176,.16)');

  }

  function drawBuilding(ctx) {
    // floor slab edge (front)
    poly(ctx, [P(0, 9), P(13, 9), P(13, 9, -10), P(0, 9, -10)], '#0d0b16');
    poly(ctx, [P(13, 0), P(13, 9), P(13, 9, -10), P(13, 0, -10)], '#120f1e');
    // corridors: navy carpet
    quad(ctx, 0, 0, 3, 9, '#262c4c');
    quad(ctx, 3, 0, 13, 3, '#262c4c');
    line(ctx, P(1.4, 1.4), P(1.4, 9), 'rgba(127,247,240,.10)', 14);
    line(ctx, P(1.4, 1.4), P(13, 1.4), 'rgba(127,247,240,.10)', 14);
    // lobby: purple confetti carpet
    quad(ctx, 3, 3, 13, 9, '#3b2452');
    const r = rng(3);
    const cols = ['#ff5fb0', '#7ff7f0', '#ffd75a', '#9b7bff'];
    for (let i = 0; i < 520; i++) {
      const u = 3.1 + r() * 9.8;

    }

    faceV(ctx, 0, 0, 9, 0, WALL, wl);
    const wr = ctx.createLinearGradient(0, 180, 0, 740);
    wr.addColorStop(0, '#35225a'); wr.addColorStop(1, '#4a3070');
    faceU(ctx, 0, 0, 13, 0, WALL, wr);
    // wainscot + neon stripes
    faceV(ctx, 0, 0, 9, 0, 44, '#1a1228');
    faceU(ctx, 0, 0, 13, 0, 44, '#1d142e');
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#ff2a95'; line(ctx, P(0, 9, 150), P(0, 0, 150), '#ff7cc0', 3); line(ctx, P(0, 0, 150), P(13, 0, 150), '#ff7cc0', 3);
    ctx.shadowColor = '#19e6dc'; line(ctx, P(0, 9, 46), P(0, 0, 46), '#7ff7f0', 2); line(ctx, P(0, 0, 46), P(13, 0, 46), '#7ff7f0', 2);
    ctx.shadowBlur = 0;
    // wall tops
    poly(ctx, [P(0, 9, WALL), P(0, 0, WALL), P(-0.25, -0.25, WALL), P(-0.25, 9, WALL)], '#140f22');
    poly(ctx, [P(0, 0, WALL), P(13, 0, WALL), P(13, -0.25, WALL), P(-0.25, -0.25, WALL)], '#140f22');
    // screen doors
    DOORS.forEach((d) => drawDoor(ctx, d.wall, d.at));
    // WC door
    faceV(ctx, 0, WC_V - 0.4, WC_V + 0.4, 0, 104, '#5d6a8c', 'rgba(0,0,0,.5)');
    faceV(ctx, 0, WC_V - 0.32, WC_V + 0.32, 0, 98, '#7584a8');
    const [kx, ky] = P(0, WC_V - 0.2, 50);

  }

  function drawDoor(ctx, wall, at) {
    const f = wall === 'u' ? (a, b, z0, z1, fill, s) => faceV(ctx, 0, a, b, z0, z1, fill, s) : (a, b, z0, z1, fill, s) => faceU(ctx, 0, a, b, z0, z1, fill, s);
    const pt = wall === 'u' ? (o, z) => P(0, at + o, z) : (o, z) => P(at + o, 0, z);
    f(at - 0.55, at + 0.55, 0, 114, '#8b9099', 'rgba(0,0,0,.6)');
    f(at - 0.47, at - 0.01, 0, 108, '#7a1c2c', 'rgba(0,0,0,.5)');

      ctx.strokeStyle = '#c0c4cc'; ctx.lineWidth = 2; ctx.stroke();

    ctx.save(); ctx.translate(lx, ly + 4); ctx.scale(1, 0.35); glow(ctx, 0, 0, 60, 'rgba(255,190,120,.30)'); ctx.restore();
  }

  function redrawBg() {
    const k = dpr();
    bg.width = Math.round(1920 * k);
    bg.height = Math.round(1080 * k);
    bg.style.width = '1920px';
    bg.style.height = '1080px';
    const ctx = bg.getContext('2d');
    ctx.setTransform(k, 0, 0, k, 0, 0);
    drawSky(ctx);
    drawStreet(ctx);
    drawBuilding(ctx);
  }

  // ---------- props: depth-sorted pieces of scenery that walkers can pass behind ----------
  // Each prop paints its whole art; it is cut into <= 1x1 tile chunks, each its own canvas clipped
  // to its chunk and z-sorted on its own, so walkers sort correctly against long props.
  const world = $('world');
  const props = [];
  function addProp(u0, v0, u1, v1, hgt, paint) {
    const nu = Math.max(1, Math.ceil((u1 - u0) - 0.01));
    const nv = Math.max(1, Math.ceil((v1 - v0) - 0.01));
    for (let i = 0; i < nu; i++) {
      for (let j = 0; j < nv; j++) {
        const a = u0 + ((u1 - u0) * i) / nu;
        const b = u0 + ((u1 - u0) * (i + 1)) / nu;
        const c = v0 + ((v1 - v0) * j) / nv;
        const d = v0 + ((v1 - v0) * (j + 1)) / nv;
        const hull = [P(a, c, hgt), P(b, c, hgt), P(b, c, 0), P(b, d, 0), P(a, d, 0), P(a, d, hgt)];
        const cx = hull.reduce((s, p) => s + p[0], 0) / 6;
        const cy = hull.reduce((s, p) => s + p[1], 0) / 6;
        const grown = hull.map(([x, y]) => { const l = Math.hypot(x - cx, y - cy) || 1; return [x + ((x - cx) / l) * 0.8, y + ((y - cy) / l) * 0.8]; });
        const xs = grown.map((p) => p[0]);
        const ys = grown.map((p) => p[1]);
        const bx = Math.floor(Math.min(...xs)) - 1;
        const by = Math.floor(Math.min(...ys)) - 1;
        const bw = Math.ceil(Math.max(...xs)) + 1 - bx;
        const bh = Math.ceil(Math.max(...ys)) + 1 - by;
        const cv = h('canvas', 'prop');
        Object.assign(cv.style, { left: `${bx}px`, top: `${by}px`, width: `${bw}px`, height: `${bh}px`, zIndex: String(depth((a + b) / 2, (c + d) / 2)) });
        world.append(cv);
        props.push({ cv, hull: grown, bx, by, bw, bh, paint });
      }
    }
  }
  function redrawProps() {
    const k = dpr();
    for (const p of props) {
      p.cv.width = Math.max(1, Math.round(p.bw * k));
      p.cv.height = Math.max(1, Math.round(p.bh * k));
      const ctx = p.cv.getContext('2d');
      ctx.setTransform(k, 0, 0, k, -p.bx * k, -p.by * k);
      ctx.save();
      poly(ctx, p.hull);
      ctx.clip();
      p.paint(ctx);
      ctx.restore();
    }
  }

  function buildProps() {
    // partition between lobby and corridors (cut down low), opening at the back corner
    const part = (ctx, u0, v0, u1, v1) => box(ctx, u0, v0, u1, v1, 0, LOW, '#ff7cc0', '#2a1c40', '#24183a');
    addProp(2.9, 4.4, 3.1, 9, LOW, (ctx) => part(ctx, 2.9, 4.4, 3.1, 9));
    addProp(4.4, 2.9, 13, 3.1, LOW, (ctx) => part(ctx, 4.4, 2.9, 13, 3.1));
    // building front: left wing end wall + glass storefront (low) with the door gap
    addProp(0, 8.9, 3, 9.05, LOW, (ctx) => box(ctx, 0, 8.9, 3, 9.05, 0, LOW, '#ff7cc0', '#24183a', '#20162f'));
    const glass = (ctx, u0, u1) => {
      box(ctx, u0, 8.95, u1, 9.05, 0, 30, 'rgba(190,240,255,.55)', 'rgba(127,247,240,.18)', 'rgba(127,247,240,.22)');
      line(ctx, P(u0, 9.05, 30), P(u1, 9.05, 30), '#bfefff', 2);
    };

    let rest;
    if (L.gateSlots) {
      // a line at the gate: the usher checks one at a time, the others hold at spaced spots (serveGate)
      rest = [{ call: hangOut }, { call: (x) => { x.afterGate = past; joinGate(x); } }];
    } else {
      // small personal offsets at the gate so a group doesn't stack on one spot
      const jg = () => rand(-0.22, 0.22);
      rest = [{ call: hangOut }, { to: [L.gateIn[0] + jg(), L.gateIn[1] + jg()] }, { to: [G[0] + jg(), G[1] + jg()] },
        // the usher tears the stub and points them to their wing
        { wait: w.hurry ? 0.2 : 0.7, start: () => { bounceStaff('usher'); takeStub(w); usherPoints(w); } },
        ...past];
    }
    const spot = w.detour === 'popcorn' && !w.hurry ? shortestSnack() : null;
    if (spot) {
      reserveSnack(w, spot);
      w.afterSnack = [...L.fromSnack.map((to) => ({ to })), ...rest];
      w.plan = [...L.toSnack.map((to) => ({ to })), { call: joinSnack }];
      return;
    }
    let pre;
    if (w.detour === 'arcade' && !arcadeBusy && !w.hurry) {
      // a quick round on the cabinet before the film, routed behind the cabinet with clearance
      arcadeBusy = w;
      // (with the rope lane: out past its west end and along below the back rope)
      const there = L.lane ? [[5.2, 6.6], [8.2, 6.6], [12.95, 7.0]] : [[8.2, 7.0], [12.95, 7.0]];
      pre = [...there.map((to) => ({ to })), { to: ARCADE },
        { wait: rand(3, 6), end: () => {
          if (arcadeBusy === w) arcadeBusy = null;
          arcadeFlash();
          const r = Math.random();
          // a new high score stays on the cabinet's screen for a moment (when the art has that screen)
          if (r < 0.15) { floatAt(w, '★ NEW HIGH SCORE ★', '#9fd8ff'); arcadeHiUntil = performance.now() + 3500; } else if (r < 0.5) floatAt(w, 'GAME OVER', '#9fd8ff');
        } },
        { to: [12.95, 7.0] }, { to: [8.0, 6.6] }];
    } else if (w.detour === 'claw' && PROPS.on && !PROPS.clawBusy && !w.hurry) {
      pre = clawTurn(w);   // a go on the claw machine before the film (lobby props)
    } else {
      pre = L.toGate.map((to) => ({ to }));
    }
    w.plan = [...pre, ...rest];
  }

  // usher gate: the head of the line steps up, gets the stub torn and a point to their wing, then goes on
  const gateLine = [];
  let gateT = 0;
  function joinGate(w) { gateLine.push(w); w.gi = -1; w.plan = []; }
  function serveGate(dt) {
    for (let i = gateLine.length - 1; i >= 0; i--) if (gateLine[i].gone) gateLine.splice(i, 1);
    const slots = L.gateSlots || [];
    gateLine.forEach((w, i) => {
      if (w.gi === i || w.removing) return;
      if (i > slots.length) return;   // all holding spots taken: wait where they are (inside the lobby) for one
      // the gate from the east goes round the usher's podium, not through it
      const via = i === 0 && w.gi === -1 && L.gateIn && w.u > L.gateIn[0] + 0.3 ? [{ to: L.gateIn }] : [];
      w.gi = i;
      w.plan = [...via, { to: i === 0 ? G : slots[i - 1] }];
    });
    const head = gateLine[0];
    if (!head || head.plan.length || head.removing) { gateT = 0; return; }
    if (!gateT) { bounceStaff('usher'); takeStub(head); usherPoints(head); if (LEADER_ON && SB.hashHue(head.nick) % 4 === 0) floatAt(head, 'o7', '#ffe2a8'); }
    gateT += dt;
    if (gateT < (head.hurry ? 0.2 : 0.7)) return;
    gateT = 0;
    gateLine.shift();
    head.gi = -1;
    head.plan = head.afterGate || [{ to: GATE_OUT }, { to: J }, { call: (x) => { x.plan.unshift(...doorSteps(x)); } }];
    head.afterGate = null;
  }

  // restroom: one inside, at most one waiting beside the door; anyone else holds it for later
  let wcWait = null;
  function tryWC(w) {
    if (wcWait?.gone) wcWait = null;
    if (!wcBusy && (!wcWait || wcWait === w)) {
      if (wcWait === w) wcWait = null;
      wcBusy = w;
      w.plan.unshift(
        { to: [0.55, WC_V] },
        { call: () => { w.alphaT = 0; setWC(true); dropBubble(w); playDoor('wc'); } }, { alpha: 0 },
        { wait: rand(2.5, 5) },
        { call: () => { w.alphaT = 1; setWC(false); playDoor('wc'); floatAt(w, 'much better', '#9fd8ff'); } }, { alpha: 1 },
        { to: [J[0], WC_V - 0.6] },
        { call: () => { if (wcBusy === w) wcBusy = null; } },   // next one goes in once the doorway is clear
      );
    } else if ((!wcWait || wcWait === w) && (w.wcTries = (w.wcTries || 0) + 1) < 20) {
      wcWait = w;
      w.plan.unshift({ to: [J[0] + 0.45, WC_V - 1.25] }, { wait: 0.5 }, { call: tryWC });
    } else if (wcWait === w) {
      wcWait = null;
    }
  }
  function setWC(busy) {
    wcSign.classList.toggle('busy', busy);
    if (wcLights) { wcLights.vacant.style.opacity = busy ? '0' : ''; wcLights.occupied.style.opacity = busy ? '' : '0'; }
    wcSign.textContent = `${wcLabel}${busy ? 'OCCUPIED' : 'VACANT'}`;
  }

  // now and then someone waits on the bench for a friend: the next person to come in, or 16 s at most
  let benchBusy = null;
  function tryBench(w) {
    if (benchBusy?.gone) benchBusy = null;
    if (benchBusy && benchBusy !== w && benchBusy.seated && !benchBusy.friend) benchBusy.friend = w;   // here they are
    if (!L.bench || benchBusy || w.hurry || w.benched || queue.length > 3 || roll(w, 'bench') >= 0.1) return false;
    benchBusy = w;
    w.benched = true;
    const t0 = performance.now();
    w.plan = [...L.bench.route.map((to) => ({ to })), { to: L.bench.seat }, { call: () => { w.seated = true; } },
      { until: () => !!w.friend || w.hurry || performance.now() - t0 > 16000 },
      { call: () => {
        if (w.friend && !w.friend.gone) floatAt(w, 'there you are!', '#ffe08a');
        if (benchBusy === w) benchBusy = null;
        w.seated = false;
      } },
      { wait: 0.4 }, ...L.bench.route.map((to) => ({ to })), { call: joinQueue }];
    return true;
  }

  function joinQueue(w) {
    if (tryBench(w)) return;
    // everyone lines up for a ticket (owner, 05 Nov); only at a full house (CAP) or a line past its last row do they
    // come with one already
    if (queue.length >= (L.qmax || QMAX) || w.hurry || liveCount() >= CAP) {
      giveStub(w);   // already has a ticket: the stub in hand says it, no announcement
      afterTicket(w);
      return;
    }
    queue.push(w);
    w.inQueue = true;
    w.qi = -1;
    w.plan = [];
    w.qT = 0;
    w.quitAt = !w.hurry && roll(w, 'quit') < QUIT_P ? 2.5 + 4.5 * roll(w, 'quitAt') : null;   // some lose patience (giveUp)
  }

  // Changed their mind: out of the line (by the rope lane's open end), back out into the rain, wait at the bus stop
  // and go home on the next bus (which waits for them at the door). No bus coming soon: one is called earlier.
  let QUIT_P = clamp(Number(q.get('quit')) || 0.06, 0, 1);   // ?quit=1: everyone in line gives up (testing)
  const QUIT_LINES = ['nah, going home', 'changed my mind', 'not worth it', 'this line tho', 'I\'m out'];
  function giveUp(w) {
    const inLane = !outsideLane(w);
    leaveQueue(w);
    w.quitting = true;
    floatAt(w, QUIT_LINES[Math.floor(Math.random() * QUIT_LINES.length)], '#ffb0b0');
    const door = STOPS.bus.door_ground;
    w.plan = [...(inLane ? [{ to: L.queueEntry }] : []), { to: [9.5 + rand(-0.4, 0.4), 8.6] }, { to: [9.5 + rand(-0.3, 0.3), 9.6] },
      { to: [door[0] + rand(-0.25, 0.25), rand(9.85, 10.1)] }, { call: waitBus }];
  }
  function waitBus(w) {
    // art without a bus: they walk off along the sidewalk instead of waiting at the shelter for good
    if (!VEH?.bus?.['+u']) { w.plan = [{ to: [-7, w.v] }, { call: (x) => { x.alphaT = 0; dropBubble(x); } }, { alpha: 0 }, { call: (x) => { leftRoom(x); removeWalker(x); } }]; return; }
    if (!activeBus()) nextBus = Math.min(nextBus, performance.now() + rand(6000, 14000));
    w.waitingBus = true;   // the bus waits for them (stepTraffic): they only board the frame after the last rider is off
    w.plan = [{ until: () => { const b = activeBus(); return !!b && b.state === 'stopped' && !b.riders.size; } }, { call: boardBus }];
  }
  function boardBus(w) {
    const bus = activeBus();
    if (!bus || bus.state !== 'stopped') { waitBus(w); return; }
    w.waitingBus = false;
    (bus.boarders ||= new Set()).add(w);
    const door = STOPS.bus.door_ground;
    w.plan = [{ to: door }, { to: STOPS.bus.boarding_point || [door[0], door[1] + 0.15] },   // curb, then in at the door
      { call: () => { w.alphaT = 0; dropBubble(w); if (Math.random() < 0.5) floatAt(w, 'bye 👋', '#ffe08a'); } }, { alpha: 0 },
      { call: (x) => { bus.boarders.delete(x); leftRoom(x); removeWalker(x); } }];
  }
  function leaveQueue(w) {
    const i = queue.indexOf(w);
    if (i >= 0) queue.splice(i, 1);
    w.inQueue = false;
    w.qi = -1;
  }
  // with the rope lane, anyone not in it yet walks in at its open far end
  const outsideLane = (w) => !!L.lane && !(w.u > L.lane[0] && w.u < L.lane[2] && w.v > L.lane[1] && w.v < L.lane[3]);
  // Ticket windows take the head of the line; a second window opens while the line is long.
  function serveQueue(dt) {
    // someone losing patience leaves the line (anyone still in it: being called takes them out of the queue)
    for (const w of [...queue]) {
      w.qT = (w.qT || 0) + dt;
      if (w.quitAt != null && w.qT > w.quitAt) giveUp(w);
    }
    queue.forEach((w, i) => {
      if (w.qi === i) return;
      w.qi = i;
      // with the rope lane, anyone not in it yet walks in at its open far end
      w.plan = outsideLane(w) ? [{ to: L.queueEntry }, { to: L.slot(i) }] : [{ to: L.slot(i) }];
    });
    const waiting = queue.length;   // window 2 opens on the line length before anyone is called this frame
    for (const win of windows) {
      if (win.cur?.gone) win.cur = null;
      if (!win.cur) {
        if (!queue.length || (win.opensAt && waiting < win.opensAt)) continue;
        const next = queue[0];
        leaveQueue(next);
        // someone called before reaching the rope lane still walks it, never across the ropes
        next.plan = outsideLane(next) ? [{ to: L.queueEntry }, { to: L.slot(0) }, { to: win.at }] : [{ to: win.at }];
        win.cur = next;
        win.t = 0;
        if (win.opensAt) bounceStaff(win.cashier);   // the second cashier waves them over
        continue;
      }
      if (win.cur.plan.length) continue;
      win.t += dt;
      if (win.t < Math.max(0.8, 2.6 - 0.3 * queue.length)) continue;
      const w = win.cur;
      win.cur = null;
      const cashier = staff[win.cashier];
      if (cashier) { flyTicket(cashier, w); cashier.bounce = 1; }
      giveStub(w);
      afterTicket(w);
    }
  }
  // staff talk with gestures (a hop, a pointing arrow) rather than text, so the counters stay calm
  function bounceStaff(role) { if (staff[role]) staff[role].bounce = 1; }
  // ticket stub: carried from the box office to the usher, who tears it
  function giveStub(w) {
    if (w.stub) return;
    w.stub = itemEl('stub', 'stub', HELD.stub);
    placeItem(w, w.stub, 'stub');
    w.bod.append(w.stub);
  }
  function takeStub(w) {
    if (!w.stub) return;
    w.stub.remove();
    w.stub = null;
    if (staff.usher) flyTicket(w, staff.usher, true);
  }
  function lockDoor(w) {
    if (w.doorBound) return;
    w.doorBound = true;
    w.doorRoom = (w.room || 0) % DOORS.length;
  }
  function usherPoints(w) {
    lockDoor(w);   // the wing the usher points to is the one they walk to
    const u = staff.usher;
    if (!u) return;
    const left = DOORS[w.doorRoom].wall === 'u';   // screens 1-2: left wing
    const [x, y] = P(u.u, u.v);
    floatText(x + (left ? -22 : 22), y - EH - 8, left ? '◀' : '▶', '#7ff7f0');
  }

  // an open umbrella in hand (pre-rendered sprite when the art has one); it is only open outside and folds at the
  // door (drawFigure). Everyone comes with one (it's pouring); someone heading back out gets theirs again.
  function giveUmbrella(w, r = Math.random()) {   // r: the colour pick (the room's seed: the same colour on every screen)
    w.umb?.remove();
    const colors = (UMB?.colors || []).filter((c) => UMB.open[c]?.file && validSheet(UMB.fold?.[c]));
    if (colors.length) {
      const c = colors[Math.floor(r * colors.length)];
      const o = UMB.open[c];
      const wet = UMB.wet?.[c];   // rendered rain on the canopy (BRIEF-53): a 24 fps loop, else the still sprite
      if (validSheet(wet)) {
        w.umb = h('div', 'umbs sheet');
        sheetStyle(w.umb, wet);
        w.umbLoop = { spec: wet, ph: Math.random() * 2, k: -1 };
      } else {
        w.umb = h('img', 'umbs');
        w.umb.alt = '';
        setImg(w.umb, o.file, o.file_2x, dpr() > 1.3, () => { w.umb.style.display = 'none'; });
        w.umbLoop = null;
      }
      // handle grip held at the emote's side, 40 px up (asset guidance for a 50 px emote)
      Object.assign(w.umb.style, { width: `${o.w}px`, height: `${o.h}px`, left: `${UMB_GRIP[0] - o.anchor[0]}px`, top: `${UMB_GRIP[1] - o.anchor[1]}px` });
      w.umbColor = c;
      w.umbSpec = o;
    } else {
      w.umb = h('div', 'umb');
      w.umb.style.setProperty('--c', ['#e8285c', '#2a8cff', '#ffd75a', '#1a1a24', '#7ff7f0'][Math.floor(r * 5)]);
    }
    w.bod.append(w.umb);
  }
  // A chatter's figure and their random picks. From the room (wi.room) every pick comes from rng(wi.seed) in a fixed
  // order (all drawn up front, whatever this screen then uses), so every screen of the room makes the same choices;
  // rides, traffic and the world around them stay this screen's own.
  function newChatter(wi, key) {
    const rr = wi.room ? rng(wi.seed >>> 0) : Math.random;
    const rs = (a, b) => a + rr() * (b - a);
    const w = makeFigure(wi.nick, GOLD_TEST && SB.hashHue(wi.nick) % 5 === 0 ? 'WEOW' : wi.emote, wi.color, false);
    if (wi.rainbow) { w.nm.textContent = ''; w.nm.append(h('span', 'rbt', wi.nick)); }   // tier 5: rainbow name, as in DGG chat
    w.key = key;
    figures.add(w);
    w.room = wi.roomIndex;
    // with the real restroom (layout 3) about one in five drops by before the film (chat already sends ~5 %)
    const r = rr();
    w.detour = wi.detour || (RESTROOM && r < 0.16 ? 'bathroom' : r > 0.93 ? 'arcade' : r > 0.86 || CLAW_TEST ? 'claw' : null);
    const pick = { umb: rr(), lane: rs(9.78, 10.05), dx: [rs(-0.4, 0.4), rs(-0.3, 0.3), rs(-0.6, 0.6)],
      left: rr() < 0.5, jay: rr(), jayV: rs(-0.1, 0.1), jayX: rs(-0.4, 0.4), at: rr() };
    if (wi.room) w.rolls = { bench: rr(), quit: rr(), quitAt: rr(), outside: rr(), lobby: rr(), hall: rr(), soda: rr(), umb: rr() };
    w.goldRoll = rr();   // golden WEOW (drawn last, so the picks above stay what they were)
    gild(w);
    return [w, pick];
  }
  function spawn(wi) {
    if (wi.features?.includes('moderator')) return;   // mods are the jannies (see onModMessage), they don't walk in
    if (PROPS.on && wi.tokens?.some((t) => t.t === 'text' && /^breaking\b/i.test(t.v))) breakingNews();   // "BREAKING ..." in chat: the lobby TV
    const key = wi.nick.toLowerCase();
    const old = walkers.get(key);
    if (old && !old.entering && !old.removing) {
      setEmote(old, wi.emote);
      if (!inRoom()) voteArrival(old, wi);   // (in the room the server sends a follow for it)
      // the panel's "say" (it comes back from the room as a walk-in): at once, as the panel's say did
      if (wi.say) say(old, wi.tokens);
      else queueLine(old, wi.tokens);   // said at their next conversation
      if (!old.doorBound) old.room = wi.roomIndex;
      return;
    }
    if (!wi.room && crowdSkip(wi)) return;   // the room ran the crowd rule already, once for every screen
    // someone already going through a door keeps going (still updated via `figures`); a new one walks in
    if (old) walkers.delete(key);
    const [w, pick] = newChatter(wi, key);
    giveUmbrella(w, pick.umb);
    // each arrival gets its own lane on the sidewalk (clear of the bus stop and lamp), and arrivals
    // from the same side close together start further back, so groups trickle in instead of piling up
    const lane = pick.lane;
    // before going in, some stop on the sidewalk to talk (layout 3)
    // (back from a sidewalk group they first line up with the entrance, so nobody walks through the glass)
    const walkIn = [{ to: [9.5 + pick.dx[0], lane] }, { call: hangOutside }, { to: [9.5 + pick.dx[1], 9.45] },
      { to: [9.5 + pick.dx[2], 8.6] }, { call: joinQueue }];
    // The golden WEOW (queue 72) always comes by bus, and the director always follows it in: it rides the bus that
    // is on its way or still at the stop, or calls one (goldRide). While no bus can be had (one is just leaving, the
    // lane is not clear) it waits out of sight at the stop. The follow starts with the ride, so the camera comes in
    // with the bus, and it replaces whatever the director was looking at. ?goldbus=0: arrives like everyone else.
    const goldBus = GOLD_BUS && w.gold && !!VEH;
    const ride = goldBus ? goldRide() : pickRide();
    const board = (ride) => {
      // arrives by bus / taxi: hidden until the vehicle has stopped, then steps out of its door
      // riders get off one at a time; the vehicle waits until all of them have stepped away from the door
      const { veh, door } = ride;
      const idx = veh.riders.size;
      veh.riders.add(w);
      w.ride = veh;
      w.u = door[0]; w.v = door[1];
      w.alpha = 0;
      w.alphaT = 0;
      w.plan = [{ until: () => veh.state === 'stopped' || veh.gone || !w.ride },
        { wait: 0.3 + 0.9 * idx },
        { call: () => {
          w.alphaT = 1;
          w.nameT = 7;
          splash(w.u, w.v);
          if (veh.type === 'bus' && !veh.thanked && Math.random() < 0.4) { veh.thanked = true; floatAt(w, 'thanks driver!', '#ffe08a'); }
        } },
        { to: [door[0], lane] },
        { call: () => { veh.riders.delete(w); w.ride = null; } },
        ...walkIn];
      if (goldBus && director.on) startFollow(w);
    };
    if (ride) board(ride);
    else if (goldBus) {
      [w.u, w.v] = STOPS.bus.door_ground;
      w.alpha = 0;
      w.alphaT = 0;
      let r = null;
      w.plan = [{ until: () => !!(r = goldRide()) || w.gone }, { call: () => { if (r) board(r); } }];
    } else {
      const side = pick.left ? 'l' : 'r';
      const now = performance.now();
      const k = (arrivals[side] = (arrivals[side] || []).filter((t) => now - t < 1500)).length;
      arrivals[side].push(now);
      w.u = side === 'l' ? -6 - 1.1 * k : 16.5 + 1.1 * k;
      w.v = lane;
      w.alphaT = 1;
      w.plan = walkIn;
      // now and then someone walks along the road with the traffic instead of the sidewalk; traffic doesn't stop
      // for them (stepTraffic runs them over), the rest step up to the sidewalk at the entrance
      if (VEH && pick.jay < JAYWALK) {
        w.v = (side === 'l' ? LANES.near : LANES.far) + pick.jayV;
        w.plan = [{ to: [9.5 + pick.jayX, w.v] }, ...walkIn];
      }
    }
    walkers.set(key, w);
    queueLine(w, wi.tokens);   // said once they're in view (soloSpeech), or in a talk group if they join one first
    enforceCap();
    directorArrival(w, wi);
  }

  // Crowd control: once the street and the ticket line fill up (CROWD people outside or in line), only every 2nd new
  // chatter walks in, every 3rd from 1.5x CROWD and every 5th from 2x CROWD or a full house (CAP). Chatters already
  // on screen keep talking and the host always walks in. ?crowd=<n> sets the threshold, ?crowd=0 lets everyone in.
  let CROWD = q.get('crowd') === '0' ? 0 : clamp(Number(q.get('crowd')) || 14, 4, 60);   // (the panel's crowd setting goes to the server room too)
  let crowdN = 0;
  function crowdEvery() {
    let outside = 0;
    let live = 0;
    for (const w of figures) {
      if (w.removing || w.jan || w.gone) continue;
      live++;
      if (w.inQueue || (w.v > 9.1 && !w.quitting && !w.ride)) outside++;
    }
    if (live >= CAP || outside >= CROWD * 2) return 5;
    if (outside >= CROWD * 1.5) return 3;
    return outside >= CROWD ? 2 : 1;
  }
  function crowdSkip(wi) {
    if (!CROWD || (Cinema.tag && wi.nick.toLowerCase() === Cinema.tag.toLowerCase())) return false;
    const every = crowdEvery();
    if (every === 1) { crowdN = 0; return false; }
    crowdN++;
    return crowdN % every !== 0;
  }

  // Takes someone out of every line and slot before they fade out (HARD_CAP, the panel's remove, run over): a line
  // that moved on during the fade handed them a new plan, and the invisible walker then lived on and, as head of the
  // usher's line (serveGate waits on a removing head), stopped the gate for good (QA 05 Nov)
  function retire(w) {
    if (w.inQueue) leaveQueue(w);
    if (w.snack) { w.snack.line = w.snack.line.filter((x) => x !== w); w.snack = null; w.afterSnack = null; }
    const gi = gateLine.indexOf(w);
    if (gi >= 0) gateLine.splice(gi, 1);
    for (const win of windows) if (win.cur === w) win.cur = null;
    w.removing = true;
    w.alphaT = 0;
  }
  function liveCount() {
    let n = 0;
    for (const w of figures) if (!w.removing && !w.jan) n++;
    return n;
  }
  function enforceCap() {
    const live = [...figures].filter((w) => !w.removing && !w.jan);
    if (live.length > CAP) {
      const w = live.find((x) => !x.hurry && !x.entering);
      if (w) {
        w.hurry = true;
        if (w.inQueue) { leaveQueue(w); afterTicket(w); }
        if (w.snack) leaveSnack(w);
      }
    }
    // (in the room the server keeps the hard cap, once for every screen: a remove event, why 'cap')
    if (live.length > HARD_CAP && !inRoom()) {
      const w = live.find((x) => !x.entering) || live[0];
      retire(w);

    }
