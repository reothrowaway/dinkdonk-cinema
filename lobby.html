    if (two && spec.file_2x) {   // a missing @2x sheet falls back to 1x
      const probe = new Image();
      probe.onerror = () => { if (el.style.backgroundImage.includes(spec.file_2x)) el.style.backgroundImage = `url("${ART + spec.file}")`; };
      probe.src = src;
    }
  }
  function sheetFrame(el, spec, f) {
    el.style.backgroundPosition = `${-(f % spec.columns) * spec.frame_width}px ${-Math.floor(f / spec.columns) * spec.frame_height}px`;
  }
  // a sprite-sheet animation played once at a screen position (top-left), then removed
  function sheetShot(spec, x, y, z, additive, onDone) {
    if (shots.length >= 16) return false;
    const el = h('div', additive ? 'sheet fxsheet' : 'sheet');
    sheetStyle(el, spec);
    el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
    el.style.zIndex = String(z);
    world.append(el);
    const shot = { el, spec, t: 0, onDone };
    shots.push(shot);
    return shot;
  }
  function oneShot(spec, u, v, z) {
    if (!validSheet(spec) || shots.length >= 12) return;
    const [x, y] = P(u, v);
    sheetShot(spec, x - spec.anchor[0], y - spec.anchor[1], z, true);
  }
  // screen doors / restroom door swing open (warm light spilling out) and close again
  const doorAnims = {};
  const doorBusy = {};
  // The sheet is open (first ~35 %) - hold - close. Someone arriving while it plays keeps it open: the
  // animation is wound back to the start of its hold, so no one walks through a closing door.
  function playDoor(key) {
    const d = doorAnims[key];
    if (!d) return;
    const busy = doorBusy[key];
    if (busy) {
      const holdStart = Math.round(d.frames * 0.35) / (d.fps || 18);
      if (busy.t > holdStart) busy.t = holdStart;
      return;
    }
    doorBusy[key] = sheetShot(d, d.x, d.y, d.z_index ?? 900, false, () => { doorBusy[key] = null; }) || null;
  }
  // umbrellas: a pre-rendered sprite held over the emote outside; folded with a short one-shot at the door
  let UMB = null;
  const UMB_GRIP = [10, -40];   // grip point relative to the walker's feet
  function stepShots(dt) {
    for (let i = shots.length - 1; i >= 0; i--) {
      const s = shots[i];
      s.t += dt;
      const f = Math.floor(s.t * (s.spec.fps || 24));
      if (f >= s.spec.frames) { s.el.remove(); shots.splice(i, 1); s.onDone?.(); continue; }
      sheetFrame(s.el, s.spec, f);
    }
  }

  // ---------- NPCs: pre-rendered sprite characters (the lobby cat, the janitor) ----------
  // They walk axis-aligned routes via a hub in the open middle of the lobby (every spot -> hub route was
  // checked clear of all prop footprints) and use the walk cycle for the direction they're heading.
  const HUB = [8.6, 6.6];
  const npcs = [];
  function makeNpc(specs, spots) {
    const n = { specs, spots, el: h('div', 'sheet'), spot: 0, u: 0, v: 0, anim: null, spec: null, animT: 0, t: 0, dur: 0, path: [], f: -1 };
    world.append(n.el);
    n.spot = Math.floor(Math.random() * spots.length);
    [n.u, n.v] = spots[n.spot].at;
    npcs.push(n);
    return n;
  }
  function npcAnim(n, name) {
    const spec = n.specs[name];
    if (!spec || n.anim === name) return;
    n.anim = name;
    n.spec = spec;
    n.animT = 0;
    n.f = -1;
    sheetStyle(n.el, spec);
  }
  function npcRoute(n) {
    let next = n.spot;
    while (next === n.spot) next = Math.floor(Math.random() * n.spots.length);
    n.path = [...n.spots[n.spot].route, HUB, ...[...n.spots[next].route].reverse(), n.spots[next].at];
    n.spot = next;
  }
  // one walking step; true once the route is done
  function npcWalk(n, dt) {
    const [tu, tv] = n.path[0];
    const du = tu - n.u;
    const dv = tv - n.v;
    const d = Math.hypot(du, dv);
    const name = Math.abs(du) > Math.abs(dv) ? (du > 0 ? 'walk_plus_u' : 'walk_minus_u') : (dv > 0 ? 'walk_plus_v' : 'walk_minus_v');
    npcAnim(n, name);
    const spec = n.specs[name];
    const step = (spec?.stride_tiles ? spec.stride_tiles / (spec.frames / (spec.fps || 12)) : 0.4) * dt;
    if (d <= step) { n.u = tu; n.v = tv; n.path.shift(); return !n.path.length; }
    n.u += (du / d) * step;
    n.v += (dv / d) * step;
    return false;
  }
  function npcDraw(n) {
    const spec = n.spec;
    if (!spec) return;
    const f = spec.loop === false ? Math.min(spec.frames - 1, Math.floor(n.animT * (spec.fps || 12)))
      : Math.floor(n.animT * (spec.fps || 12)) % spec.frames;
    if (f !== n.f) { n.f = f; sheetFrame(n.el, spec, f); }
    const [x, y] = P(n.u, n.v);
    n.el.style.transform = `translate(${(x - spec.anchor[0]).toFixed(1)}px, ${(y - spec.anchor[1]).toFixed(1)}px)`;
    n.el.style.zIndex = String(depth(n.u, n.v));
  }
  const npcWalkSpecs = (s) => ['walk_plus_u', 'walk_minus_u', 'walk_plus_v', 'walk_minus_v'].every((k) => validSheet(s?.[k]));

  // The lobby cat: sleeps at a favourite spot, stretches, wanders, sits a while, sleeps again; someone
  // hopping right past can wake it up.
  const CAT_SPOTS = [   // spot + its route to the hub
    { at: [11.9, 4.35], route: [[11.9, 5.6], [8.6, 5.6]] },   // by the palm, end of the snack bar
    { at: [6.2, 8.45], route: [[6.2, 6.6]] },                 // by the front glass
    { at: [12.55, 6.85], route: [[12.55, 6.6]] },             // between bench and arcade
    { at: [10.5, 7.9], route: [[10.5, 6.6]] },                // near the entrance
  ];
  let cat = null;
  function initCat(specs) {
    cat = makeNpc(specs, CAT_SPOTS);
    cat.state = 'sleep';
    cat.dur = rand(20, 50);
    npcAnim(cat, 'sleep');
  }
  function stepCat(dt) {
    if (!cat) return;
    cat.t += dt;
    cat.animT += dt;
    if (cat.state === 'sleep') {
      npcAnim(cat, 'sleep');
      if (cat.t > 4 && Math.random() < dt * 0.5) {
        for (const w of figures) {
          if (w.moving && w.alpha > 0.8 && !w.removing && Math.hypot(w.u - cat.u, w.v - cat.v) < 0.7 && Math.random() < 0.3) {
            cat.state = 'sit'; cat.t = 0; cat.dur = rand(6, 12); break;
          }
        }
      }
      if (cat.t > cat.dur) {
        cat.t = 0;
        if (cat.specs.stretch) cat.state = 'stretch'; else { cat.state = 'walk'; npcRoute(cat); }
      }
    } else if (cat.state === 'stretch') {
      npcAnim(cat, 'stretch');
      if (cat.animT >= cat.specs.stretch.frames / (cat.specs.stretch.fps || 12)) { cat.state = 'walk'; cat.t = 0; npcRoute(cat); }
    } else if (cat.state === 'walk') {
      if (npcWalk(cat, dt)) { cat.state = 'sit'; cat.t = 0; cat.dur = rand(8, 20); }
    } else if (cat.state === 'sit') {
      npcAnim(cat, 'sit');
      if (cat.t > cat.dur) { cat.state = 'sleep'; cat.t = 0; cat.dur = rand(30, 80); }
    }
    npcDraw(cat);
  }

  // The janitor: walks to a spot, sweeps it for a while, leans on the broom checking his watch, moves on.
  const JAN_SPOTS = [
    { at: [7.0, 6.2], route: [[7.0, 6.6]] },
    { at: [10.2, 7.0], route: [[10.2, 6.6]] },
    { at: [5.6, 8.3], route: [[5.6, 6.6]] },
    { at: [11.9, 5.6], route: [[8.6, 5.6]] },
  ];
  let janitor = null;
  function initJanitor(specs) {
    janitor = makeNpc(specs, JAN_SPOTS);
    janitor.state = 'sweep';
    janitor.dur = rand(6, 12);
    npcAnim(janitor, 'sweep');
  }
  // Owner's pick (02 Nov): the janitor is the cpMOP emote (Club Penguin penguin with mop and bucket, a DGG
  // inside joke) instead of the rendered 3D janitor: it mops each spot for a while (the emote itself is the
  // mopping animation) and waddles to the next one, turned the way it walks. ?janitor=3d brings the old one back.
  const JAN_EMOTE = 'assets/cpMOP.webp';
  const JAN_H = 52;
  let mopper = null;
  // ?janitor=always|3d, or the panel's Janitor setting (live): 'none' = only mods' jannies (default)
  let JANITOR = ['always', '3d'].includes(q.get('janitor')) ? q.get('janitor') : 'none';
  function applyJanitor(m = art) {
    if (mopper && JANITOR !== 'always') { mopper.gone = true; mopper.el.remove(); mopper = null; }
    if (janitor && JANITOR !== '3d') { janitor.el.remove(); npcs.splice(npcs.indexOf(janitor), 1); janitor = null; }
    if (!m) return;   // the art isn't loaded yet: setupArt calls this again
    if (JANITOR === '3d' && !janitor) { if (npcWalkSpecs(m.janitor) && validSheet(m.janitor.sweep) && validSheet(m.janitor.idle)) initJanitor(m.janitor); }
    if (JANITOR === 'always' && !mopper) initMopper();
  }
  function initMopper() {
    const el = h('div', 'w');
    const sh = h('div', 'sh');
    const bod = h('div', 'bod');
    const im = h('img', 'em');
    im.alt = '';
    im.src = JAN_EMOTE;
    const iw = Math.round((JAN_H * 144) / 128);
    Object.assign(im.style, { height: `${JAN_H}px`, width: `${iw}px`, left: `${-iw / 2}px` });
    Object.assign(sh.style, { width: '40px', left: '-20px' });
    bod.append(im);
    el.append(sh, bod);
    world.append(el);
    const spot = Math.floor(Math.random() * JAN_SPOTS.length);
    const [u, v] = JAN_SPOTS[spot].at;
    mopper = { el, bod, im, spots: JAN_SPOTS, spot, u, v, path: [], state: 'mop', t: 0, dur: rand(8, 16), phase: 0, face: 1, key: '' };
  }
  function stepMopper(dt) {
    const j = mopper;
    if (!j) return;
    j.t += dt;
    let lift = 0;
    let tilt = 0;
    if (j.held) {
      if (j.state === 'mop') j.t = Math.min(j.t, j.dur - 0.5);   // someone is talking to it: it stays and listens
    } else if (j.state === 'mop') {
      if (j.t > j.dur) { j.state = 'walk'; j.t = 0; npcRoute(j); }
    } else {
      const [tu, tv] = j.path[0];
      const du = tu - j.u;
      const dv = tv - j.v;
      const d = Math.hypot(du, dv);
      const step = 0.55 * dt;
      if (Math.abs(du - dv) > 0.01) j.face = du - dv > 0 ? 1 : -1;   // screen direction: x grows with u - v
      if (d <= step) {
        j.u = tu; j.v = tv; j.path.shift();
        if (!j.path.length) { j.state = 'mop'; j.t = 0; j.dur = rand(10, 18); }
      } else { j.u += (du / d) * step; j.v += (dv / d) * step; }
      // the same lazy waddle-and-hop as the chatters
      j.phase += dt * 3.6;
      const c = (j.phase / Math.PI) % 1;
      lift = c < 0.5 ? Math.sin((c / 0.5) * Math.PI) * 9 : 0;
      tilt = c < 0.5 ? 0 : Math.sin((c - 0.5) * 4 * Math.PI) * 3;
    }
    const [x, y] = P(j.u, j.v);
    const key = `${x.toFixed(1)}|${y.toFixed(1)}|${lift.toFixed(1)}|${tilt.toFixed(1)}|${j.face}`;
    if (key === j.key) return;
    j.key = key;
    j.el.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0)`;
    j.bod.style.transform = `translateY(${(-lift).toFixed(1)}px) rotate(${tilt.toFixed(1)}deg) scaleX(${j.face})`;
    j.el.style.zIndex = String(depth(j.u, j.v));
  }

  // ---------- jannies: DGG mods mop the lobby ----------
  // No janitor at the start (?janitor=always keeps the old penguin, ?janitor=3d the rendered one). When a DGG moderator
  // types (any message, tagged or not) a cpMOP penguin wearing their name comes in from the staff corridor behind the
  // usher, mops a free lobby spot for a while, moves on to the next, and says their messages. Several mods, several
  // jannies (one per spot, so at most JAN_SPOTS.length); 10 min without a message and they clock off the way they came.
  let JAN_IDLE = clamp(Number(q.get('janidle')) || 600, 20, 3600) * 1000;   // ?janidle=<s> for testing
  const jannies = new Map();   // nick (lower case) -> figure
  function onModMessage(m) {
    if (!m.features?.includes('moderator')) return;
    const key = m.nick.toLowerCase();
    let j = jannies.get(key);
    if (!j || j.gone) j = addJanny(m);
    if (!j) return;
    j.lastMsg = performance.now();
    queueLine(j, m.tokens);
  }
  function addJanny(m) {
    if (jannies.size >= JAN_SPOTS.length) return null;   // every spot has its janny
    const w = makeFigure(m.nick, 'PEPE', m.color, false);
    if (m.rainbow) { w.nm.textContent = ''; w.nm.append(h('span', 'rbt', m.nick)); }
    // the cpMOP penguin (with mop and bucket) instead of an emote
    w.em.remove();
    const im = h('img', 'em');
    im.alt = '';
    im.src = JAN_EMOTE;
    const iw = Math.round((JAN_H * 144) / 128);
    Object.assign(im.style, { height: `${JAN_H}px`, width: `${iw}px`, left: `${-iw / 2}px` });
    Object.assign(w.sh.style, { width: '40px', left: '-20px' });
    w.bod.prepend(im);
    w.em = im;
    w.emName = 'cpMOP';
    w.jan = true;
    w.key = m.nick.toLowerCase();
    [w.u, w.v] = J;
    w.alpha = 0;
    w.alphaT = 1;
    w.nameT = 8;
    w.spot = null;
    w.lastMsg = performance.now();
    figures.add(w);
    jannies.set(w.key, w);
    w.plan = [{ alpha: 1 }, { call: (x) => { floatAt(x, '🧹 janny on duty', '#7ff7f0'); saluteJanny(x); janNext(x); } }];
    return w;
  }
  // Salute the janny (queue 65, L39): when a mod's janny comes on duty, the chatters nearby turn to them and salute
  // (o7). Nobody's route changes: a turn, a small hop and the float.
  function saluteJanny(j) {
    let n = 0;
    for (const w of figures) {
      if (n >= 8) break;
      if (w === j || w.staff || w.jan || w.removing || w.entering || w.alpha < 0.9 || w.v > 9.15) continue;
      if (Math.hypot(w.u - j.u, w.v - j.v) > 5.5) continue;
      n++;
      setTimeout(() => {
        if (!figures.has(w) || w.removing) return;
        SB.faceEmote(w.em, w.emName, (j.u - w.u) - (j.v - w.v));
        w.bounce = Math.max(w.bounce, 1);
        floatAt(w, 'o7', '#cfe8ff');
      }, 300 + n * 140);
    }
  }
  // to a free spot (via the hub, like the old janitor), mop it, then the next one
  function janNext(j) {
    if (j.gone) return;
    if (performance.now() - j.lastMsg > JAN_IDLE) { janLeave(j); return; }
    const taken = new Set([...jannies.values()].filter((o) => o !== j && !o.gone).map((o) => o.spot));
    const free = JAN_SPOTS.map((_, i) => i).filter((i) => i !== j.spot && !taken.has(i));
    const next = free.length ? free[Math.floor(Math.random() * free.length)] : j.spot ?? 0;
    const s = JAN_SPOTS[next];
    const from = j.spot == null ? [G, L.gateIn || G] : JAN_SPOTS[j.spot].route;
    j.spot = next;
    j.mopping = false;
    const dur = rand(10, 18) * 1000;
    let t0 = 0;
    j.plan = [...[...from, HUB, ...[...s.route].reverse(), s.at].map((to) => ({ to })),
      { call: (x) => { x.mopping = true; t0 = performance.now(); } },
      { until: () => !j.held && performance.now() - t0 > dur },   // someone talking to them: they stay and listen
      { call: (x) => { x.mopping = false; janNext(x); } }];
  }
  // clocks off: back past the usher into the staff corridor
  function janLeave(j) {
    j.leaving = true;
    j.mopping = false;
    const from = j.spot == null ? [] : JAN_SPOTS[j.spot].route;
    j.spot = null;
    j.plan = [...[...from, HUB, L.gateIn || G, G, J].map((to) => ({ to })), { call: (x) => { x.alphaT = 0; dropBubble(x); } }, { alpha: 0 },
      { call: (x) => { jannies.delete(x.key); removeWalker(x); } }];
  }
  SB.on('msg', onModMessage);

  function stepJanitor(dt) {
    stepMopper(dt);
    if (!janitor) return;
    const j = janitor;
    j.t += dt;
    j.animT += dt;
    if (j.state === 'sweep') {
      npcAnim(j, 'sweep');
      if (j.t > j.dur) { j.state = 'idle'; j.t = 0; j.dur = rand(3, 6); }
    } else if (j.state === 'idle') {
      npcAnim(j, 'idle');
      if (j.t > j.dur) { j.state = 'walk'; j.t = 0; npcRoute(j); }
    } else if (j.state === 'walk') {
      if (npcWalk(j, dt)) { j.state = 'sweep'; j.t = 0; j.dur = rand(8, 16); }
    }
    npcDraw(j);
  }

  // --- per-frame update ---
  // personal space: someone about to walk into the back of a visible person just ahead (before their own
  // target) waits a moment, so lines form instead of piles; after 1.5 s they go anyway (no deadlocks)
  function blockedAhead(w, du, dv, d) {
    if (w.passT > 0 || w.alpha < 0.5 || w.entering) return false;
    const eu = du / d;
    const ev = dv / d;
    for (const o of figures) {
      if (o === w || o.gone || o.entering || o.alpha < 0.5) continue;
      const ru = o.u - w.u;
      const rv = o.v - w.v;
      const along = ru * eu + rv * ev;
      if (along <= 0.05 || along >= d) continue;   // behind, or beyond where this one is going
      if (Math.abs((ru - rv) * 60) < 34 && Math.abs((ru + rv) * 30) < 30) return true;   // overlapping on screen
    }
    return false;
  }

  // Walking pace: a stroll at 75% (owner, 05 Nov) while the lobby has room, back up to full speed as the crowd nears
  // the cap (70% -> 85% of CAP), so a busy night still clears; eased so nobody visibly changes gear mid-step.
  let pace = 0.75;
  function stepPace(dt) {
    const target = 0.75 + 0.25 * clamp((liveCount() / CAP - 0.7) / 0.15, 0, 1);
    pace += (target - pace) * Math.min(1, dt * 0.5);
  }
  function stepPlan(w, dt) {
    let moving = false;
    let guard = 8;
    if (w.passT > 0) w.passT -= dt;
    while (w.plan.length && guard--) {
      const s = w.plan[0];
      if (s.to) {
        const [tu, tv] = s.to;
        const du = tu - w.u;
        const dv = tv - w.v;
        const d = Math.hypot(du, dv);
        if (d > 0.001 && !s.slow && blockedAhead(w, du, dv, d)) {
          w.holdT = (w.holdT || 0) + dt;
          if (w.holdT > 1.5) { w.holdT = 0; w.passT = 1.2; }
          break;
        }
        w.holdT = 0;
        const sp = (w.hurry ? 3.0 : (s.slow ? 0.9 : 2.0) * pace * (w.gait?.speed || 1)) * dt;
        if (d <= sp) { w.u = tu; w.v = tv; w.plan.shift(); moving = d > 0.001; } else { w.u += (du / d) * sp; w.v += (dv / d) * sp; moving = true; }
        if (moving) SB.faceEmote(w.em, w.emName, du - dv);   // looks the way it walks (screen x = u - v)
        break;
      }
      if (s.wait != null) {
        if (!s.started) { s.started = true; s.start?.(w); }
        s.wait -= dt;
        if (s.wait <= 0) { w.plan.shift(); s.end?.(w); }
        break;
      }
      if (s.until) {   // hold until a condition is true (e.g. their bus / taxi has stopped)
        if (s.until()) { w.plan.shift(); continue; }
        break;
      }
      if (s.alpha != null) {
        if (Math.abs(w.alpha - s.alpha) < 0.02) { w.alpha = s.alpha; w.plan.shift(); continue; }
        break;
      }
      if (s.call) { w.plan.shift(); s.call(w); if (w.gone) return false; continue; }
      w.plan.shift();
    }
    if (w.plan.length === 0 && !w.inQueue && !w.staff && !w.gone) { /* idle until the queue moves */ }
    return moving;
  }

  // The glass front (v 8.95-9.05, u 3-13) is cut into depth slices ~0.9 tile wide, each sorted at its middle. Right
  // at the glass a figure's sprite (and umbrella) overlaps the neighbouring slices, so plain depth sorting put glass
  // over people outside and people inside over the glass. Near the front, sort by the side of the glass instead:
  // outside within a tile always in front of the slices they can overlap, inside always behind them.
  function frontV(u, v) {
    if (u < 2.9 || u > 13.1) return v;   // left of the glass: the bus shelter and the solid wall sort as usual
    if (v >= 9.05) return v < 10 ? 10 : v;
    return Math.min(v, 16.85 - v);
  }
  function drawFigure(w, dt, t) {
    let s = 0;
    let lift = 0;
    let tilt = 0;
    let bouncing = false;
    const moving = w.moving;
    if (t < combo.until && w.emName === combo.emote && !w.entering) {
      s = Math.abs(Math.sin(((t - combo.start) / 1000) * 9));
      lift = s * 26;
      bouncing = true;
    } else if (w.bounce > 0) {
      w.bounce = Math.max(0, w.bounce - dt * 2.4);
      s = Math.sin(w.bounce * Math.PI);
      lift = s * 12;
      bouncing = true;
    } else if (moving) {
      // one lazy hop every ~0.8 s (0.55 s hurrying), waddling along the floor in between
      w.phase += dt * (w.hurry ? 5.7 : 3.9 * pace);
      const c = (w.phase / Math.PI) % 1;
      s = c < 0.5 ? Math.sin((c / 0.5) * Math.PI) : 0;
      lift = s * 13;
      bouncing = c < 0.5;
      tilt = c < 0.5 ? 0 : Math.sin((c - 0.5) * 4 * Math.PI) * 3.5;
      if (w.gait?.crawl) { s = 0; lift = 0; bouncing = false; tilt *= 0.5; }   // crawlers and sneakers don't hop
      // landing on wet pavement: splash ring
      if (w.lastC != null && w.lastC < 0.5 && c >= 0.5) {

  // ---------- conversations: speech only happens in groups (owner, 02 Nov) ----------
  // A chatter's messages are saved (latest two). After tickets / popcorn, instead of heading straight for the

  // each line from someone's saved messages. With nothing left to say they drift on to the gate. Someone left
  // alone with something to say goes and tells the mopping penguin instead (it stops to listen).
  const HANGOUTS = [[10.8, 7.2], [11.0, 5.35]];   // open lobby floor, clear of the rope lane, counters and props

  const HANG_P = { outside: [0.5, 0.35], lobby: [1, 0.5], hall: [0.7, 0.4] };
  const groups = [];
  // Every message a chatter sends is said once, in order: in a talk group when their turn comes, otherwise on their
  // own a moment after it arrives (soloSpeech). Nothing is repeated; a backlog over 4 says the oldest at once.

  }

  function soloSpeech(w, dt) {
    if (!w.lines?.length || (w.group && w.arrived) || w.entering || w.removing || !onScreen(w)) { w.soloT = 0; return; }
    if (w.bub && w.bubT > 1.5) return;   // let the current bubble be read first
    w.soloT = (w.soloT || 0) + dt;

  const janTarget = () => mopper || [...jannies.values()].find((j) => j.mopping && !j.leaving && !j.gone) || null;
  const groupCenter = (g) => (g.janitor && g.jan && !g.jan.gone ? [g.jan.u, g.jan.v] : g.center || [0, 0]);
  function slotOf(g, w) {
    const [cu, cv] = groupCenter(g);

  // ---------- layout 3 (pass 10): three screens in the right wing, the left wing is the restroom ----------

  // ---------- director: interesting spots (queue 56) ----------
  // Now and then, instead of the next arrival, the camera takes a look at something for at most 7 s, then back to the
  // wide shot: the billboards, the big DINK DONK sign, the cashiers and the snack clerks, the usher, the screens'

    nextBoard = el;
    applyRooms(rooms);
  }
  // ?pollscreen=0 / the panel's "Poll screen on the back wall" off (POLLSCREEN): no poll screen and no NEXT SHOWING
  // board (built the first time it is on; off later just hides both)
  let pollStarted = false;
  function startPollScreen() {
    if (!POLLSCREEN || pollStarted) return;
    pollStarted = true;
    buildNextBoard();
    buildPollScreen();
    renderPollScreen();
    pollPollScreen();
    setInterval(pollPollScreen, 2000);
  }
  function setPollScreenOn(on) {
    POLLSCREEN = !!on;
    if (POLLSCREEN && art && lobbyReady) startPollScreen();
    for (const el of [pollScreen.el, nextBoard]) if (el) el.style.display = POLLSCREEN ? '' : 'none';
    if (!POLLSCREEN && director.spot) { director.spot = null; endFollow(); }   // the camera was on the poll: back to wide
  }
  function zoomToPollScreen() {
    if (!pollScreen.el || !POLLSCREEN) return;
    const [x0, y0, x1, y1] = pollScreenBox();
    endFollow();
    director.wantNext = false;
    // fit = the zoom where the screen fills the view; the panel's Zoom amount scales it (owner, 8 Nov 2026): at the
    // default (ZOOM, 1.85) the screen fills the view as before, lower shows more lobby around it, higher moves in closer
    const fit = Math.min(1920 * 0.94 / (x1 - x0), 1080 * 0.96 / (y1 - y0));
    director.spot = { x: (x0 + x1) / 2, y: (y0 + y1) / 2, fit, poll: true, z: pollZoom(fit) };
  }
  // (up to 4x: the screen's text is DOM, it stays sharp)
  const pollZoom = (fit) => clamp(fit * director.zoom / ZOOM, 1.2, 4);
  // the Zoom amount changed while the camera is on the poll screen: follow it there too
  function rezoomPoll() { if (director.spot?.poll) director.spot.z = pollZoom(director.spot.fit); }
  // ===== end POLL SCREEN ==================================================================================

  (async () => {
    art = await loadArt();
    useLayout(Number(q.get('layout')) || (LAYOUTS[art?.layout] ? art.layout : 1));   // ?layout= forces one (testing)
    if (art) setupArt(art); else buildProps();
    if (art) startPollScreen();   // the roll-up poll screen on the corridor back wall
    lobbyReady = true;
    if (pendingSnapshot) applySnapshot(pendingSnapshot);
    SB.on('resize', (s) => {
      scale = s;
      if (!art) { redrawBg(); redrawProps(); return; }
      applyArtRes();
      loopSwap?.(dpr());
      traffic.forEach(vehSprites);
      for (const n of npcs) if (n.spec) { sheetStyle(n.el, n.spec); n.f = -1; }   // keeps clock and frame
      for (const w of figures) if (w.umbSpec && w.umb) setImg(w.umb, w.umbSpec.file, w.umbSpec.file_2x, dpr() > 1.3);
      shots.forEach((sh) => sheetStyle(sh.el, sh.spec));
    });
    SB.mountStage($('stage'), { cover: FIT_COVER });
    if (!art) document.fonts?.ready.then(() => { redrawBg(); redrawProps(); });
    requestAnimationFrame(loop);
    SB.start();
  })();

  // fly-through blockout (shared/transition.js): where everyone stands right now, and a way to force the wide shot
  window.DD_FLY = {
    figures: () => [...new Set([...figures, ...Object.values(staff)])].filter((w) => !w.gone && !w.removing).map((w) => ({
      nick: w.nick, u: w.u, v: w.v, zpx: w.stand || 0, color: w.nm?.style.color || null, staff: !!w.staff,
      ride: !!w.ride, alpha: w.alpha ?? 1, status: w.staff ? 'staff' : statusOf(w),
      em: w.emName, emW: Number(w.em?.dataset.w) || 0, emH: parseFloat(w.em?.style.height) || 0,
      flip: w.em?.dataset.flip === 'true', rainbow: !!w.nm?.classList.contains('rbt') })),
    wide: () => { director.wantNext = false; director.spot = null; endFollow(); },
    camera: () => ({ zoom: director.zoom, spot: director.spot && { ...director.spot } }),   // QA: what the camera aims at
  };
})();
</script>
<script src="shared/transition.js"></script>
</body>
</html>
