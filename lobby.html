<!doctype html>
<!--
  DINK DONK CINEMA LOBBY (lobby.html, was roxy.html) - split-wings layout (BLOCKOUT: layout and flow first, final art later)

  Street strip in front -> glass doors -> lobby with the box office (queue) and the snack
  island -> usher gate at the back corner -> the corridor forks: left wing = screens 1-2 (+ WC),
  right wing = screens 3-5. Each door is in an outer wall; its auditorium is behind it.
  Screens 1-5 = the last five films on dinkdonk.mov (shared/cinema.js).

  Everything lives inside the world: no HUD, no green screen, no floating signs (owner, 02 Nov).
  No chat panel: every chatter talks in a bubble over their emote.
  Zoom director: now and then the camera follows one arriving chatter to their door (control.html,
  keys F/R/W/D). Options: demo=1, live=1 (auto-reload on file change), wet2x=1 (4K wet loops, heavy), crowd=<n> (people outside/in line before new chatters are skipped, 14; 0 = never), mist=1-4 (splash spray samples, off by default), morerain=0 (no extra rain/weather; 1-4 = one fixed style), weather=<x> (weather clock x times faster, testing), rainfps=<n> (extra rain steps per second, 24 like the baked loops; 0 = smooth), tag= / everyone=1 (who walks in,
  see shared/cinema.js), director=0|<seconds>, zoom=<1.2-3>, ctl=0 (no control panel link), maxres=<height> (cap the art
  resolution, e.g. 1080: no 4K art or loops even at 1440p; off by default), fit=cover (fill a squarer or wider source:
  crop the sides instead of black bars; the wide shot centres on fitx=<stage x>, 1040), rainspeed=<x> / raintune=1.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lobby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600&family=Yellowtail&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { background: #0b0a12; font-family: Oswald, 'Arial Narrow', Arial, sans-serif; color: #fff; }
  .layer { position: absolute; left: 0; top: 0; pointer-events: none; }
  #world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .prop { position: absolute; pointer-events: none; }

  .w { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  .w .sh { position: absolute; left: -19px; top: -7px; width: 38px; height: 14px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0,0,0,.55), rgba(0,0,0,0)); }
  .w .bod { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
  .w .em { position: absolute; bottom: 0; }
  .w .nm { position: absolute; left: 0; top: 7px; transform: translateX(-50%); white-space: nowrap;
    font: 500 14px/1 Oswald, 'Arial Narrow', sans-serif; letter-spacing: .02em;
    text-shadow: 0 1px 2px #000, 0 0 4px #000, 0 0 2px #000; }
  .w .nm { transition: opacity .4s; padding: 0 4px 1px; border-radius: 2px; background: rgba(8, 6, 18, .5); }
  .w.staff .nm { display: none; }
  /* DGG tier 5 subs: the moving rainbow name of DGG chat (same gradient as the DSA script) */
  .rbt { background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bff95, #67d8ff, #b28dff, #ff78c6, #ff6b6b);
    background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-fill-color: transparent; animation: rbt 4s linear infinite; }
  @keyframes rbt { to { background-position: -220% 0; } }
  /* staff wear a little uniform cap so they don't read as customers */
  /* shaded like the render: lit from the top-left, darker underside */
  .hat { position: absolute; left: -14px; bottom: 44px; width: 28px; height: 11px; border-radius: 4px 4px 1px 1px;
    background: linear-gradient(170deg, #c8394a, #8c1724 70%); box-shadow: inset 0 -3px 0 #b8933f, 0 2px 3px rgba(0,0,0,.6); }
  .hat.usher { background: linear-gradient(170deg, #6a2036, #34101c 70%); box-shadow: inset 0 -3px 0 #b8933f, 0 2px 3px rgba(0,0,0,.6); }
  .hat.usher::after { content: ''; position: absolute; left: 11px; top: -4px; width: 6px; height: 6px; border-radius: 50%; background: #f0c85a; }
  .ticket.torn { width: 9px; }
  .item { position: absolute; pointer-events: none; }
  .stub { position: absolute; bottom: 12px; width: 11px; height: 7px; background: linear-gradient(160deg, #f0d48a, #b8933f);
    border-radius: 1px; box-shadow: 0 1px 2px rgba(0,0,0,.6); transform: rotate(-14deg); }
  .umb { position: absolute; left: -30px; bottom: 54px; width: 60px; height: 22px; display: none;
    border-radius: 60px 60px 6px 6px / 44px 44px 6px 6px; background: var(--c);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.25), inset 10px 4px 0 rgba(255,255,255,.12), 0 2px 4px rgba(0,0,0,.5); }
  .umb::after { content: ''; position: absolute; left: 29px; top: 20px; width: 2px; height: 30px; background: #222; }
  .w.out .umb { display: block; }
  .w.out .em { filter: brightness(.84) saturate(.9); }   /* night street: dimmer than the lobby */
  .umbs { position: absolute; display: none; pointer-events: none; }
  .w.out .umbs { display: block; }
  .doorglow { position: absolute; left: 0; top: 0; width: 150px; height: 96px; margin: -48px 0 0 -75px; pointer-events: none;
    border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 196, 120, .55), rgba(255, 150, 80, .18) 55%, rgba(0,0,0,0));
    mix-blend-mode: plus-lighter; }
  .doorglow.arcadeglow { width: 70px; height: 56px; margin: -28px 0 0 -35px;
    background: radial-gradient(closest-side, rgba(120, 170, 255, .8), rgba(80, 120, 255, 0)); }
  .sheet { position: absolute; left: 0; top: 0; pointer-events: none; background-repeat: no-repeat; }
  .fxsheet { mix-blend-mode: plus-lighter; }
  .proploop { position: absolute; pointer-events: none; mix-blend-mode: plus-lighter; background-repeat: no-repeat; }
  .veh { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; }
  .vehlight { z-index: 4; mix-blend-mode: plus-lighter; }
  .vehrain { mix-blend-mode: plus-lighter; }   /* rendered roof rain, tyre spray and wake (additive loops) */
  .wetprint { position: absolute; left: 0; top: 0; width: 10px; height: 5px; margin: -2.5px 0 0 -5px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(170, 195, 235, .32), rgba(120, 150, 200, .12) 70%, rgba(0,0,0,0)); }
  .splash { position: absolute; left: 0; top: 0; width: 34px; height: 12px; margin: -6px 0 0 -17px; border-radius: 50%;
    border: 1px solid rgba(200, 225, 255, .35); }
  .carry { position: absolute; bottom: 4px; width: 16px; height: 19px; border-radius: 2px 2px 4px 4px;
    background: repeating-linear-gradient(90deg, #e8283c 0 3px, #fff 3px 6px); box-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .carry::before { content: ''; position: absolute; left: -2px; right: -2px; top: -7px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle at 30% 50%, #fff6c8 0 3px, transparent 4px), radial-gradient(circle at 70% 40%, #ffe28a 0 3px, transparent 4px), #ffd75a; }

  #stage { overflow: hidden; }
  #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  #hang, #fx, #bubbles { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
  #rain { z-index: 70000; width: 1920px; height: 1080px; }
  #rain2 { z-index: 70002; width: 1920px; height: 1080px; display: none; mix-blend-mode: plus-lighter; }
  #mist { z-index: 69990; width: 1920px; height: 1080px; display: none; mix-blend-mode: plus-lighter; }
  #hang { z-index: 80000; }
  #fx { z-index: 85000; }
  #bubbles { z-index: 86000; }   /* speech always above announcements */

  /* square, plain 90s game dialog box (not a web widget): big readable sans, no bloom */
  .bub { position: absolute; left: 0; top: 0; max-width: 330px; padding: 5px 10px 6px; border-radius: 3px;
    background: rgba(10, 9, 22, .9); border: 1px solid rgba(200, 220, 255, .6); color: #f4f4ff;
    font: 700 18px/1.28 Verdana, Tahoma, 'Segoe UI', sans-serif; white-space: normal; overflow-wrap: anywhere;
    box-shadow: 2px 2px 0 rgba(0, 0, 0, .55); }
  .bub .bn { font: 700 13px/1.2 Verdana, Tahoma, sans-serif; margin-bottom: 1px; letter-spacing: .02em; }
  .bub .bt { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .bub::after { content: ''; position: absolute; left: calc(50% + var(--tail, 0px)); bottom: -8px; margin-left: -7px; border: 7px solid transparent;
    border-top-color: rgba(200, 220, 255, .6); border-bottom: 0; }
  .bub .sb-emote { vertical-align: middle; margin: 0 2px; }

  .fl { position: absolute; left: 0; top: 0; white-space: nowrap; font: 600 16px/1 Oswald, sans-serif; letter-spacing: .04em;
    color: #ffe08a; text-shadow: 0 0 6px rgba(255, 140, 200, .8), 0 1px 2px #000; }
  .ticket { position: absolute; left: -9px; top: -6px; width: 18px; height: 11px; background: #ffd75a; border-radius: 2px;
    box-shadow: 0 0 8px rgba(255, 215, 90, .9); }

  .sign { position: absolute; left: 0; top: 0; width: 176px; transform: translate(-50%, -100%); text-align: center;
    background: linear-gradient(#1a1430, #120e22); border: 2px solid #ff5fb0; border-radius: 6px; padding: 4px 6px 5px;
    box-shadow: 0 0 14px rgba(255, 95, 176, .45), inset 0 0 10px rgba(255, 95, 176, .2); }
  .sign .no { font: 400 22px/1 'Bebas Neue', Oswald, sans-serif; color: #7ff7f0; text-shadow: 0 0 6px #19e6dc; }
  .sign .ti { font: 400 21px/1.05 'Bebas Neue', Oswald, sans-serif; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sign .me { font: 500 13px/1.2 Oswald, sans-serif; color: #ffd27a; }
  .sign .in { font: 500 13px/1.2 Oswald, sans-serif; color: #9fd8ff; }

  .poster { position: absolute; left: 0; top: 0; width: 100px; height: 150px; transform-origin: 0 0; overflow: hidden;
    background: #241c3a; border: 3px solid #0e0b18; box-sizing: border-box; }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; position: relative; z-index: 1; }
  .poster .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 6px;

  .hsign { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); white-space: nowrap; text-align: center; }
  .neon { font: 400 34px/1 'Bebas Neue', Oswald, sans-serif; letter-spacing: .12em; color: #eaffff;
    text-shadow: 0 0 4px #7ff7f0, 0 0 12px #19e6dc, 0 0 24px #19e6dc; }
  .menu { background: #f4f1ff; color: #1a1430; border: 3px solid #2a2340; border-radius: 4px; padding: 5px 12px 6px;
    box-shadow: 0 0 22px rgba(255, 255, 255, .35); font: 600 14px/1.25 Oswald, sans-serif; text-align: left; }
  .menu b { display: block; font: 400 22px/1 'Bebas Neue', sans-serif; color: #e8285c; letter-spacing: .08em; text-align: center; }
  .menu span { display: inline-block; min-width: 92px; }
  .gate { font: 400 20px/1 'Bebas Neue', sans-serif; letter-spacing: .1em; background: #120e22; border: 2px solid #7ff7f0;
    border-radius: 4px; padding: 4px 10px 3px; color: #eaffff; box-shadow: 0 0 12px rgba(127,247,240,.4); }
  .wcsign { font: 600 13px/1 Oswald, sans-serif; padding: 3px 7px; border-radius: 3px; background: #10301c; color: #6dff9b;
    border: 1px solid #6dff9b; letter-spacing: .08em; }
  .wcsign.busy { background: #3a1010; color: #ff6d6d; border-color: #ff6d6d; }

  /* pre-rendered art (roxy3d/out): the marquee boxes and poster frames are in the render */
  #bgimg, #glow { width: 1920px; height: 1080px; display: none; }
  #glow { z-index: 1; mix-blend-mode: screen; }   /* over the background, under posters, signs and chatters */
  #loop { width: 1920px; height: 1080px; display: none; z-index: 2; mix-blend-mode: plus-lighter; object-fit: fill; }
  /* above walkers and vehicles, below hanging signs, bubbles and the HUD */
  #rainfg { width: 1920px; height: 1080px; display: none; z-index: 70001; mix-blend-mode: plus-lighter; object-fit: fill; }
  /* inset inside the rendered marquee box so its bevel and lighting stay visible around the text */
  .art .sign { width: 150px; height: 78px; margin-top: -7px; box-sizing: border-box; padding: 4px 7px 0;
    background: linear-gradient(rgba(16, 20, 44, .6), rgba(16, 20, 44, .34));
    border-color: transparent; box-shadow: none; border-radius: 2px; }
  .art .sign .no { font-size: 17px; line-height: 1; }
  .art .sign .ti { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    font-size: 19px; line-height: 1; }
  .art .sign .me { font-size: 12px; opacity: .9; white-space: nowrap; }
  .art .sign .in { display: none; }   /* the count shares the secondary row (.me) */
  .art .sign.compact .ti { -webkit-line-clamp: 1; }
  .art .sign .ti { text-shadow: 0 0 8px rgba(255, 95, 176, .7); }
  .art .poster { border-width: 0; }
  /* ---- bubble look drafts (07 Nov 2026), ?bubstyle=1..5; none = the current dialog box ----
     every look keeps the same box model (padding, max-width, 3-line clamp), so placement and stacking are unchanged */
  :is(.bs1, .bs2, .bs3, .bs4, .bs5) .bub::after { border-top-color: var(--tc); }
  :is(.bs1, .bs2, .bs3, .bs4, .bs5) .bub.below::after { border-top-color: transparent; border-bottom-color: var(--tc); }
  /* light looks: the name sits on a dark chip so pale flair colors stay readable */
  .bs1 .bub .bn, .bs2 .bub .bn, .bs4 .bub .bn { display: inline-block; padding: 1px 6px; margin-bottom: 3px; border-radius: 3px; background: #1c1524; }

  /* 1 MARQUEE: warm cream marquee panel with a row of bulbs along the top */
  .bs1 .bub { --tc: #3a2410; background: linear-gradient(#fff4d2, #f0d99c); color: #1f1408; border: 2px solid #3a2410;
    border-radius: 4px; padding-top: 11px; box-shadow: 0 0 10px rgba(255, 196, 90, .45), 2px 3px 0 rgba(0, 0, 0, .6);
    font: 800 18px/1.25 'Trebuchet MS', Verdana, sans-serif; }
  .bs1 .bub::before { content: ''; position: absolute; left: 6px; right: 6px; top: 3px; height: 5px;
    background: radial-gradient(circle, #fff7c0 0 1.6px, #ffb43a 2.2px, transparent 2.8px) 0 0 / 10px 5px repeat-x; }

  /* 2 TICKET STUB: off-white admit-one stub, notched sides, typewriter text, red stamped name */
  .bs2 .bub { --tc: #efe4cc; color: #2a2017; border: 0; border-radius: 2px; padding: 6px 16px 7px;
    background: radial-gradient(circle at 0 50%, transparent 7px, #efe4cc 7.5px) left / 51% 100% no-repeat,
                radial-gradient(circle at 100% 50%, transparent 7px, #efe4cc 7.5px) right / 51% 100% no-repeat;
    box-shadow: none; filter: drop-shadow(2px 3px 0 rgba(0, 0, 0, .55)); font: 700 17px/1.28 'Courier New', Courier, monospace; }
  .bs2 .bub::before { content: ''; position: absolute; left: 9px; top: 4px; bottom: 4px; border-left: 2px dashed rgba(120, 30, 30, .35); }
  .bs2 .bub .bn { background: #8e1d1d; color: #fff3e0 !important; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
  .bs2 .bub .bn .rbt { -webkit-text-fill-color: #fff3e0; }

  /* 3 NEON: dark glass with a rounded outline and a soft glow in the speaker's own name color */
  .bs3 .bub { --tc: var(--nc, #9fd0ff); background: rgba(8, 6, 20, .86); border: 2px solid var(--nc, #9fd0ff); border-radius: 12px;
    color: #fbf8ff; box-shadow: 0 0 8px color-mix(in srgb, var(--nc, #9fd0ff) 70%, transparent), inset 0 0 6px color-mix(in srgb, var(--nc, #9fd0ff) 35%, transparent);
    font: 700 18px/1.28 Verdana, Tahoma, sans-serif; padding: 5px 12px 7px; }
  .bs3 .bub .bn { text-shadow: 0 0 6px currentColor; }

  /* 4 COMIC: white rounded speech balloon with a thick black outline */
  .bs4 .bub { --tc: #111; background: #fff; color: #111; border: 3px solid #111; border-radius: 16px; padding: 5px 12px 7px;
    box-shadow: 3px 3px 0 rgba(0, 0, 0, .55); font: 700 18px/1.25 'Comic Sans MS', 'Trebuchet MS', sans-serif; }
  .bs4 .bub::after { border-width: 9px; margin-left: -9px; bottom: -11px; }
  .bs4 .bub.below::after { top: -11px; bottom: auto; }

  /* 5 RPG WINDOW: blue gradient game window, white double frame, drop-shadowed text, name over a rule */
  .bs5 .bub { --tc: #e8ecff; background: linear-gradient(#3248b0, #121c5c 70%, #0b1240); color: #fff; border: 2px solid #e8ecff;
    border-radius: 6px; outline: 2px solid #0a0d22; box-shadow: inset 0 0 0 2px #0a0d22, inset 0 0 0 3px rgba(232, 236, 255, .35), 3px 4px 0 rgba(0, 0, 0, .5);
    text-shadow: 2px 2px 0 #000; padding: 6px 12px 8px; font: 700 18px/1.28 Verdana, Tahoma, sans-serif; }
  .bs5 .bub .bn { padding-bottom: 2px; margin-bottom: 3px; border-bottom: 1px solid rgba(232, 236, 255, .35); }
</style>
</head>
<body>
<div id="stage">
  <!-- the camera: everything in the world zooms/pans together (zoom director); speech bubbles stay screen-sized -->
  <div id="cam">
    <canvas id="bg" class="layer"></canvas>
    <img id="bgimg" class="layer" alt="">
    <div id="world"></div>
    <img id="glow" class="layer" alt="">
    <video id="loop" class="layer" muted loop autoplay playsinline></video>
    <canvas id="mist" class="layer" width="960" height="540"></canvas>
    <canvas id="rain" class="layer" width="960" height="540"></canvas>
    <video id="rainfg" class="layer" muted loop autoplay playsinline></video>
    <canvas id="rain2" class="layer" width="960" height="540"></canvas>
    <div id="hang"></div>
    <div id="fx"></div>
  </div>
  <div id="bubbles"></div>
</div>
<script src="shared/core.js"></script>
<script src="shared/cinema.js"></script>
<script src="shared/live.js"></script>
<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const h = (tag, cls, text) => {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text != null) el.textContent = text;
    return el;
  };
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const rand = (a, b) => a + Math.random() * (b - a);
  const q = new URLSearchParams(location.search);
  // out = pass 1 (islands), out2 = counters on the walls + light loop, out3 = out2 + vehicles + lit_bg,
  // out4 = out3 + calmer carpet, warm light at the service points, prop loops,
  // out5 = out4 + vehicle depth slices, brake/indicator lights, lobby cat, tyre spray,
  // out6 = out5 + separated marquees/posters, wear, door animations, umbrella sprites, janitor, shelter drip,
  // out7 = out6 + rendered carried items / staff caps, indicator-only lights,
  // out8 = out7 + the city around the cinema, heavy rain (6 s loop + foreground rain), glass water, arcade play/hiscore, wet prints,
  // out8b = out8 polished: denser rain, wetter glass, broken reflections, textured alley, no carpet outlines, dry fallback still
  // out10 = final render of approved draft 13 (layout 3, cloud run 03 Nov 2026); ?artdir=out8b for the previous pack
  const ART = `roxy3d/${(q.get('artdir') || 'out10').replace(/[^a-z0-9_-]/gi, '')}/`;

  // ---------- iso projection: u runs down-right, v runs down-left, z is up (px) ----------
  const OX = 900;
  const OY = 350;
  const WALL = 170;
  const LOW = 34;
  const P = (u, v, z = 0) => [OX + (u - v) * 60, OY + (u + v) * 30 - z];
  const depth = (u, v) => 1000 + Math.round((u + v) * 100);
  const EH = 50;              // emote height

  // floor plan (tiles)
  const G = [3.7, 3.7];       // usher gate (lobby back corner)
  const J = [1.4, 1.4];       // corridor junction behind the gate
  // through the gap between the restroom corner (u 3.1, v 3.1) and the snack partition (u 4.4) before turning to J:
  // the straight line G -> J ran over the corner, so walkers clipped through the restroom wall (owner, 05 Nov)
  const GATE_OUT = [3.75, 2.45];
  const DOORS = [             // screens 1-5 -> room index 0-4
    { wall: 'u', at: 6.4 },   // left wing, wall u = 0, at v (screen 1 is the left-most)
    { wall: 'u', at: 4.0 },
    { wall: 'v', at: 4.8 },   // right wing, wall v = 0, at u
    { wall: 'v', at: 8.2 },
    { wall: 'v', at: 11.2 },
  ];
  const WC_V = 8.3;
  const QMAX = 6;
  // Where people queue, buy and get served. The art's manifest says which layout it was rendered for.
  const LAYOUTS = {
    1: { // pass-1 art: box office and snack bar as islands in the lobby
      windows: [{ at: [5.5, 8.38], cashier: 'cashier' }],
      slot: (i) => [6.1 + i * 0.6, 8.38],
      snack: [{ at: [9.0, 6.45], clerk: 'clerk' }, { at: [10.0, 6.45], clerk: 'clerk' }, { at: [11.0, 6.45], clerk: 'clerk' }],
      staff: { cashier: [5.5, 6.55], clerk: [10.0, 4.15], usher: [5.5, 3.75] },
      toSnack: [[7.6, 8.25], [7.6, 6.6]],
      fromSnack: [[7.4, 5.4]],
      toGate: [[7.6, 8.25], [6.6, 5.7]],
      gateIn: [4.4, 4.4],
    },
    2: { // counters against the walls: box office on the u = 3 wall, snack bar on the v = 3 wall
      windows: [{ at: [4.85, 7.4], cashier: 'cashier' }, { at: [4.85, 6.0], cashier: 'cashier2', opensAt: 3 }],
      slot: (i) => [5.5 + i * 0.62, 7.4],
      snack: [{ at: [6.6, 5.05], clerk: 'clerk1' }, { at: [8.2, 5.05], clerk: 'clerk2' }, { at: [9.8, 5.05], clerk: 'clerk3' }],
      staff: { cashier: [3.45, 7.4], cashier2: [3.45, 6.0], clerk1: [6.6, 3.75], clerk2: [8.2, 3.75], clerk3: [9.8, 3.75], usher: [5.3, 3.8] },
      toSnack: [[5.8, 5.7]],
      fromSnack: [[5.4, 5.2]],
      toGate: [[5.2, 5.4]],
      gateIn: [4.5, 4.6],
      // holding spots while the usher checks the one in front: two side by side on the free floor between the
      // podium and the box office, then by the end of the snack counter (clear of window 2, the usher and the
      // snack lines; every spot has a straight clear path to the gate)
      gateSlots: [[4.9, 4.6], [4.55, 4.95], [5.6, 5.0], [5.9, 5.45]],
      // the lobby bench (footprint u 11.2-12.6, v 6-6.4): its seat faces the street, reached round the arcade
      bench: { route: [[11.0, 7.0]], seat: [11.9, 6.66] },
    },
  };
  // pass 10: three screens on the right, restroom on the left, red-rope queue lane entered at its far end
  // Everyone lines up now, so the line snakes: 7 in the lane, then a second row back along the free floor between
  // the ropes and the glass front (v 8.25), whose head steps in at the lane's open end as places free up.
  LAYOUTS[3] = { ...LAYOUTS[2], queueEntry: [9.3, 7.4], lane: [5.2, 7.15, 9.25, 7.65], qmax: 14,
    slot: (i) => (i < 7 ? [5.47 + i * 0.62, 7.4] : [9.0 - (i - 7) * 0.62, 8.25]) };
  let L = LAYOUTS[1];
  let windows = [];
  let snackSpots = [];
  function useLayout(n) {
    L = LAYOUTS[n] || LAYOUTS[1];
    windows = L.windows.map((w) => ({ ...w, cur: null, t: 0 }));
    snackSpots = L.snack.map((s) => ({ ...s, line: [], t: 0 }));
  }
  useLayout(1);
  const CAP = 40;
  const HARD_CAP = 55;
  const JAYWALK = 0.06;   // share of arrivals on foot who walk along the road (and may get run over)

  // ---------- drawing helpers (ctx in stage px) ----------
  function poly(ctx, pts, fill, stroke, lw = 1.5) {
    ctx.beginPath();
    pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  }
  const quad = (ctx, u0, v0, u1, v1, fill, z = 0, stroke) => poly(ctx, [P(u0, v0, z), P(u1, v0, z), P(u1, v1, z), P(u0, v1, z)], fill, stroke);
  const faceU = (ctx, v, u0, u1, z0, z1, fill, stroke) => poly(ctx, [P(u0, v, z0), P(u1, v, z0), P(u1, v, z1), P(u0, v, z1)], fill, stroke);
  const faceV = (ctx, u, v0, v1, z0, z1, fill, stroke) => poly(ctx, [P(u, v0, z0), P(u, v1, z0), P(u, v1, z1), P(u, v0, z1)], fill, stroke);
  function box(ctx, u0, v0, u1, v1, z0, z1, top, front, side, stroke) {
    faceU(ctx, v1, u0, u1, z0, z1, front, stroke);
    faceV(ctx, u1, v0, v1, z0, z1, side, stroke);
    quad(ctx, u0, v0, u1, v1, top, z1, stroke);
  }
  const line = (ctx, a, b, color, w = 2) => {
    ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke();
  };
  function glow(ctx, x, y, r, color) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  function rng(seed) {
    return () => {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- static background ----------
  const bg = $('bg');
  let scale = 1;
  // the zoom director magnifies the world up to ZOOM x, so the art resolution is chosen with that headroom
  const ZOOM = clamp(Number(q.get('zoom')) || 1.85, 1.2, 3);
  // ?fit=cover: a squarer OBS source (owner, 05 Nov) is filled to its height and the sides are cropped; the wide
  // shot then centres on the lobby (stage x WIDE_X) as far as the art reaches
  const FIT_COVER = q.get('fit') === 'cover';
  const WIDE_X = clamp(Number(q.get('fitx')) || (FIT_COVER ? 1040 : 960), 0, 1920);
  const view = () => SB.view;   // the part of the stage on screen [x0, y0, x1, y1]
  const DIRECTOR_ON = q.get('director') !== '0';
  // ?maxres=<px height> (off by default): never pick art sharper than this output height needs, zoom included
  // (maxres=1080: the 1080p art and light loop even at 1440p and in zoom-ins; less memory and video decode, softer zooms)
  const MAXK = q.has('maxres') ? clamp((Number(q.get('maxres')) || 1080) / 1080, 0.5, 4) : Infinity;
  const dpr = () => Math.min(MAXK, scale * (devicePixelRatio || 1) * (DIRECTOR_ON ? ZOOM : 1));

  function drawSky(ctx) {
    const g = ctx.createLinearGradient(0, 0, 0, 760);
    g.addColorStop(0, '#120e2a'); g.addColorStop(0.6, '#2a1c4a'); g.addColorStop(1, '#3a2050');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 1920, 1080);
    const r = rng(7);
    for (let i = 0; i < 70; i++) { ctx.fillStyle = `rgba(255,255,255,${0.2 + r() * 0.5})`; ctx.fillRect(r() * 1920, r() * 300, 1.5, 1.5); }
    // skyline
    let x = -20;
    while (x < 1300) {
      const w = 60 + r() * 120;
      const top = 120 + r() * 230;
      ctx.fillStyle = r() < 0.5 ? '#171329' : '#1c1733';
      ctx.fillRect(x, top, w, 900);
      for (let wy = top + 14; wy < 640; wy += 22) {
        for (let wx = x + 10; wx < x + w - 12; wx += 18) {
          if (r() < 0.16) { ctx.fillStyle = r() < 0.7 ? 'rgba(255,214,140,.55)' : 'rgba(140,220,255,.5)'; ctx.fillRect(wx, wy, 8, 11); }
        }
      }
      x += w + 6 + r() * 20;
    }
    // the tower behind the cinema, carrying the video billboard
    const tg = ctx.createLinearGradient(1250, 0, 1920, 0);
    tg.addColorStop(0, '#1d1834'); tg.addColorStop(1, '#141026');
    ctx.fillStyle = tg; ctx.fillRect(1250, 0, 670, 1080);
    for (let wy = 420; wy < 1080; wy += 26) {
      for (let wx = 1270; wx < 1910; wx += 22) {
        if (r() < 0.12) { ctx.fillStyle = 'rgba(255,214,140,.4)'; ctx.fillRect(wx, wy, 9, 12); }
      }
    }
    // billboard frame (the green rect itself is a DOM element on top)
    ctx.fillStyle = '#0a0812'; ctx.fillRect(1280, 26, 608, 356);
    ctx.strokeStyle = '#ff5fb0'; ctx.lineWidth = 3; ctx.shadowColor = '#ff2a95'; ctx.shadowBlur = 14;
    ctx.strokeRect(1284, 30, 600, 348);
    ctx.strokeStyle = '#7ff7f0'; ctx.shadowColor = '#19e6dc'; ctx.strokeRect(1290, 36, 588, 336);
    ctx.shadowBlur = 0;
  }

  function drawStreet(ctx) {
    // asphalt, wet
    quad(ctx, -9, 10.6, 19, 13.5, '#1b1d26');
    const r = rng(11);
    for (let i = 0; i < 26; i++) {
      const u = -6 + r() * 22;
      const v = 10.9 + r() * 2.2;
      const [x, y] = P(u, v);
      ctx.save(); ctx.translate(x, y); ctx.scale(1, 0.5);
      glow(ctx, 0, 0, 30 + r() * 40, 'rgba(120,160,255,.10)');
      ctx.restore();
    }
    for (let u = -8; u < 19; u += 1.4) quad(ctx, u, 11.95, u + 0.7, 12.05, 'rgba(240,220,140,.55)');
    // curb + sidewalk
    quad(ctx, -9, 10.5, 19, 10.62, '#6c6f7c');
    quad(ctx, -9, 9.15, 19, 10.5, '#3f414d');
    for (let u = -9; u < 19; u += 1) line(ctx, P(u, 9.15), P(u, 10.5), 'rgba(0,0,0,.25)', 1);
    line(ctx, P(-9, 9.82), P(19, 9.82), 'rgba(0,0,0,.18)', 1);
    // neon spill from the lobby onto the wet sidewalk
    for (const u of [5, 9.5, 12]) {
      const [x, y] = P(u, 9.9);
      ctx.save(); ctx.translate(x, y); ctx.scale(1, 0.45);
      glow(ctx, 0, 0, 120, 'rgba(255,95,176,.16)');
      ctx.restore();
    }
  }

  function drawBuilding(ctx) {
    // floor slab edge (front)
    poly(ctx, [P(0, 9), P(13, 9), P(13, 9, -10), P(0, 9, -10)], '#0d0b16');
    poly(ctx, [P(13, 0), P(13, 9), P(13, 9, -10), P(13, 0, -10)], '#120f1e');
    // corridors: navy carpet
    quad(ctx, 0, 0, 3, 9, '#262c4c');
    quad(ctx, 3, 0, 13, 3, '#262c4c');
    line(ctx, P(1.4, 1.4), P(1.4, 9), 'rgba(127,247,240,.10)', 14);
    line(ctx, P(1.4, 1.4), P(13, 1.4), 'rgba(127,247,240,.10)', 14);
    // lobby: purple confetti carpet
    quad(ctx, 3, 3, 13, 9, '#3b2452');
    const r = rng(3);
    const cols = ['#ff5fb0', '#7ff7f0', '#ffd75a', '#9b7bff'];
    for (let i = 0; i < 520; i++) {
      const u = 3.1 + r() * 9.8;
      const v = 3.1 + r() * 5.8;
      const [x, y] = P(u, v);
      ctx.fillStyle = cols[i % 4];
      ctx.globalAlpha = 0.35;
      if (i % 3 === 0) { ctx.fillRect(x - 3, y - 1, 6, 2); } else if (i % 3 === 1) { ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 7); ctx.fill(); } else { ctx.fillRect(x - 1, y - 3, 2, 6); }
    }
    ctx.globalAlpha = 1;

    const wl = ctx.createLinearGradient(0, 130, 0, 640);
    wl.addColorStop(0, '#2c1d47'); wl.addColorStop(1, '#3d2860');
    faceV(ctx, 0, 0, 9, 0, WALL, wl);
    const wr = ctx.createLinearGradient(0, 180, 0, 740);
    wr.addColorStop(0, '#35225a'); wr.addColorStop(1, '#4a3070');
    faceU(ctx, 0, 0, 13, 0, WALL, wr);
    // wainscot + neon stripes
    faceV(ctx, 0, 0, 9, 0, 44, '#1a1228');
    faceU(ctx, 0, 0, 13, 0, 44, '#1d142e');
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#ff2a95'; line(ctx, P(0, 9, 150), P(0, 0, 150), '#ff7cc0', 3); line(ctx, P(0, 0, 150), P(13, 0, 150), '#ff7cc0', 3);
    ctx.shadowColor = '#19e6dc'; line(ctx, P(0, 9, 46), P(0, 0, 46), '#7ff7f0', 2); line(ctx, P(0, 0, 46), P(13, 0, 46), '#7ff7f0', 2);
    ctx.shadowBlur = 0;
    // wall tops
    poly(ctx, [P(0, 9, WALL), P(0, 0, WALL), P(-0.25, -0.25, WALL), P(-0.25, 9, WALL)], '#140f22');
    poly(ctx, [P(0, 0, WALL), P(13, 0, WALL), P(13, -0.25, WALL), P(-0.25, -0.25, WALL)], '#140f22');
    // screen doors
    DOORS.forEach((d) => drawDoor(ctx, d.wall, d.at));
    // WC door
    faceV(ctx, 0, WC_V - 0.4, WC_V + 0.4, 0, 104, '#5d6a8c', 'rgba(0,0,0,.5)');
    faceV(ctx, 0, WC_V - 0.32, WC_V + 0.32, 0, 98, '#7584a8');
    const [kx, ky] = P(0, WC_V - 0.2, 50);
    ctx.fillStyle = '#d8deea'; ctx.fillRect(kx - 2, ky - 2, 4, 4);
  }

  function drawDoor(ctx, wall, at) {
    const f = wall === 'u' ? (a, b, z0, z1, fill, s) => faceV(ctx, 0, a, b, z0, z1, fill, s) : (a, b, z0, z1, fill, s) => faceU(ctx, 0, a, b, z0, z1, fill, s);
    const pt = wall === 'u' ? (o, z) => P(0, at + o, z) : (o, z) => P(at + o, 0, z);
    f(at - 0.55, at + 0.55, 0, 114, '#8b9099', 'rgba(0,0,0,.6)');
    f(at - 0.47, at - 0.01, 0, 108, '#7a1c2c', 'rgba(0,0,0,.5)');
    f(at + 0.01, at + 0.47, 0, 108, '#7a1c2c', 'rgba(0,0,0,.5)');
    // padded diamond stitching + portholes
    for (const s of [-1, 1]) {
      const [x, y] = pt(s * 0.24, 78);
      ctx.beginPath(); ctx.ellipse(x, y, 8, 9, 0, 0, 7); ctx.fillStyle = '#ffd98a'; ctx.fill();
      ctx.strokeStyle = '#c0c4cc'; ctx.lineWidth = 2; ctx.stroke();
      glow(ctx, x, y, 22, 'rgba(255,200,120,.25)');
      const [hx, hy] = pt(s * 0.06, 50);
      ctx.fillStyle = '#d6d9e0'; ctx.fillRect(hx - 1.5, hy - 8, 3, 16);
    }
    // light leaking under the door
    const [lx, ly] = pt(0, 0);
    ctx.save(); ctx.translate(lx, ly + 4); ctx.scale(1, 0.35); glow(ctx, 0, 0, 60, 'rgba(255,190,120,.30)'); ctx.restore();
  }

  function redrawBg() {
    const k = dpr();
    bg.width = Math.round(1920 * k);
    bg.height = Math.round(1080 * k);
    bg.style.width = '1920px';
    bg.style.height = '1080px';
    const ctx = bg.getContext('2d');
    ctx.setTransform(k, 0, 0, k, 0, 0);
    drawSky(ctx);
    drawStreet(ctx);
    drawBuilding(ctx);
  }

  // ---------- props: depth-sorted pieces of scenery that walkers can pass behind ----------
  // Each prop paints its whole art; it is cut into <= 1x1 tile chunks, each its own canvas clipped
  // to its chunk and z-sorted on its own, so walkers sort correctly against long props.
  const world = $('world');
  const props = [];
  function addProp(u0, v0, u1, v1, hgt, paint) {
    const nu = Math.max(1, Math.ceil((u1 - u0) - 0.01));
    const nv = Math.max(1, Math.ceil((v1 - v0) - 0.01));
    for (let i = 0; i < nu; i++) {
      for (let j = 0; j < nv; j++) {
        const a = u0 + ((u1 - u0) * i) / nu;
        const b = u0 + ((u1 - u0) * (i + 1)) / nu;
        const c = v0 + ((v1 - v0) * j) / nv;
        const d = v0 + ((v1 - v0) * (j + 1)) / nv;
        const hull = [P(a, c, hgt), P(b, c, hgt), P(b, c, 0), P(b, d, 0), P(a, d, 0), P(a, d, hgt)];
        const cx = hull.reduce((s, p) => s + p[0], 0) / 6;
        const cy = hull.reduce((s, p) => s + p[1], 0) / 6;
        const grown = hull.map(([x, y]) => { const l = Math.hypot(x - cx, y - cy) || 1; return [x + ((x - cx) / l) * 0.8, y + ((y - cy) / l) * 0.8]; });
        const xs = grown.map((p) => p[0]);
        const ys = grown.map((p) => p[1]);
        const bx = Math.floor(Math.min(...xs)) - 1;
        const by = Math.floor(Math.min(...ys)) - 1;
        const bw = Math.ceil(Math.max(...xs)) + 1 - bx;
        const bh = Math.ceil(Math.max(...ys)) + 1 - by;
        const cv = h('canvas', 'prop');
        Object.assign(cv.style, { left: `${bx}px`, top: `${by}px`, width: `${bw}px`, height: `${bh}px`, zIndex: String(depth((a + b) / 2, (c + d) / 2)) });
        world.append(cv);
        props.push({ cv, hull: grown, bx, by, bw, bh, paint });
      }
    }
  }
  function redrawProps() {
    const k = dpr();
    for (const p of props) {
      p.cv.width = Math.max(1, Math.round(p.bw * k));
      p.cv.height = Math.max(1, Math.round(p.bh * k));
      const ctx = p.cv.getContext('2d');
      ctx.setTransform(k, 0, 0, k, -p.bx * k, -p.by * k);
      ctx.save();
      poly(ctx, p.hull);
      ctx.clip();
      p.paint(ctx);
      ctx.restore();
    }
  }

  function buildProps() {
    // partition between lobby and corridors (cut down low), opening at the back corner
    const part = (ctx, u0, v0, u1, v1) => box(ctx, u0, v0, u1, v1, 0, LOW, '#ff7cc0', '#2a1c40', '#24183a');

    addProp(4.4, 2.9, 13, 3.1, LOW, (ctx) => part(ctx, 4.4, 2.9, 13, 3.1));

    addProp(4, 7, 7, 7.8, 84, (ctx) => {

    });

    // arcade cabinet
    addProp(12.0, 7.5, 12.7, 8.2, 82, (ctx) => {

    // cardboard standees
    const standee = (u, v, a, b2) => addProp(u, v, u + 0.42, v + 0.06, 92, (ctx) => {

    standee(6.0, 6.3, '#1a1030', '#4ae0d8');
    // bus stop shelter on the sidewalk
    addProp(0.4, 9.3, 2.0, 9.55, 86, (ctx) => {

      box(ctx, 0.35, 9.25, 2.05, 9.6, 80, 86, '#4a5a7a', '#2c3850', '#36445f');

      const [x, y] = P(1.2, 9.6, 90); ctx.fillText('BUS 95', x, y);
    });
    // street lamp
    addProp(5.0, 10.3, 5.15, 10.45, 190, (ctx) => {
      line(ctx, P(5.07, 10.37, 0), P(5.07, 10.37, 180), '#2a2d36', 5);

    }
  }
  SB.on('emotes', placeStaff);

  function screenOf(w) { return P(w.u, w.v); }

  const recentFloats = [];   // [x, y, time] - floats close together stack upwards instead of overlapping
  function floatText(x, y, text, color) {
    const now = performance.now();
    while (recentFloats.length && now - recentFloats[0][2] > 1500) recentFloats.shift();   // = animation length
    for (const [fx0, fy0] of recentFloats) if (Math.abs(fx0 - x) < 90 && Math.abs(fy0 - y) < 18) y = fy0 - 20;
    recentFloats.push([x, y, now]);
    const el = h('div', 'fl', text);
    if (color) el.style.color = color;
    fx.append(el);
    el.animate([
      { transform: `translate(${x}px, ${y}px) translate(-50%, 0)`, opacity: 0 },
      { transform: `translate(${x}px, ${y - 10}px) translate(-50%, 0)`, opacity: 1, offset: 0.15 },
      { transform: `translate(${x}px, ${y - 38}px) translate(-50%, 0)`, opacity: 0 },
    ], { duration: 1500, easing: 'ease-out' }).onfinish = () => el.remove();
  }
  const floatAt = (w, text, color) => { const [x, y] = screenOf(w); floatText(x, y - EH - 26, text, color); };

  function flyTicket(from, to, torn) {
    const el = itemEl(torn ? 'stub' : 'ticket', torn ? 'ticket torn' : 'ticket');
    const it = ITEMS?.[el.dataset.item];
    if (it) { el.style.position = 'absolute'; el.style.left = `${-it.anchor[0]}px`; el.style.top = `${-it.anchor[1]}px`; }
    fx.append(el);
    const [x0, y0] = P(from.u, from.v, EH * 0.6);
    const [x1, y1] = P(to.u, to.v, EH * 0.5);
    el.animate([
      { transform: `translate(${x0}px, ${y0}px) rotate(0deg)` },
      { transform: `translate(${(x0 + x1) / 2}px, ${Math.min(y0, y1) - 40}px) rotate(200deg)`, offset: 0.5 },
      { transform: `translate(${x1}px, ${y1}px) rotate(380deg)`, opacity: 0.2 },
    ], { duration: 650, easing: 'ease-in-out' }).onfinish = () => el.remove();
  }

  // carried things and staff caps: pre-rendered item sprites when the art has them, CSS shapes otherwise
  let ITEMS = null;
  const ATTACH = {   // attach point relative to the walker's feet, from the emote's width
    carry: (ew) => [ew / 2 - 2, -4],
    stub: (ew) => [-ew / 2 + 1, -14],
    cap: (ew, eh) => [0, -eh + 6],   // sits on the emote's actual top (wide emotes are shorter)
  };
  const HELD = { carry: 2, stub: 2 };   // sodas, popcorn and ticket stubs in a chatter's hand: twice the sprite size (owner, 05 Nov)
  function itemEl(name, fallbackCls, scale = 1) {
    const it = ITEMS?.[name];
    if (!it?.file || !Array.isArray(it.anchor)) {
      const d = h('div', fallbackCls);
      if (scale !== 1) { d.style.transform = `scale(${scale})`; d.style.transformOrigin = '50% 100%'; }
      return d;
    }
    const im = h('img', 'item');
    im.alt = '';
    im.dataset.item = name;
    setImg(im, it.file, it.file_2x, dpr() * scale > 1.3, () => { im.style.display = 'none'; });
    im.style.width = `${it.w * scale}px`;
    im.style.height = `${it.h * scale}px`;
    return im;
  }
  function placeItem(w, el, slot) {
    const ew = Number(w.em?.dataset.w || 40);
    const eh = parseFloat(w.em?.style.height) || EH;
    const it = ITEMS?.[el.dataset.item];
    const s = HELD[slot] || 1;
    if (it) {
      const [px, py] = ATTACH[slot](ew, eh);
      el.style.left = `${px - it.anchor[0] * s}px`;
      el.style.top = `${py - it.anchor[1] * s}px`;
    } else if (slot === 'carry') el.style.left = `${ew / 2 - 8}px`;
    else if (slot === 'stub') el.style.left = `${-ew / 2 - 6}px`;
  }
  function giveCarry(w) {
    if (w.carry) return;
    w.carry = itemEl(Math.random() < 0.3 ? 'soda' : 'popcorn', 'carry', HELD.carry);
    w.bod.append(w.carry);
    placeItem(w, w.carry, 'carry');
  }

  const onScreen = (w) => {
    const [x, y] = toScreen(w.x, w.y);
    const [x0, y0, x1, y1] = view();
    return w.alpha > 0.6 && x > x0 + 20 && x < x1 - 20 && y > y0 && y < y1 - 5;
  };
  // speech of someone not visible yet (still off screen, in the restroom) waits, so it can't push a
  // readable bubble out of the allowance (MAX_BUB on screen, ?bubbles=N; the oldest fades out for a new one)
  const MAX_BUB = clamp(Number(q.get('bubbles')) || 8, 2, 14);
  function fadeOut(el) {
    const a = el.animate([{ opacity: el.style.opacity || 1 }, { opacity: 0 }], { duration: 280, easing: 'ease-out' });
    a.onfinish = () => el.remove();
  }
  function say(w, tokens) {
    if (!tokens?.length) return;
    if (!onScreen(w)) { w.pending = tokens; return; }
    w.pending = null;
    dropBubble(w);
    const b = h('div', 'bub');
    // the speaker's name heads the bubble (their floor label hides while they talk)
    const who = b.appendChild(h('div', 'bn', w.nick));
    who.style.color = w.nm.style.color;
    if (w.nm.querySelector('.rbt')) { who.textContent = ''; who.append(h('span', 'rbt', w.nick)); }
    SB.renderTokens(b.appendChild(h('div', 'bt')), tokens, 24, 64);
    if (BUB_STYLE) b.style.setProperty('--nc', w.nm.querySelector('.rbt') ? '#ff5fd2' : (w.nm.style.color || '#9fd0ff'));
    bubLayer.append(b);
    w.bub = b;
    w.bubW = 0;      // measured on its first placement
    w.bubH = 0;
    w.bubTail = null;
    w.bubT = 5.5;
    w.bubAge = 0;          // fades in over its first 0.25 s
    w.bubShown = false;    // first placement snaps; later moves glide (layoutBubbles)
    bubOrder.push(w);
    while (bubOrder.length > MAX_BUB) dropBubble(bubOrder[0]);
  }
  function dropBubble(w) {
    if (!w.bub) return;
    fadeOut(w.bub); w.bub = null;
    const i = bubOrder.indexOf(w);
    if (i >= 0) bubOrder.splice(i, 1);
  }

  // --- routes ---
  function doorSteps(w) {
    // the destination is locked (at the usher at the latest): later messages can't change door or count
    lockDoor(w);
    const d = DOORS[w.doorRoom];
    const steps = [];
    if (d.wall === 'u') steps.push({ to: [J[0], d.at] }, { to: [0.55, d.at] }, { call: startEnter }, { to: [0.1, d.at], slow: true }, { alpha: 0 }, { call: finishEnter });
    else steps.push({ to: J }, { to: [d.at, J[1]] }, { to: [d.at, 0.55] }, { call: startEnter }, { to: [d.at, 0.1], slow: true }, { alpha: 0 }, { call: finishEnter });
    return steps;
  }
  function startEnter(w) { w.entering = true; w.alphaT = 0; dropBubble(w); playDoor(w.doorRoom + 1); }
  function finishEnter(w) {
    const s = signs[w.doorRoom];
    if (s) {
      s.count++;
      s.pulse = 1;
      signMeta(s);
    }
    doorGlow(w.doorRoom);
    chaseUntil[w.doorRoom + 1] = performance.now() + 4000;   // the poster's bulbs chase as they go in
    removeWalker(w);
  }

  // --- snack bar: each register serves its own short line (max 3), head first ---
  const SNACK_MAX = 3;
  function shortestSnack() {
    const min = Math.min(...snackSpots.map((s) => s.line.length));
    if (min >= SNACK_MAX) return null;
    const free = snackSpots.filter((s) => s.line.length === min);
    return free[Math.floor(Math.random() * free.length)];
  }
  // the place in line is reserved when the register is chosen; the slot is walked to on arrival
  function reserveSnack(w, spot) { spot.line.push(w); w.snack = spot; w.approaching = true; w.si = -1; }
  function joinSnack(w) { w.approaching = false; w.si = -1; w.plan = []; }
  function leaveSnack(w) {
    if (!w.snack) return;
    w.snack.line = w.snack.line.filter((x) => x !== w);
    w.snack = null;
    w.approaching = false;
    w.plan = w.afterSnack || [];
    w.afterSnack = null;
  }
  function serveSnacks(dt) {
    for (const s of snackSpots) {
      s.line = s.line.filter((w) => !w.gone);
      s.line.forEach((w, i) => {
        if (!w.approaching && w.si !== i) { w.si = i; w.plan = [{ to: [s.at[0] + (i ? (i % 2 ? 0.18 : -0.18) : 0), s.at[1] + 0.6 * i] }]; }
      });
      const head = s.line[0];
      if (!head || head.approaching || head.plan.length) { s.t = 0; continue; }
      if (!s.t) bounceStaff(s.clerk);
      s.t += dt;
      if (s.t < 2.2) continue;
      s.t = 0;
      leaveSnack(head);
      giveCarry(head);
      floatAt(head, '+1 POPCORN', '#ffd75a');
    }
  }

  function afterTicket(w) {
    // past the usher: maybe a chat in the corridor first, then the restroom, then their door
    const past = [{ to: GATE_OUT }, { to: J }, { call: hangHall }];
    if (w.detour === 'bathroom') past.push(...(RESTROOM ? [{ call: tryRestroom }] : [{ to: [J[0], WC_V - 0.8] }, { call: tryWC }]));
    past.push({ call: (x) => { x.plan.unshift(...doorSteps(x)); } });
    let rest;
    if (L.gateSlots) {
      // a line at the gate: the usher checks one at a time, the others hold at spaced spots (serveGate)
      rest = [{ call: hangOut }, { call: (x) => { x.afterGate = past; joinGate(x); } }];
    } else {
      // small personal offsets at the gate so a group doesn't stack on one spot
      const jg = () => rand(-0.22, 0.22);
      rest = [{ call: hangOut }, { to: [L.gateIn[0] + jg(), L.gateIn[1] + jg()] }, { to: [G[0] + jg(), G[1] + jg()] },
        // the usher tears the stub and points them to their wing
        { wait: w.hurry ? 0.2 : 0.7, start: () => { bounceStaff('usher'); takeStub(w); usherPoints(w); } },
        ...past];
    }
    const spot = w.detour === 'popcorn' && !w.hurry ? shortestSnack() : null;
    if (spot) {
      reserveSnack(w, spot);
      w.afterSnack = [...L.fromSnack.map((to) => ({ to })), ...rest];
      w.plan = [...L.toSnack.map((to) => ({ to })), { call: joinSnack }];
      return;
    }
    let pre;
    if (w.detour === 'arcade' && !arcadeBusy && !w.hurry) {
      // a quick round on the cabinet before the film, routed behind the cabinet with clearance
      arcadeBusy = w;
      // (with the rope lane: out past its west end and along below the back rope)
      const there = L.lane ? [[5.2, 6.6], [8.2, 6.6], [12.95, 7.0]] : [[8.2, 7.0], [12.95, 7.0]];
      pre = [...there.map((to) => ({ to })), { to: ARCADE },
        { wait: rand(3, 6), end: () => {
          if (arcadeBusy === w) arcadeBusy = null;
          arcadeFlash();
          const r = Math.random();
          // a new high score stays on the cabinet's screen for a moment (when the art has that screen)
          if (r < 0.15) { floatAt(w, '★ NEW HIGH SCORE ★', '#9fd8ff'); arcadeHiUntil = performance.now() + 3500; } else if (r < 0.5) floatAt(w, 'GAME OVER', '#9fd8ff');
        } },
        { to: [12.95, 7.0] }, { to: [8.0, 6.6] }];
    } else {
      pre = L.toGate.map((to) => ({ to }));
    }
    w.plan = [...pre, ...rest];
  }

  // usher gate: the head of the line steps up, gets the stub torn and a point to their wing, then goes on
  const gateLine = [];
  let gateT = 0;
  function joinGate(w) { gateLine.push(w); w.gi = -1; w.plan = []; }
  function serveGate(dt) {
    for (let i = gateLine.length - 1; i >= 0; i--) if (gateLine[i].gone) gateLine.splice(i, 1);
    const slots = L.gateSlots || [];
    gateLine.forEach((w, i) => {
      if (w.gi === i || w.removing) return;
      if (i > slots.length) return;   // all holding spots taken: wait where they are (inside the lobby) for one
      // the gate from the east goes round the usher's podium, not through it
      const via = i === 0 && w.gi === -1 && L.gateIn && w.u > L.gateIn[0] + 0.3 ? [{ to: L.gateIn }] : [];
      w.gi = i;
      w.plan = [...via, { to: i === 0 ? G : slots[i - 1] }];
    });
    const head = gateLine[0];
    if (!head || head.plan.length || head.removing) { gateT = 0; return; }
    if (!gateT) { bounceStaff('usher'); takeStub(head); usherPoints(head); }
    gateT += dt;
    if (gateT < (head.hurry ? 0.2 : 0.7)) return;
    gateT = 0;
    gateLine.shift();
    head.gi = -1;
    head.plan = head.afterGate || [{ to: GATE_OUT }, { to: J }, { call: (x) => { x.plan.unshift(...doorSteps(x)); } }];
    head.afterGate = null;
  }

  // restroom: one inside, at most one waiting beside the door; anyone else holds it for later
  let wcWait = null;
  function tryWC(w) {
    if (wcWait?.gone) wcWait = null;
    if (!wcBusy && (!wcWait || wcWait === w)) {
      if (wcWait === w) wcWait = null;
      wcBusy = w;
      w.plan.unshift(
        { to: [0.55, WC_V] },
        { call: () => { w.alphaT = 0; setWC(true); dropBubble(w); playDoor('wc'); } }, { alpha: 0 },
        { wait: rand(2.5, 5) },
        { call: () => { w.alphaT = 1; setWC(false); playDoor('wc'); floatAt(w, 'much better', '#9fd8ff'); } }, { alpha: 1 },
        { to: [J[0], WC_V - 0.6] },
        { call: () => { if (wcBusy === w) wcBusy = null; } },   // next one goes in once the doorway is clear
      );
    } else if ((!wcWait || wcWait === w) && (w.wcTries = (w.wcTries || 0) + 1) < 20) {
      wcWait = w;
      w.plan.unshift({ to: [J[0] + 0.45, WC_V - 1.25] }, { wait: 0.5 }, { call: tryWC });
    } else if (wcWait === w) {
      wcWait = null;
    }
  }
  function setWC(busy) {
    wcSign.classList.toggle('busy', busy);
    if (wcLights) { wcLights.vacant.style.opacity = busy ? '0' : ''; wcLights.occupied.style.opacity = busy ? '' : '0'; }
    wcSign.textContent = `${wcLabel}${busy ? 'OCCUPIED' : 'VACANT'}`;
  }

  // now and then someone waits on the bench for a friend: the next person to come in, or 16 s at most
  let benchBusy = null;
  function tryBench(w) {
    if (benchBusy?.gone) benchBusy = null;
    if (benchBusy && benchBusy !== w && benchBusy.seated && !benchBusy.friend) benchBusy.friend = w;   // here they are
    if (!L.bench || benchBusy || w.hurry || w.benched || queue.length > 3 || Math.random() >= 0.1) return false;
    benchBusy = w;
    w.benched = true;
    const t0 = performance.now();
    w.plan = [...L.bench.route.map((to) => ({ to })), { to: L.bench.seat }, { call: () => { w.seated = true; } },
      { until: () => !!w.friend || w.hurry || performance.now() - t0 > 16000 },
      { call: () => {
        if (w.friend && !w.friend.gone) floatAt(w, 'there you are!', '#ffe08a');
        if (benchBusy === w) benchBusy = null;
        w.seated = false;
      } },
      { wait: 0.4 }, ...L.bench.route.map((to) => ({ to })), { call: joinQueue }];
    return true;
  }

  function joinQueue(w) {
    if (tryBench(w)) return;
    // everyone lines up for a ticket (owner, 05 Nov); only at a full house (CAP) or a line past its last row do they
    // come with one already
    if (queue.length >= (L.qmax || QMAX) || w.hurry || liveCount() >= CAP) {
      giveStub(w);   // already has a ticket: the stub in hand says it, no announcement
      afterTicket(w);
      return;
    }
    queue.push(w);
    w.inQueue = true;
    w.qi = -1;
    w.plan = [];
    w.qT = 0;
    w.quitAt = !w.hurry && Math.random() < QUIT_P ? rand(2.5, 7) : null;   // some lose patience (giveUp)
  }

  // Changed their mind: out of the line (by the rope lane's open end), back out into the rain, wait at the bus stop
  // and go home on the next bus (which waits for them at the door). No bus coming soon: one is called earlier.
  const QUIT_P = clamp(Number(q.get('quit')) || 0.06, 0, 1);   // ?quit=1: everyone in line gives up (testing)
  const QUIT_LINES = ['nah, going home', 'changed my mind', 'not worth it', 'this line tho', 'I\'m out'];
  function giveUp(w) {
    const inLane = !outsideLane(w);
    leaveQueue(w);
    w.quitting = true;
    floatAt(w, QUIT_LINES[Math.floor(Math.random() * QUIT_LINES.length)], '#ffb0b0');
    const door = STOPS.bus.door_ground;
    w.plan = [...(inLane ? [{ to: L.queueEntry }] : []), { to: [9.5 + rand(-0.4, 0.4), 8.6] }, { to: [9.5 + rand(-0.3, 0.3), 9.6] },
      { to: [door[0] + rand(-0.25, 0.25), rand(9.85, 10.1)] }, { call: waitBus }];
  }
  function waitBus(w) {
    // art without a bus: they walk off along the sidewalk instead of waiting at the shelter for good
    if (!VEH?.bus?.['+u']) { w.plan = [{ to: [-7, w.v] }, { call: (x) => { x.alphaT = 0; dropBubble(x); } }, { alpha: 0 }, { call: removeWalker }]; return; }
    if (!activeBus()) nextBus = Math.min(nextBus, performance.now() + rand(6000, 14000));
    w.waitingBus = true;   // the bus waits for them (stepTraffic): they only board the frame after the last rider is off
    w.plan = [{ until: () => { const b = activeBus(); return !!b && b.state === 'stopped' && !b.riders.size; } }, { call: boardBus }];
  }
  function boardBus(w) {
    const bus = activeBus();
    if (!bus || bus.state !== 'stopped') { waitBus(w); return; }
    w.waitingBus = false;
    (bus.boarders ||= new Set()).add(w);
    const door = STOPS.bus.door_ground;
    w.plan = [{ to: door }, { to: STOPS.bus.boarding_point || [door[0], door[1] + 0.15] },   // curb, then in at the door
      { call: () => { w.alphaT = 0; dropBubble(w); if (Math.random() < 0.5) floatAt(w, 'bye 👋', '#ffe08a'); } }, { alpha: 0 },
      { call: (x) => { bus.boarders.delete(x); removeWalker(x); } }];
  }
  function leaveQueue(w) {
    const i = queue.indexOf(w);
    if (i >= 0) queue.splice(i, 1);
    w.inQueue = false;
    w.qi = -1;
  }
  // with the rope lane, anyone not in it yet walks in at its open far end
  const outsideLane = (w) => !!L.lane && !(w.u > L.lane[0] && w.u < L.lane[2] && w.v > L.lane[1] && w.v < L.lane[3]);
  // Ticket windows take the head of the line; a second window opens while the line is long.
  function serveQueue(dt) {
    // someone losing patience leaves the line (anyone still in it: being called takes them out of the queue)
    for (const w of [...queue]) {
      w.qT = (w.qT || 0) + dt;
      if (w.quitAt != null && w.qT > w.quitAt) giveUp(w);
    }
    queue.forEach((w, i) => {
      if (w.qi === i) return;
      w.qi = i;
      // with the rope lane, anyone not in it yet walks in at its open far end
      w.plan = outsideLane(w) ? [{ to: L.queueEntry }, { to: L.slot(i) }] : [{ to: L.slot(i) }];
    });
    const waiting = queue.length;   // window 2 opens on the line length before anyone is called this frame
    for (const win of windows) {
      if (win.cur?.gone) win.cur = null;
      if (!win.cur) {
        if (!queue.length || (win.opensAt && waiting < win.opensAt)) continue;
        const next = queue[0];
        leaveQueue(next);
        // someone called before reaching the rope lane still walks it, never across the ropes
        next.plan = outsideLane(next) ? [{ to: L.queueEntry }, { to: L.slot(0) }, { to: win.at }] : [{ to: win.at }];
        win.cur = next;
        win.t = 0;
        if (win.opensAt) bounceStaff(win.cashier);   // the second cashier waves them over
        continue;
      }
      if (win.cur.plan.length) continue;
      win.t += dt;
      if (win.t < Math.max(0.8, 2.6 - 0.3 * queue.length)) continue;
      const w = win.cur;
      win.cur = null;
      const cashier = staff[win.cashier];
      if (cashier) { flyTicket(cashier, w); cashier.bounce = 1; }
      giveStub(w);
      afterTicket(w);
    }
  }
  // staff talk with gestures (a hop, a pointing arrow) rather than text, so the counters stay calm
  function bounceStaff(role) { if (staff[role]) staff[role].bounce = 1; }
  // ticket stub: carried from the box office to the usher, who tears it
  function giveStub(w) {
    if (w.stub) return;
    w.stub = itemEl('stub', 'stub', HELD.stub);
    placeItem(w, w.stub, 'stub');
    w.bod.append(w.stub);
  }
  function takeStub(w) {
    if (!w.stub) return;
    w.stub.remove();
    w.stub = null;
    if (staff.usher) flyTicket(w, staff.usher, true);
  }
  function lockDoor(w) {
    if (w.doorBound) return;
    w.doorBound = true;
    w.doorRoom = (w.room || 0) % DOORS.length;
  }
  function usherPoints(w) {
    lockDoor(w);   // the wing the usher points to is the one they walk to
    const u = staff.usher;
    if (!u) return;
    const left = DOORS[w.doorRoom].wall === 'u';   // screens 1-2: left wing
    const [x, y] = P(u.u, u.v);
    floatText(x + (left ? -22 : 22), y - EH - 8, left ? '◀' : '▶', '#7ff7f0');
  }

  // an open umbrella in hand (pre-rendered sprite when the art has one); it is only open outside and folds at the
  // door (drawFigure). Everyone comes with one (it's pouring); someone heading back out gets theirs again.
  function giveUmbrella(w) {
    w.umb?.remove();
    const colors = (UMB?.colors || []).filter((c) => UMB.open[c]?.file && validSheet(UMB.fold?.[c]));
    if (colors.length) {
      const c = colors[Math.floor(Math.random() * colors.length)];
      const o = UMB.open[c];
      const wet = UMB.wet?.[c];   // rendered rain on the canopy (BRIEF-53): a 24 fps loop, else the still sprite
      if (validSheet(wet)) {
        w.umb = h('div', 'umbs sheet');
        sheetStyle(w.umb, wet);
        w.umbLoop = { spec: wet, ph: Math.random() * 2, k: -1 };
      } else {
        w.umb = h('img', 'umbs');
        w.umb.alt = '';
        setImg(w.umb, o.file, o.file_2x, dpr() > 1.3, () => { w.umb.style.display = 'none'; });
        w.umbLoop = null;
      }
      // handle grip held at the emote's side, 40 px up (asset guidance for a 50 px emote)

    v.light.style.transform = `translate(${x0.toFixed(1)}px, ${y0.toFixed(1)}px)`;
    if (v.ind) v.ind.style.transform = v.light.style.transform;
    let zTop = 0;
    for (const { el, p, rr } of v.parts) {
      el.style.transform = `translate(${(x0 + p.x).toFixed(1)}px, ${(y0 + p.y).toFixed(1)}px)`;
      el.style.zIndex = String(depth(v.u + (p.du || 0), v.lane));
      zTop = Math.max(zTop, Number(el.style.zIndex));
      if (rr) {
        rr.el.style.transform = `translate(${(x0 + rr.spec.x).toFixed(1)}px, ${(y0 + rr.spec.y).toFixed(1)}px)`;
        rr.el.style.zIndex = el.style.zIndex;   // after the slice in the DOM, so it draws on top of it
      }
    }
    // tyre spray rises off the wheels (the sheet already hides what the body covers): above the whole body;
    // the wake lies on the road under bodies and walkers
    for (const [fx, z] of [[v.spray, zTop + 1], [v.wake, 4]]) {
      if (!fx) continue;
      fx.el.style.transform = `translate(${(x - fx.spec.anchor[0]).toFixed(1)}px, ${(y - fx.spec.anchor[1]).toFixed(1)}px)`;
      fx.el.style.zIndex = String(z);
    }
  }

  // ---------- sprite sheets: one-shot effects (tyre spray) and the lobby cat ----------
  let SPRAY = null;
  const shots = [];
  const validSheet = (s) => !!s && typeof s.file === 'string' && Array.isArray(s.anchor) && s.anchor.length === 2
    && [s.frames, s.columns, s.frame_width, s.frame_height, ...s.anchor].every((n) => Number.isFinite(n)) && s.frames > 0 && s.columns > 0;
  function sheetStyle(el, spec) {
    const two = dpr() > 1.3;
    const rows = spec.rows || Math.ceil(spec.frames / spec.columns);
    el.style.width = `${spec.frame_width}px`;
    el.style.height = `${spec.frame_height}px`;
    el.style.backgroundSize = `${spec.columns * spec.frame_width}px ${rows * spec.frame_height}px`;
    const src = ART + (two && spec.file_2x ? spec.file_2x : spec.file);
    el.style.backgroundImage = `url("${src}")`;
    if (two && spec.file_2x) {   // a missing @2x sheet falls back to 1x
      const probe = new Image();
      probe.onerror = () => { if (el.style.backgroundImage.includes(spec.file_2x)) el.style.backgroundImage = `url("${ART + spec.file}")`; };
      probe.src = src;
    }
  }
  function sheetFrame(el, spec, f) {
    el.style.backgroundPosition = `${-(f % spec.columns) * spec.frame_width}px ${-Math.floor(f / spec.columns) * spec.frame_height}px`;
  }
  // a sprite-sheet animation played once at a screen position (top-left), then removed
  function sheetShot(spec, x, y, z, additive, onDone) {
    if (shots.length >= 16) return false;
    const el = h('div', additive ? 'sheet fxsheet' : 'sheet');
    sheetStyle(el, spec);
    el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
    el.style.zIndex = String(z);
    world.append(el);
    const shot = { el, spec, t: 0, onDone };
    shots.push(shot);
    return shot;
  }
  function oneShot(spec, u, v, z) {
    if (!validSheet(spec) || shots.length >= 12) return;
    const [x, y] = P(u, v);
    sheetShot(spec, x - spec.anchor[0], y - spec.anchor[1], z, true);
  }
  // screen doors / restroom door swing open (warm light spilling out) and close again
  const doorAnims = {};
  const doorBusy = {};
  // The sheet is open (first ~35 %) - hold - close. Someone arriving while it plays keeps it open: the
  // animation is wound back to the start of its hold, so no one walks through a closing door.
  function playDoor(key) {
    const d = doorAnims[key];
    if (!d) return;
    const busy = doorBusy[key];
    if (busy) {
      const holdStart = Math.round(d.frames * 0.35) / (d.fps || 18);
      if (busy.t > holdStart) busy.t = holdStart;
      return;
    }
    doorBusy[key] = sheetShot(d, d.x, d.y, d.z_index ?? 900, false, () => { doorBusy[key] = null; }) || null;
  }
  // umbrellas: a pre-rendered sprite held over the emote outside; folded with a short one-shot at the door
  let UMB = null;
  const UMB_GRIP = [10, -40];   // grip point relative to the walker's feet
  function stepShots(dt) {
    for (let i = shots.length - 1; i >= 0; i--) {
      const s = shots[i];
      s.t += dt;
      const f = Math.floor(s.t * (s.spec.fps || 24));
      if (f >= s.spec.frames) { s.el.remove(); shots.splice(i, 1); s.onDone?.(); continue; }
      sheetFrame(s.el, s.spec, f);
    }
  }

  // ---------- NPCs: pre-rendered sprite characters (the lobby cat, the janitor) ----------
  // They walk axis-aligned routes via a hub in the open middle of the lobby (every spot -> hub route was
  // checked clear of all prop footprints) and use the walk cycle for the direction they're heading.
  const HUB = [8.6, 6.6];
  const npcs = [];
  function makeNpc(specs, spots) {
    const n = { specs, spots, el: h('div', 'sheet'), spot: 0, u: 0, v: 0, anim: null, spec: null, animT: 0, t: 0, dur: 0, path: [], f: -1 };
    world.append(n.el);
    n.spot = Math.floor(Math.random() * spots.length);
    [n.u, n.v] = spots[n.spot].at;
    npcs.push(n);
    return n;
  }
  function npcAnim(n, name) {
    const spec = n.specs[name];
    if (!spec || n.anim === name) return;
    n.anim = name;
    n.spec = spec;
    n.animT = 0;
    n.f = -1;
    sheetStyle(n.el, spec);
  }
  function npcRoute(n) {
    let next = n.spot;
    while (next === n.spot) next = Math.floor(Math.random() * n.spots.length);
    n.path = [...n.spots[n.spot].route, HUB, ...[...n.spots[next].route].reverse(), n.spots[next].at];
    n.spot = next;
  }
  // one walking step; true once the route is done
  function npcWalk(n, dt) {
    const [tu, tv] = n.path[0];
    const du = tu - n.u;
    const dv = tv - n.v;
    const d = Math.hypot(du, dv);
    const name = Math.abs(du) > Math.abs(dv) ? (du > 0 ? 'walk_plus_u' : 'walk_minus_u') : (dv > 0 ? 'walk_plus_v' : 'walk_minus_v');
    npcAnim(n, name);
    const spec = n.specs[name];
    const step = (spec?.stride_tiles ? spec.stride_tiles / (spec.frames / (spec.fps || 12)) : 0.4) * dt;
    if (d <= step) { n.u = tu; n.v = tv; n.path.shift(); return !n.path.length; }
    n.u += (du / d) * step;
    n.v += (dv / d) * step;
    return false;
  }
  function npcDraw(n) {
    const spec = n.spec;
    if (!spec) return;
    const f = spec.loop === false ? Math.min(spec.frames - 1, Math.floor(n.animT * (spec.fps || 12)))
      : Math.floor(n.animT * (spec.fps || 12)) % spec.frames;
    if (f !== n.f) { n.f = f; sheetFrame(n.el, spec, f); }
    const [x, y] = P(n.u, n.v);
    n.el.style.transform = `translate(${(x - spec.anchor[0]).toFixed(1)}px, ${(y - spec.anchor[1]).toFixed(1)}px)`;
    n.el.style.zIndex = String(depth(n.u, n.v));
  }
  const npcWalkSpecs = (s) => ['walk_plus_u', 'walk_minus_u', 'walk_plus_v', 'walk_minus_v'].every((k) => validSheet(s?.[k]));

  // The lobby cat: sleeps at a favourite spot, stretches, wanders, sits a while, sleeps again; someone
  // hopping right past can wake it up.
  const CAT_SPOTS = [   // spot + its route to the hub
    { at: [11.9, 4.35], route: [[11.9, 5.6], [8.6, 5.6]] },   // by the palm, end of the snack bar
    { at: [6.2, 8.45], route: [[6.2, 6.6]] },                 // by the front glass
    { at: [12.55, 6.85], route: [[12.55, 6.6]] },             // between bench and arcade
    { at: [10.5, 7.9], route: [[10.5, 6.6]] },                // near the entrance
  ];
  let cat = null;
  function initCat(specs) {
    cat = makeNpc(specs, CAT_SPOTS);
    cat.state = 'sleep';
    cat.dur = rand(20, 50);
    npcAnim(cat, 'sleep');
  }
  function stepCat(dt) {
    if (!cat) return;
    cat.t += dt;
    cat.animT += dt;
    if (cat.state === 'sleep') {
      npcAnim(cat, 'sleep');
      if (cat.t > 4 && Math.random() < dt * 0.5) {
        for (const w of figures) {
          if (w.moving && w.alpha > 0.8 && !w.removing && Math.hypot(w.u - cat.u, w.v - cat.v) < 0.7 && Math.random() < 0.3) {
            cat.state = 'sit'; cat.t = 0; cat.dur = rand(6, 12); break;
          }
        }
      }
      if (cat.t > cat.dur) {
        cat.t = 0;
        if (cat.specs.stretch) cat.state = 'stretch'; else { cat.state = 'walk'; npcRoute(cat); }
      }
    } else if (cat.state === 'stretch') {
      npcAnim(cat, 'stretch');
      if (cat.animT >= cat.specs.stretch.frames / (cat.specs.stretch.fps || 12)) { cat.state = 'walk'; cat.t = 0; npcRoute(cat); }
    } else if (cat.state === 'walk') {
      if (npcWalk(cat, dt)) { cat.state = 'sit'; cat.t = 0; cat.dur = rand(8, 20); }
    } else if (cat.state === 'sit') {
      npcAnim(cat, 'sit');
      if (cat.t > cat.dur) { cat.state = 'sleep'; cat.t = 0; cat.dur = rand(30, 80); }
    }
    npcDraw(cat);
  }

  // The janitor: walks to a spot, sweeps it for a while, leans on the broom checking his watch, moves on.
  const JAN_SPOTS = [
    { at: [7.0, 6.2], route: [[7.0, 6.6]] },
    { at: [10.2, 7.0], route: [[10.2, 6.6]] },
    { at: [5.6, 8.3], route: [[5.6, 6.6]] },
    { at: [11.9, 5.6], route: [[8.6, 5.6]] },
  ];
  let janitor = null;
  function initJanitor(specs) {
    janitor = makeNpc(specs, JAN_SPOTS);
    janitor.state = 'sweep';
    janitor.dur = rand(6, 12);
    npcAnim(janitor, 'sweep');
  }
  // Owner's pick (02 Nov): the janitor is the cpMOP emote (Club Penguin penguin with mop and bucket, a DGG
  // inside joke) instead of the rendered 3D janitor: it mops each spot for a while (the emote itself is the
  // mopping animation) and waddles to the next one, turned the way it walks. ?janitor=3d brings the old one back.
  const JAN_EMOTE = 'assets/cpMOP.webp';
  const JAN_H = 52;
  let mopper = null;
  function initMopper() {
    const el = h('div', 'w');
    const sh = h('div', 'sh');
    const bod = h('div', 'bod');
    const im = h('img', 'em');
    im.alt = '';
    im.src = JAN_EMOTE;
    const iw = Math.round((JAN_H * 144) / 128);
    Object.assign(im.style, { height: `${JAN_H}px`, width: `${iw}px`, left: `${-iw / 2}px` });
    Object.assign(sh.style, { width: '40px', left: '-20px' });
    bod.append(im);
    el.append(sh, bod);
    world.append(el);
    const spot = Math.floor(Math.random() * JAN_SPOTS.length);
    const [u, v] = JAN_SPOTS[spot].at;
    mopper = { el, bod, im, spots: JAN_SPOTS, spot, u, v, path: [], state: 'mop', t: 0, dur: rand(8, 16), phase: 0, face: 1, key: '' };
  }
  function stepMopper(dt) {
    const j = mopper;
    if (!j) return;
    j.t += dt;
    let lift = 0;
    let tilt = 0;
    if (j.held) {
      if (j.state === 'mop') j.t = Math.min(j.t, j.dur - 0.5);   // someone is talking to it: it stays and listens
    } else if (j.state === 'mop') {
      if (j.t > j.dur) { j.state = 'walk'; j.t = 0; npcRoute(j); }
    } else {
      const [tu, tv] = j.path[0];
      const du = tu - j.u;
      const dv = tv - j.v;
      const d = Math.hypot(du, dv);
      const step = 0.55 * dt;
      if (Math.abs(du - dv) > 0.01) j.face = du - dv > 0 ? 1 : -1;   // screen direction: x grows with u - v
      if (d <= step) {
        j.u = tu; j.v = tv; j.path.shift();
        if (!j.path.length) { j.state = 'mop'; j.t = 0; j.dur = rand(10, 18); }
      } else { j.u += (du / d) * step; j.v += (dv / d) * step; }
      // the same lazy waddle-and-hop as the chatters
      j.phase += dt * 3.6;
      const c = (j.phase / Math.PI) % 1;
      lift = c < 0.5 ? Math.sin((c / 0.5) * Math.PI) * 9 : 0;
      tilt = c < 0.5 ? 0 : Math.sin((c - 0.5) * 4 * Math.PI) * 3;
    }
    const [x, y] = P(j.u, j.v);
    const key = `${x.toFixed(1)}|${y.toFixed(1)}|${lift.toFixed(1)}|${tilt.toFixed(1)}|${j.face}`;
    if (key === j.key) return;
    j.key = key;
    j.el.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0)`;
    j.bod.style.transform = `translateY(${(-lift).toFixed(1)}px) rotate(${tilt.toFixed(1)}deg) scaleX(${j.face})`;
    j.el.style.zIndex = String(depth(j.u, j.v));
  }

  // ---------- jannies: DGG mods mop the lobby ----------
  // No janitor at the start (?janitor=always keeps the old penguin, ?janitor=3d the rendered one). When a DGG moderator
  // types (any message, tagged or not) a cpMOP penguin wearing their name comes in from the staff corridor behind the
  // usher, mops a free lobby spot for a while, moves on to the next, and says their messages. Several mods, several
  // jannies (one per spot, so at most JAN_SPOTS.length); 10 min without a message and they clock off the way they came.
  const JAN_IDLE = clamp(Number(q.get('janidle')) || 600, 20, 3600) * 1000;   // ?janidle=<s> for testing
  const jannies = new Map();   // nick (lower case) -> figure
  function onModMessage(m) {
    if (!m.features?.includes('moderator')) return;
    const key = m.nick.toLowerCase();
    let j = jannies.get(key);
    if (!j || j.gone) j = addJanny(m);
    if (!j) return;
    j.lastMsg = performance.now();
    queueLine(j, m.tokens);
  }
  function addJanny(m) {
    if (jannies.size >= JAN_SPOTS.length) return null;   // every spot has its janny
    const w = makeFigure(m.nick, 'PEPE', m.color, false);
    if (m.rainbow) { w.nm.textContent = ''; w.nm.append(h('span', 'rbt', m.nick)); }
    // the cpMOP penguin (with mop and bucket) instead of an emote
    w.em.remove();
    const im = h('img', 'em');
    im.alt = '';
    im.src = JAN_EMOTE;
    const iw = Math.round((JAN_H * 144) / 128);
    Object.assign(im.style, { height: `${JAN_H}px`, width: `${iw}px`, left: `${-iw / 2}px` });
    Object.assign(w.sh.style, { width: '40px', left: '-20px' });
    w.bod.prepend(im);
    w.em = im;
    w.emName = 'cpMOP';
    w.jan = true;
    w.key = m.nick.toLowerCase();
    [w.u, w.v] = J;
    w.alpha = 0;
    w.alphaT = 1;
    w.nameT = 8;
    w.spot = null;
    w.lastMsg = performance.now();
    figures.add(w);
    jannies.set(w.key, w);
    w.plan = [{ alpha: 1 }, { call: (x) => { floatAt(x, '🧹 janny on duty', '#7ff7f0'); janNext(x); } }];
    return w;
  }
  // to a free spot (via the hub, like the old janitor), mop it, then the next one
  function janNext(j) {
    if (j.gone) return;
    if (performance.now() - j.lastMsg > JAN_IDLE) { janLeave(j); return; }
    const taken = new Set([...jannies.values()].filter((o) => o !== j && !o.gone).map((o) => o.spot));
    const free = JAN_SPOTS.map((_, i) => i).filter((i) => i !== j.spot && !taken.has(i));
    const next = free.length ? free[Math.floor(Math.random() * free.length)] : j.spot ?? 0;
    const s = JAN_SPOTS[next];
    const from = j.spot == null ? [G, L.gateIn || G] : JAN_SPOTS[j.spot].route;
    j.spot = next;
    j.mopping = false;
    const dur = rand(10, 18) * 1000;
    let t0 = 0;
    j.plan = [...[...from, HUB, ...[...s.route].reverse(), s.at].map((to) => ({ to })),
      { call: (x) => { x.mopping = true; t0 = performance.now(); } },
      { until: () => !j.held && performance.now() - t0 > dur },   // someone talking to them: they stay and listen
      { call: (x) => { x.mopping = false; janNext(x); } }];
  }
  // clocks off: back past the usher into the staff corridor
  function janLeave(j) {
    j.leaving = true;
    j.mopping = false;
    const from = j.spot == null ? [] : JAN_SPOTS[j.spot].route;
    j.spot = null;
    j.plan = [...[...from, HUB, L.gateIn || G, G, J].map((to) => ({ to })), { call: (x) => { x.alphaT = 0; dropBubble(x); } }, { alpha: 0 },
      { call: (x) => { jannies.delete(x.key); removeWalker(x); } }];
  }
  SB.on('msg', onModMessage);

  function stepJanitor(dt) {
    stepMopper(dt);
    if (!janitor) return;
    const j = janitor;
    j.t += dt;
    j.animT += dt;
    if (j.state === 'sweep') {
      npcAnim(j, 'sweep');
      if (j.t > j.dur) { j.state = 'idle'; j.t = 0; j.dur = rand(3, 6); }
    } else if (j.state === 'idle') {
      npcAnim(j, 'idle');
      if (j.t > j.dur) { j.state = 'walk'; j.t = 0; npcRoute(j); }
    } else if (j.state === 'walk') {
      if (npcWalk(j, dt)) { j.state = 'sweep'; j.t = 0; j.dur = rand(8, 16); }
    }
    npcDraw(j);
  }

  // --- per-frame update ---
  // personal space: someone about to walk into the back of a visible person just ahead (before their own
  // target) waits a moment, so lines form instead of piles; after 1.5 s they go anyway (no deadlocks)
  function blockedAhead(w, du, dv, d) {
    if (w.passT > 0 || w.alpha < 0.5 || w.entering) return false;
    const eu = du / d;
    const ev = dv / d;
    for (const o of figures) {
      if (o === w || o.gone || o.entering || o.alpha < 0.5) continue;
      const ru = o.u - w.u;
      const rv = o.v - w.v;
      const along = ru * eu + rv * ev;
      if (along <= 0.05 || along >= d) continue;   // behind, or beyond where this one is going
      if (Math.abs((ru - rv) * 60) < 34 && Math.abs((ru + rv) * 30) < 30) return true;   // overlapping on screen
    }
    return false;
  }

  // Walking pace: a stroll at 75% (owner, 05 Nov) while the lobby has room, back up to full speed as the crowd nears
  // the cap (70% -> 85% of CAP), so a busy night still clears; eased so nobody visibly changes gear mid-step.
  let pace = 0.75;
  function stepPace(dt) {
    const target = 0.75 + 0.25 * clamp((liveCount() / CAP - 0.7) / 0.15, 0, 1);
    pace += (target - pace) * Math.min(1, dt * 0.5);
  }
  function stepPlan(w, dt) {
    let moving = false;
    let guard = 8;
    if (w.passT > 0) w.passT -= dt;
    while (w.plan.length && guard--) {
      const s = w.plan[0];
      if (s.to) {
        const [tu, tv] = s.to;
        const du = tu - w.u;
        const dv = tv - w.v;
        const d = Math.hypot(du, dv);
        if (d > 0.001 && !s.slow && blockedAhead(w, du, dv, d)) {
          w.holdT = (w.holdT || 0) + dt;
          if (w.holdT > 1.5) { w.holdT = 0; w.passT = 1.2; }
          break;
        }
        w.holdT = 0;
        const sp = (w.hurry ? 3.0 : (s.slow ? 0.9 : 2.0) * pace) * dt;
        if (d <= sp) { w.u = tu; w.v = tv; w.plan.shift(); moving = d > 0.001; } else { w.u += (du / d) * sp; w.v += (dv / d) * sp; moving = true; }
        if (moving) SB.faceEmote(w.em, w.emName, du - dv);   // looks the way it walks (screen x = u - v)
        break;
      }
      if (s.wait != null) {
        if (!s.started) { s.started = true; s.start?.(w); }
        s.wait -= dt;
        if (s.wait <= 0) { w.plan.shift(); s.end?.(w); }
        break;
      }
      if (s.until) {   // hold until a condition is true (e.g. their bus / taxi has stopped)
        if (s.until()) { w.plan.shift(); continue; }
        break;
      }
      if (s.alpha != null) {
        if (Math.abs(w.alpha - s.alpha) < 0.02) { w.alpha = s.alpha; w.plan.shift(); continue; }
        break;
      }
      if (s.call) { w.plan.shift(); s.call(w); if (w.gone) return false; continue; }
      w.plan.shift();
    }
    if (w.plan.length === 0 && !w.inQueue && !w.staff && !w.gone) { /* idle until the queue moves */ }
    return moving;
  }

  // The glass front (v 8.95-9.05, u 3-13) is cut into depth slices ~0.9 tile wide, each sorted at its middle. Right
  // at the glass a figure's sprite (and umbrella) overlaps the neighbouring slices, so plain depth sorting put glass
  // over people outside and people inside over the glass. Near the front, sort by the side of the glass instead:
  // outside within a tile always in front of the slices they can overlap, inside always behind them.
  function frontV(u, v) {
    if (u < 2.9 || u > 13.1) return v;   // left of the glass: the bus shelter and the solid wall sort as usual
    if (v >= 9.05) return v < 10 ? 10 : v;
    return Math.min(v, 16.85 - v);
  }
  function drawFigure(w, dt, t) {
    let s = 0;
    let lift = 0;
    let tilt = 0;
    let bouncing = false;
    const moving = w.moving;
    if (t < combo.until && w.emName === combo.emote && !w.entering) {
      s = Math.abs(Math.sin(((t - combo.start) / 1000) * 9));
      lift = s * 26;
      bouncing = true;
    } else if (w.bounce > 0) {
      w.bounce = Math.max(0, w.bounce - dt * 2.4);
      s = Math.sin(w.bounce * Math.PI);
      lift = s * 12;
      bouncing = true;
    } else if (moving) {
      // one lazy hop every ~0.8 s (0.55 s hurrying), waddling along the floor in between
      w.phase += dt * (w.hurry ? 5.7 : 3.9 * pace);
      const c = (w.phase / Math.PI) % 1;
      s = c < 0.5 ? Math.sin((c / 0.5) * Math.PI) : 0;
      lift = s * 13;
      bouncing = c < 0.5;
