           + texture2D(uL, (px + vec2(-24.0, 12.0)) / uRes).rgb + texture2D(uL, (px + vec2(24.0, 12.0)) / uRes).rgb) * 0.25;
  vec3 tint = vec3(0.55, 0.62, 0.78) * 0.3 + La * 1.8;
  float a = 0.0;
  if (uW.x > 0.01) a += uW.x * (streaks(px, 5.0, 520.0, 13.0, 42.0, 0.85, 0.8, 1.0) * 0.55
                              + streaks(px, 7.0, 430.0, 10.0, 34.0, 0.8, 0.7, 2.0) * 0.4
                              + streaks(px + 2.5, 4.0, 380.0, 7.0, 30.0, 0.7, 0.6, 4.0) * 0.25);
  if (uW.y > 0.01) a += uW.y * streaks(px, 16.0, 820.0, 30.0, 150.0, 0.8, 1.3, 3.0) * 0.9;
  if (uW.z > 0.01) {
    float g = smoothstep(0.35, 0.75, fbm(vec3(px.x * 0.003 + uT * 0.2, px.y * 0.0015 - uT * 0.07, uT * 0.05)));
    a *= mix(1.0, 0.12 + 2.2 * g, uW.z);
  }
  vec3 col = tint * a;
  if (uW.w > 0.01) {
    vec3 Lc;
    float cr = crowns(px, 7.0, 2.2, 0.35, 1.6, Lc);
    col += (Lc * 2.0 + vec3(0.02)) * cr * 0.65 * uW.w;
  }
  col = col * uGain + fg;
  gl_FragColor = vec4(col, clamp(max(col.r, max(col.g, col.b)), 0.0, 1.0));
}`;

  // ---------- HUD ----------
  // a wedge of warm projector light spills out of the door for a moment when someone goes in
  function doorGlow(i) {
    const d = DOORS[i];
    if (!d) return;
    const [x, y] = d.wall === 'u' ? P(0.35, d.at, 40) : P(d.at, 0.35, 40);
    const el = h('div', 'doorglow');
    el.style.zIndex = '3';
    $('cam').append(el);
    el.animate([
      { transform: `translate(${x}px, ${y}px) scale(.6)`, opacity: 0 },
      { transform: `translate(${x}px, ${y}px) scale(1)`, opacity: 1, offset: 0.25 },
      { transform: `translate(${x}px, ${y}px) scale(1.1)`, opacity: 0 },
    ], { duration: 1400, easing: 'ease-out' }).onfinish = () => el.remove();
  }
  function arcadeFlash() {
    const [x, y] = P(12.7, 7.85, 57);
    const el = h('div', 'doorglow arcadeglow');
    el.style.zIndex = '3';
    $('cam').append(el);
    el.animate([{ transform: `translate(${x}px, ${y}px)`, opacity: 1 }, { transform: `translate(${x}px, ${y}px)`, opacity: 0 }],
      { duration: 900, easing: 'ease-out', iterations: 2 }).onfinish = () => el.remove();
  }

  // ---------- conversations: speech only happens in groups (owner, 02 Nov) ----------
  // A chatter's messages are saved (latest two). After tickets / popcorn, instead of heading straight for the
  // gate they hang out: they join a group at a hangout spot (or start one) and the group talks in turns,
  // each line from someone's saved messages. With nothing left to say they drift on to the gate. Someone left
  // alone with something to say goes and tells the mopping penguin instead (it stops to listen).
  const HANGOUTS = [[10.8, 7.2], [11.0, 5.35]];   // open lobby floor, clear of the rope lane, counters and props
  const RING = [[-1, 1], [1, -1], [-0.95, -0.95], [1, 1]];   // left, right, back, front (screen), times the spot's radius
  // where people stand around and talk before going in: the lobby floor; with layout 3 also the sidewalk in front of
  // the glass (either side of the entrance, clear of the lamp and the bus stop) and the corridor past the usher
  // (beside the walking line to the doors at v 1.4, clear of the fountain, bench and bin)
  const SPOTS = { lobby: HANGOUTS.map((c) => ({ c, r: 0.42 })), outside: [], hall: [] };
  // chance to stop and talk at each kind of spot (with something to say / without)
  // (most have said their arrival message on the way, so the "without" chance carries the hanging around)
  const HANG_P = { outside: [0.5, 0.35], lobby: [1, 0.5], hall: [0.7, 0.4] };
  const groups = [];
  // Every message a chatter sends is said once, in order: in a talk group when their turn comes, otherwise on their
  // own a moment after it arrives (soloSpeech). Nothing is repeated; a backlog over 4 says the oldest at once.
  function queueLine(w, tokens) {
    if (!tokens?.length) return;
    (w.lines ||= []).push(tokens);
    if (w.lines.length > 4) say(w, w.lines.shift());
  }
  const SOLO_DELAY = 1.2;   // s between a message arriving (or their last bubble) and saying it outside a group
  function soloSpeech(w, dt) {
    if (!w.lines?.length || (w.group && w.arrived) || w.entering || w.removing || !onScreen(w)) { w.soloT = 0; return; }
    if (w.bub && w.bubT > 1.5) return;   // let the current bubble be read first
    w.soloT = (w.soloT || 0) + dt;
    if (w.soloT < SOLO_DELAY) return;
    w.soloT = 0;
    say(w, w.lines.shift());
  }
  // someone alone with something to say can go and tell a janitor: the old penguin (?janitor=always) or a mopping janny
  const janTarget = () => mopper || [...jannies.values()].find((j) => j.mopping && !j.leaving && !j.gone) || null;
  const groupCenter = (g) => (g.janitor && g.jan && !g.jan.gone ? [g.jan.u, g.jan.v] : g.center || [0, 0]);
  function slotOf(g, w) {
    const [cu, cv] = groupCenter(g);
    const [ou, ov] = RING[w.ring % RING.length];
    return [cu + ou * g.r, cv + ov * g.r];
  }
  function joinGroup(w, g) {
    const used = new Set(g.members.map((m) => m.ring));
    w.ring = [0, 1, 2, 3].find((i) => !used.has(i)) ?? 0;
    g.members.push(w);
    w.group = g;
    w.arrived = false;
    w.leaveNow = false;
    w.hangT = 0;
    w.stayT = rand(9, 16);
    w.plan = [{ to: slotOf(g, w) }, { call: () => { w.arrived = true; } }, { until: () => w.leaveNow }, { call: leaveGroup }];
  }
  function leaveGroup(w) {
    const g = w.group;
    if (g) g.members = g.members.filter((m) => m !== w);
    w.group = null;
    w.arrived = false;
    w.plan = w.afterHang || [];
    w.afterHang = null;
  }
  // called from the walker's plan (outside before going in, in the lobby where they would head for the gate, in
  // the corridor before their door); the rest of the plan waits. Once per kind of spot.
  function hangOut(w, kind = 'lobby') {
    if (w.hurry || w.removing || (w.hung ||= new Set()).has(kind)) return;
    w.hung.add(kind);
    const [pTalk, pQuiet] = HANG_P[kind];
    if (Math.random() > (w.lines?.length ? pTalk : pQuiet)) return;   // some just go in
    let g = groups.find((x) => x.kind === kind && !x.janitor && x.members.length < 4);
    if (!g) {
      const s = SPOTS[kind].find((s0) => !groups.some((x) => x.spot === s0));
      if (!s) return;
      g = { kind, spot: s, center: s.c, r: s.r, members: [], next: 1.2, last: null, janitor: false };
      groups.push(g);
    }
    w.afterHang = w.plan;
    joinGroup(w, g);
  }
  const hangOutside = (w) => hangOut(w, 'outside');
  const hangHall = (w) => hangOut(w, 'hall');
  function stepGroups(dt) {
    for (let i = groups.length - 1; i >= 0; i--) {
      const g = groups[i];
      g.members = g.members.filter((m) => !m.gone && m.group === g);
      if (!g.members.length) { groups.splice(i, 1); continue; }
      const here = g.members.filter((m) => m.arrived && m.alpha > 0.6);
      // alone with something to say for a while: go and tell a janitor (one listener per janitor)
      const jt = g.kind === 'lobby' && !g.janitor && g.members.length === 1 && here.length === 1 && here[0].lines?.length
        && here[0].hangT > 7 ? janTarget() : null;
      if (jt && !groups.some((x) => x.janitor && x.jan === jt)) {
        g.janitor = true;
        g.jan = jt;
        g.center = null;
        g.spot = null;   // the lobby spot is free again
        const m = here[0];
        m.arrived = false;
        m.plan = [{ to: slotOf(g, m) }, { call: () => { m.arrived = true; } }, { until: () => m.leaveNow }, { call: leaveGroup }];
      }
      // their janitor clocked off: the chat is over
      if (g.janitor && (!g.jan || g.jan.gone || g.jan.leaving)) for (const m of g.members) m.leaveNow = true;
      // take turns: someone with a saved line speaks (not the same one twice in a row if others have lines)
      g.next -= dt;
      const audience = g.janitor ? 1 : 2;
      if (g.next <= 0 && here.length >= audience && !here.some((m) => m.bub && m.bubT > 2.5)) {
        const ready = here.filter((m) => m.lines?.length);
        const sp = ready.find((m) => m !== g.last) || ready[0];
        if (sp) {
          say(sp, sp.lines.shift());
          sp.hangT = Math.min(sp.hangT, sp.stayT - 4);   // stick around for the replies
          g.last = sp;
          g.next = rand(2.2, 3.4);
        } else g.next = 1;
      }
      for (const m of g.members) {
        if (!m.arrived) continue;
        m.hangT += dt;
        if (m.leaveNow) continue;
        const othersTalking = here.some((o) => o !== m && o.lines?.length);
        const done = !m.lines?.length && !m.bub && m.hangT > m.stayT && (!othersTalking || m.hangT > 30);
        // nobody to talk to: outside and in the corridor they don't wait long, they'll talk further on
        const lonely = here.length === 1 && g.members.length === 1 && (!m.lines?.length || g.kind !== 'lobby') && m.hangT > (g.kind === 'lobby' ? 10 : 7);
        if (done || lonely || m.hangT > 45 || m.hurry) m.leaveNow = true;
      }
    }
    // a janitor stands still while someone talks to it
    if (mopper) mopper.held = groups.some((x) => x.janitor && x.jan === mopper);
    for (const j of jannies.values()) j.held = groups.some((x) => x.janitor && x.jan === j);
  }

  // ---------- layout 3 (pass 10): three screens in the right wing, the left wing is the restroom ----------
  // The right-wing doors become screens 1-3 (the last three films, newest first); the two left-wing screens and
  // their signs/posters go. The restroom is a real room: door off the corridor junction, four stalls (one each),
  // sinks, a dryer. Its red/green light shows OCCUPIED only when every stall is taken.
  let RESTROOM = null;
  function setupLayout3(m) {
    for (let i = DOORS.length - 1; i >= 0; i--) {
      if (DOORS[i].wall !== 'u') continue;
      DOORS.splice(i, 1);
      const s = signs.splice(i, 1)[0];
      s.el.remove();
      s.img.parentElement.remove();
    }
    // the remaining signs are screens 1-3 now; films that arrived before the art move onto them at once
    signs.forEach((s, i) => { const no = s.el.querySelector('.no'); if (no) no.textContent = `SCREEN ${i + 1}`; });
    applyRooms(rooms);
    const r = m.restroom;
    const pt = (p) => Array.isArray(p) && p.length >= 2 && p.every(Number.isFinite);
    if (!r || !pt(r.door) || !pt(r.inside) || !Array.isArray(r.stalls) || !r.stalls.length) return;
    RESTROOM = {
      door: r.door,
      outside: pt(r.outside) ? r.outside : [r.door[0], r.door[1] - 0.4],
      inside: r.inside,
      stalls: r.stalls.filter((s) => pt(s?.spot)).map((s, i) => ({ key: `stall${i + 1}`, spot: s.spot,
        route: (Array.isArray(s.route_points) ? s.route_points : Array.isArray(s.route) ? s.route : []).filter(pt), busy: null })),
      sinks: (r.sinks || []).filter(pt),
      dryer: pt(r.dryer) ? r.dryer : null,
    };
    r.stalls.forEach((s, i) => {
      const d = s?.door_anim;
      if (d && validSheet({ ...d, anchor: [0, 0] }) && Number.isFinite(d.x) && Number.isFinite(d.y)) doorAnims[`stall${i + 1}`] = d;
    });
    if (r.door_anim && validSheet({ ...r.door_anim, anchor: [0, 0] })) doorAnims.wc = r.door_anim;
    // more places to stand and talk (see SPOTS): a third lobby spot between the box office and the glass, two on the
    // sidewalk either side of the entrance, two in the corridor
    SPOTS.lobby = [...HANGOUTS.map((c) => ({ c, r: 0.42 })), { c: [5.9, 8.35], r: 0.42 }];
    SPOTS.outside = [{ c: [6.8, 9.5], r: 0.34 }, { c: [11.9, 9.5], r: 0.34 }];
    // corridor spots between the screen doors (v = 0 wall), on the strip in front of the walking line (v 1.4): behind
    // the line (v > ~1.6) the snack bar's tall back wall hides the floor, so people standing there showed only their
    // heads over the wall top and looked like they stood on it (owner, 05 Nov)
    SPOTS.hall = [{ c: [6.3, 0.85], r: 0.28 }, { c: [9.7, 0.85], r: 0.28 }];
    // the janitor spot between the front rope and the glass: reached round the rope lane's open (east) end, not
    // through the rope, and clear of the new talk spot
    JAN_SPOTS[2] = { at: [6.7, 8.35], route: [[9.6, 8.35], [9.6, 6.6]] };
  }
  const restroomFull = () => !!RESTROOM && RESTROOM.stalls.every((s) => s.busy && !s.busy.gone);
  function tryRestroom(w) {
    const R = RESTROOM;
    R.stalls.forEach((s) => { if (s.busy?.gone) s.busy = null; });
    const stall = R.stalls.find((s) => !s.busy);
    if (!stall) return;   // every stall taken: they hold it until after the film
    stall.busy = w;
    w.stall = stall;
    setWC(restroomFull());
    const go = (pts) => pts.map((to) => ({ to }));
    const sink = R.sinks.length ? R.sinks[Math.floor(Math.random() * R.sinks.length)] : null;
    w.plan.unshift(
      ...go([R.outside]), { call: () => playDoor('wc') }, ...go([R.door, R.inside]),
      ...go([...stall.route, stall.spot]),
      { call: () => { playDoor(stall.key); w.alphaT = 0; dropBubble(w); } }, { alpha: 0 },
      { wait: rand(3, 6) },
      { call: () => { playDoor(stall.key); w.alphaT = 1; } }, { alpha: 1 },
      { call: () => { if (stall.busy === w) stall.busy = null; w.stall = null; setWC(restroomFull()); } },
      ...go([...[...stall.route].reverse()]),
      ...(sink ? [{ to: sink }, { wait: rand(1.4, 2.4) }] : []),
      ...(R.dryer && Math.random() < 0.5 ? [{ to: R.dryer }, { wait: 1.6 }] : []),
      { to: R.inside }, { call: () => { playDoor('wc'); floatAt(w, 'much better', '#9fd8ff'); } },
      ...go([R.door, R.outside]),
    );
  }

  // ---------- camera + zoom director ----------
  // Wide shot most of the time. Every ~2-3 min (director=<seconds>) the camera takes the next arrival and
  // follows them from the bus / taxi / sidewalk through tickets, popcorn and the gate to their door, holds a
  // moment, then eases back out. Manual: keys F (follow the next arrival), R (follow someone now),
  // W / Esc (wide shot), D (director on/off), and control.html through the standby server.
  const camEl = $('cam');
  const cam = { x: WIDE_X, y: 540, z: 1, vx: 0, vy: 0, vz: 0, key: '' };
  const director = { on: DIRECTOR_ON, every: clamp(Number(q.get('director')) || 150, 30, 1800), zoom: ZOOM,
    follow: null, next: performance.now() + rand(45, 75) * 1000, wantNext: false };
  function toScreen(x, y) { return [(x - cam.x) * cam.z + 960, (y - cam.y) * cam.z + 540]; }
  // critically damped spring: smooth start and stop, no overshoot, frame-rate independent
  function damp(c, v, target, time, dt) {
    const o = 2 / time;
    const x = o * dt;
    const e = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
    const ch = c - target;
    const tmp = (v + o * ch) * dt;
    return [target + (ch + tmp) * e, (v - o * tmp) * e];
  }
  function startFollow(w) {
    if (!w || w.gone || w.removing) return;
    director.follow = { w, since: performance.now(), lx: null, ly: null, ax: 0, ay: 0, tx: null, ty: null, endAt: 0 };
    director.wantNext = false;
  }
  function endFollow() {
    if (!director.follow) return;
    director.follow = null;
    director.next = performance.now() + director.every * 1000 * rand(0.85, 1.2);
  }
  // a new arrival: taken when the director is due, or when someone asked for the next one
  function directorArrival(w) {
    if (director.follow || w.hurry) return;
    if (director.wantNext || (director.on && performance.now() >= director.next)) startFollow(w);
  }
  function followSomeone(nick) {
    const key = nick?.toLowerCase();
    const list = [...figures].filter((w) => !w.gone && !w.entering && !w.removing && w.alpha > 0.5 && (!key || w.key === key));
    if (list.length) startFollow(list[Math.floor(Math.random() * list.length)]);
    return list.length > 0;
  }
  function stepCamera(dt) {
    const now = performance.now();
    const f = director.follow;
    let tx = WIDE_X;
    let ty = 540;
    let tz = 1;
    if (f) {
      const w = f.w;
      // in through the door (or gone): hold on the doorway a moment, then back to the wide shot
      if (!f.endAt && (w.gone || w.removing || now - f.since > 150000)) f.endAt = now + (w.gone ? 1600 : 0);
      if (f.endAt && now >= f.endAt) endFollow();
      else {
        let x = null;
        let y = null;
        const veh = w.ride && !w.ride.gone && w.alpha < 0.5 ? w.ride : null;
        // still riding: follow the bus / taxi (vehicles keep their road position in .lane: .v was undefined, so the
        // camera went NaN for good on every rider follow, and with it onScreen() and all speech; QA 05 Nov)
        if (!w.gone && veh) [x, y] = P(veh.u, veh.lane, 40);
        else if (!w.gone && w.alpha > 0.2) { x = w.x; y = w.y - 34; }   // the chatter, at about head height
        if (x != null) {
          // lead the shot a little in the walking direction (smoothed velocity)
          if (f.lx != null && dt > 0) {
            f.ax = f.ax * 0.9 + ((x - f.lx) / dt) * 0.1;
            f.ay = f.ay * 0.9 + ((y - f.ly) / dt) * 0.1;
          }
          f.lx = x;
          f.ly = y;
          f.tx = x + clamp(f.ax * 0.35, -60, 60);
          f.ty = y + clamp(f.ay * 0.35, -40, 40);
        }
        if (f.tx != null) { tx = f.tx; ty = f.ty; tz = director.zoom; }
      }
    }
    // the view never leaves the stage (with fit=cover only the cropped middle is on screen: its half size)
    const fit = (c, half, size) => clamp(c, half, size - half);
    const [vx0, vy0, vx1, vy1] = view();
    const hw = (vx1 - vx0) / 2;
    const hh = (vy1 - vy0) / 2;
    tx = fit(tx, hw / tz, 1920);
    ty = fit(ty, hh / tz, 1080);
    [cam.z, cam.vz] = damp(cam.z, cam.vz, tz, 1.5, dt);
    [cam.x, cam.vx] = damp(cam.x, cam.vx, tx, f ? 0.75 : 1.4, dt);
    [cam.y, cam.vy] = damp(cam.y, cam.vy, ty, f ? 0.75 : 1.4, dt);
    cam.x = fit(cam.x, hw / cam.z, 1920);
    cam.y = fit(cam.y, hh / cam.z, 1080);
    // a bad target must never freeze the camera (and with it every bubble): back to the wide shot
    if (![cam.x, cam.y, cam.z].every(Number.isFinite)) { Object.assign(cam, { x: 960, y: 540, z: 1, vx: 0, vy: 0, vz: 0 }); endFollow(); }
    const key = `translate(${(960 - cam.x * cam.z).toFixed(2)}px, ${(540 - cam.y * cam.z).toFixed(2)}px) scale(${cam.z.toFixed(4)})`;
    if (key !== cam.key) { cam.key = key; camEl.style.transform = key; }
  }
  // keys work while the page has focus (OBS: right-click the source -> Interact)
  addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'f') director.wantNext = true;
    else if (k === 'r') followSomeone();
    else if (k === 'w' || k === 'escape') { director.wantNext = false; endFollow(); }
    else if (k === 'd') director.on = !director.on;
  });

  // ---------- control panel (control.html) through the standby server ----------
  function statusOf(w) {
    if (w.entering) return 'going in';
    if (w.ride) return w.ride.type === 'bus' ? 'on the bus' : 'in a taxi';
    if (w.v > 9.1) return 'street';
    if (w.inQueue) return 'ticket line';
    if (windows.some((x) => x.cur === w)) return 'buying a ticket';
    if (w.snack) return 'snack bar';
    if (gateLine.includes(w)) return 'usher gate';
    if (wcBusy === w || wcWait === w || w.stall) return 'restroom';
    if (arcadeBusy === w) return 'arcade';
    if (benchBusy === w) return 'bench';
    if (w.group) return w.group.janitor ? 'talking to the janitor' : 'chatting';
    return w.u < 3 || w.v < 3 ? 'corridor' : 'lobby';
  }
  function control(c) {
    const now = performance.now();
    const key = typeof c.nick === 'string' ? c.nick.trim().toLowerCase() : '';
    switch (c.cmd) {
      case 'follow': followSomeone(key); break;
      case 'random': followSomeone(); break;
      case 'next': director.wantNext = true; break;
      case 'wide': director.wantNext = false; endFollow(); break;
      case 'director': director.on = !!c.on; if (director.on) director.next = Math.min(director.next, now + 20000); break;
      case 'every': if (Number.isFinite(+c.value)) director.every = clamp(+c.value, 30, 1800); break;
      case 'zoom': if (Number.isFinite(+c.value)) director.zoom = clamp(+c.value, 1.2, 3); break;
      case 'remove':
        for (const w of [...figures]) {
          if (w.key !== key || w.removing) continue;
          retire(w);
          w.plan = [{ alpha: 0 }, { call: removeWalker }];
        }
        break;
      case 'add':
      case 'say': {
        const nick = String(c.nick || '').trim().slice(0, 25);
        if (!nick) break;
        const tokens = SB.tokenize(String(c.text || '').slice(0, 200));
        const w = walkers.get(key);
        if (c.cmd === 'say' && w && !w.entering && !w.removing) { say(w, tokens); break; }
        const em = tokens.find((t) => t.t === 'emote')?.name;
        spawn({ nick, emote: em || Cinema.defaultEmote(nick), tokens, color: SB.nickColor(nick),
          roomIndex: Math.floor(Math.random() * 5), detour: c.detour || null });
        break;
      }
      default: break;
    }
  }
  const pageId = Math.random().toString(36).slice(2, 8);
  if (q.get('ctl') !== '0' && location.protocol.startsWith('http')) {
    let alive = true;
    let statePending = false;   // one post at a time, 3.5 s at most (as the auditorium): slow posts never pile up
    const es = new EventSource('/ctl/events');
    es.onmessage = (e) => { try { control(JSON.parse(e.data)); } catch (error) { console.error('[lobby] control', error); } };
    const postState = () => {
      if (!alive || statePending) return;
      const f = director.follow;
      // obs: this screen is the OBS source (the panel shows it before a bigger preview tab)
      const body = { id: pageId, ts: Date.now(), size: [innerWidth, innerHeight], obs: !!window.obsstudio,
        director: { on: director.on, every: director.every, zoom: director.zoom, wantNext: director.wantNext,
          following: f && !f.w.gone ? f.w.nick : null, nextIn: Math.max(0, Math.round((director.next - performance.now()) / 1000)) },
        chatters: [...figures].filter((w) => !w.gone).map((w) => ({ nick: w.nick, emote: w.emName, status: statusOf(w), followed: f?.w === w })) };
      statePending = true;
      fetch('/ctl/state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: AbortSignal.timeout(3500) })
        .then((r) => { if (r.status === 404) { alive = false; es.close(); } })   // an older server without the panel
        .catch(() => {}).finally(() => { statePending = false; });
    };
    setInterval(postState, 1500);
  }

  // ---------- main loop ----------
  let last = performance.now();
  let lastFrame = 0;
  function frame(t) {
    const dt = clamp((t - last) / 1000, 0, 0.1);
    last = t;
    lastFrame = performance.now();
    stepCamera(dt);
    serveQueue(dt);
    serveSnacks(dt);
    serveGate(dt);
    stepGroups(dt);
    stepTraffic(dt, t);
    stepPropLoops(t);
    stepLeds(t);
    stepShots(dt);
    stepCat(dt);
    stepJanitor(dt);
    stepPace(dt);
    for (const w of [...figures]) {
      if (w.gone) continue;
      w.moving = stepPlan(w, dt);
      if (w.gone) continue;
      drawFigure(w, dt, t);
      if (w.pending && onScreen(w)) say(w, w.pending);
      else soloSpeech(w, dt);
      placeBubble(w, dt);
    }
    for (const w of Object.values(staff)) { w.moving = false; drawFigure(w, dt, t); placeBubble(w, dt); }
    showNames();
    layoutBubbles(dt);
    // door sign flash when someone goes in (driven here, not by CSS animations: they stall in throttled sources)
    for (const s of signs) {
      if (!s.pulse) continue;
      s.pulse = Math.max(0, s.pulse - dt * 1.2);
      s.el.style.boxShadow = s.pulse ? `0 0 ${Math.round(30 * s.pulse)}px rgba(255,95,176,${(0.9 * s.pulse).toFixed(2)}), inset 0 0 ${Math.round(24 * s.pulse)}px rgba(255,95,176,${(0.6 * s.pulse).toFixed(2)})` : '';
    }
    if (rainOn) drawRain(dt);
    if (mist) drawGL(mist, t, 1000);
    if (rain2) {
      stepWeather(dt);
      rainClock = (rainClock + dt * rainSpeed) % 1000;
      rain2.gl.uniform1f(rain2.uS, rainClock);
      // stepped like the baked rain (24 fps loops); the canvas keeps its last frame between steps
      const tq = RAIN2_FPS ? Math.floor(t * RAIN2_FPS / 1000) * 1000 / RAIN2_FPS : t;
      // with the foreground-rain video in this pass, its new frames are the steps (24 a second, both layers change
      // together); else the page clock steps it as before
      // (a stalled video: the page clock takes over after 120 ms, so the extra rain never freezes with it)
      if (rain2.fg && RAIN2_FPS) {
        const fgNew = uploadFg();
        if (fgNew) rain2.fgAt = t;
        // (at the real time on a video frame: the page clock's 24 fps steps drift against the video's and would
        // repeat or skip a step now and then)
        if (fgNew) { rain2.lastT = tq; drawGL(rain2, t, 1000); } else if (t - (rain2.fgAt || 0) > 120 && tq !== rain2.lastT) { rain2.lastT = tq; drawGL(rain2, tq, 1000); }
      } else {
        const fgNew = rain2.fg ? uploadFg() : false;
        if (tq !== rain2.lastT || fgNew) { rain2.lastT = tq; drawGL(rain2, tq, 1000); }
      }
    }
  }
  // an exception in one subsystem must never stop the screen: the next frame is always scheduled
  function loop(t) {
    try { frame(t); } catch (error) { console.error('[lobby] frame', error); }
    requestAnimationFrame(loop);
  }
  // fallback for throttled/background tabs (headless screenshots): drive the loop if rAF stalls
  setInterval(() => {
    if (performance.now() - lastFrame <= 150) return;
    try { frame(performance.now()); } catch (error) { console.error('[lobby] frame', error); }
  }, 40);

  // ---------- art: pre-rendered layers from roxy3d/out (Blender), flat canvas art as fallback ----------
  let art = null;
  const artImgs = [];
  async function loadArt() {
    if (q.get('art') === 'flat') return null;
    try {
      // never hang the screen on the art: 5 s and we start with the flat fallback
      const res = await fetch(`${ART}manifest.json`, { cache: 'no-store', signal: AbortSignal.timeout(5000) });
      const m = res.ok ? await res.json() : null;
      return m && (m.bg || m.base) && Array.isArray(m.occluders) ? m : null;
    } catch { return null; }
  }
  // A pre-rendered video loop: first frame within 6 s or it's dropped; a stall while visible is nudged to
  // play again, and still stuck after three nudges (~18 s) it's dropped too. onOk/onDead run at most once.
  // Returns kill(): drop it now (a dropped video is detached, so no hidden decoder keeps running).
  function playLoop(video, file, onOk, onDead) {
    let state = 'starting';
    const timers = [];
    const dead = () => {
      if (state === 'dead') return;
      state = 'dead';
      timers.forEach(clearTimeout);
      clearInterval(timer);
      video.onplaying = video.onerror = null;
      video.pause();
      video.removeAttribute('src');
      video.load();
      video.style.display = 'none';
      onDead();
    };
    video.onplaying = () => { if (state === 'starting') { state = 'ok'; onOk(); } };
    video.onerror = dead;
    video.style.display = 'block';
    video.src = ART + file;
    video.play().catch(() => timers.push(setTimeout(() => { if (state !== 'dead') video.play().catch(dead); }, 1000)));
    timers.push(setTimeout(() => { if (state === 'starting') dead(); }, 6000));
    let lastT = -1;
    let stuck = 0;
    const timer = setInterval(() => {
      if (state === 'dead') return;
      if (state !== 'ok' || document.hidden) return;
      if (video.currentTime === lastT) {
        if (++stuck % 3 === 0) video.play().catch(() => {});
        if (stuck >= 9) dead();
      } else stuck = 0;
      lastT = video.currentTime;
    }, 2000);
    return dead;
  }
  function setupArt(m) {
    document.body.classList.add('art');
    if (m.layout === 3) setupLayout3(m);
    bg.style.display = 'none';
    $('bgimg').style.display = 'block';
    // with a light loop, the still is the unlit base and the loop adds all animated light on top
    // With a light loop the still is the unlit base and the loop adds all animated light (and rain).
    // Without it (?loop=0, codec, file, no first frame in 6 s) a fully lit still is used: lit_bg = lit
    // without props; full is flattened, so its glass doubles up under the prop sprites (acceptable).
    const loop = $('loop');
    // the still for "no video": lit without baked rain when the art has one (procedural rain is drawn on top)
    const lit = m.lit_bg_dry || m.lit_bg || m.full;
    const wantLoop = !!m.light_loop && q.get('loop') !== '0';
    artImgs.push([$('bgimg'), wantLoop ? m.base || m.bg : (m.light_loop && lit) || m.bg || m.base]);
    if (wantLoop) {
      // One foreground rain at a time: the rain_fg video while both videos run, else the procedural rain.
      // Base loop gone -> lit still + procedural rain (and the fg video is dropped with it);
      // only the fg video gone -> procedural rain over the still-running base loop.
      let baseOk = false;
      let fgOk = false;
      let killFg = null;
      const hasFg = typeof m.rain_fg?.file === 'string';
      const sync = () => setRain(!(baseOk && (fgOk || !hasFg)));
      // the 4K base needs the 4K loop (each is the other's exact complement); ?loop2x=0 keeps the lighter 1080p one
      // (from the window size: the stage scale is not known yet here, so with director=0 at 1440p dpr() said 1 and the
      // 1080p loop ran over the 4K base, which is not its exact complement; QA 05 Nov)
      const k = Math.min(MAXK, (FIT_COVER ? Math.max : Math.min)(innerWidth / 1920, innerHeight / 1080) * (devicePixelRatio || 1) * (DIRECTOR_ON ? ZOOM : 1));
      const two = m.scale2x && k > 1.3 && typeof m.light_loop_2x === 'string' && q.get('loop2x') !== '0';
      // the source resized across the 4K/1080p line (resize handler): the loop follows the base art, as its complement
      let loopTwo = two;
      loopSwap = (k) => {
        const want = m.scale2x && k > 1.3 && typeof m.light_loop_2x === 'string' && q.get('loop2x') !== '0';
        if (want === loopTwo || !baseOk) return;
        loopTwo = want;
        loop.src = ART + (want ? m.light_loop_2x : m.light_loop);
        loop.play().catch(() => {});
      };
      playLoop(loop, two ? m.light_loop_2x : m.light_loop, () => { baseOk = true; sync(); }, () => {
        baseOk = false;
        killFg?.();
        sync();
        if (lit && artImgs[0][1] !== lit) { artImgs[0][1] = lit; $('bgimg').dataset.src = ''; applyArtRes(); }
      });
      if (hasFg) {
        killFg = playLoop($('rainfg'), m.rain_fg.file, () => { fgOk = true; fgPlaying = $('rainfg'); fgFps = m.rain_fg.fps || 24; fgToRain2(); sync(); },
          () => { fgOk = false; fgPlaying = null; fgToRain2(); sync(); });
      }
    } else if (m.glow) { $('glow').style.display = 'block'; artImgs.push([$('glow'), m.glow]); }
    for (const o of m.occluders) {
      if (!o || typeof o !== 'object') continue;
      const sliced = Array.isArray(o.depth_slices) && o.depth_slices.length ? o.depth_slices : null;
      // Where two depth slices meet, both have soft (antialiased) edges, so the art behind the wall (the restroom
      // floor) showed through as thin dark lines across the TICKETS / SNACK BAR signs (owner, 05 Nov). The whole
      // wall goes underneath at the lowest slice depth and fills those seams; anyone further back than that is
      // behind every slice anyway, so it hides nothing the slices didn't.
      const parts = sliced && typeof o.file === 'string' && [o.x, o.y, o.w, o.h].every(Number.isFinite)
        ? [{ ...o, z_index: Math.min(...sliced.map((s) => s.z_index ?? o.z_index)) }, ...sliced] : sliced || [o];
      for (const s of parts) {
        if (!s || typeof s.file !== 'string' || ![s.x, s.y, s.w, s.h].every(Number.isFinite)) continue;   // skip broken entries
        const im = h('img', 'prop');
        im.alt = '';
        im.decoding = 'async';
        Object.assign(im.style, { left: `${s.x}px`, top: `${s.y}px`, width: `${s.w}px`, height: `${s.h}px`, zIndex: String(s.z_index ?? o.z_index) });
        // the restroom's side wall and the ticket wall are two walls almost on top of each other: this slice of the
        // restroom one carries a black strip (its shaded face) that lands on the ticket wall as a black bar beside
        // the box office; only its lit top cap is kept
        if (/occ_restroom_side_wall_01\.png$/.test(s.file) && s.w === 159 && s.h === 99) im.style.clipPath = 'polygon(0 0, 159px 0, 159px 10px, 143px 10px, 143px 99px, 0 99px)';
        world.append(im);
        artImgs.push([im, s.file]);
      }
    }
    flatSigns.forEach((el) => { el.style.display = 'none'; });
    if (Array.isArray(m.marquees)) softRects.push([812, 328, 988, 370]);   // older art: the screen-facing gate sign
    // pass 9+: titles on LED dot-matrix signs above the doors instead of the floating title boxes
    if (Array.isArray(m.led_signs)) {
      for (const sp of m.led_signs) {
        if (!sp || !signs[sp.door - 1] || !['u0', 'v0'].includes(sp.wall) || ![...(sp.along || []), ...(sp.z_px || [])].every(Number.isFinite)) continue;
        leds.push(makeLed(sp));
      }
      if (leds.length) signs.forEach((sg) => { sg.el.style.display = 'none'; });
    }
    if (m.wc_indicator?.vacant?.file && m.wc_indicator?.occupied?.file) { makeWcLights(m.wc_indicator); wcWrap.style.display = 'none'; setWC(!!wcBusy); }
    // small pre-rendered prop loops (popcorn popping, arcade attract mode, buzzing boards): additive
    // sprite sheets sitting just above their prop, stepped by the frame loop
    if (Array.isArray(m.prop_loops)) {
      for (const p of m.prop_loops) {
        if (!p || typeof p.file !== 'string' || ![p.x, p.y, p.w, p.h, p.frames, p.columns].every(Number.isFinite)) continue;
        const el = h('div', 'proploop');
        if (p.blend === 'source-over') el.style.mixBlendMode = 'normal';   // straight-RGBA water on the glass (pass 8)
        Object.assign(el.style, { left: `${p.x}px`, top: `${p.y}px`, width: `${p.w}px`, height: `${p.h}px`, zIndex: String(p.z_index ?? 3),
          backgroundSize: `${p.columns * p.w}px ${Math.ceil(p.frames / p.columns) * p.h}px` });
        world.append(el);
        propLoops.push({ el, p, frame: -1 });
      }
    }
    // marquee boxes and poster frames as rendered (pass 6 moved them apart); the DOM text/posters follow
    if (Array.isArray(m.marquees)) {
      for (const mq of m.marquees) {
        const s = signs[mq?.screen - 1];
        if (!s || !Array.isArray(mq.bottom_center) || !mq.bottom_center.every(Number.isFinite)) continue;
        s.el.style.transform = `translate(${mq.bottom_center[0]}px, ${mq.bottom_center[1]}px) translate(-50%, -100%)`;
        if (Number.isFinite(mq.inner_size?.[1])) {
          s.el.style.height = `${mq.inner_size[1] - 14}px`;
          s.el.classList.toggle('compact', mq.inner_size[1] < 88);   // a smaller box: one title line
          const [bx, by] = mq.bottom_center;
          const [iw, ih] = [mq.inner_size[0] || 176, mq.inner_size[1]];
          softRects.push([bx - iw / 2 - 6, by - ih - 6, bx + iw / 2 + 6, by + 4]);   // speech keeps off the door titles
        }
      }
    }
    if (Array.isArray(m.poster_frames)) {
      for (const pf of m.poster_frames) {
        const s = signs[pf?.screen - 1];
        if (!s || !Array.isArray(pf.along) || !Array.isArray(pf.z_px) || ![...pf.along, ...pf.z_px].every(Number.isFinite)) continue;
        const [a0, a1] = pf.along;
        const [z0, z1] = pf.z_px;
        const len = a1 - a0;
        const sz = (z1 - z0) / 150;   // the poster element is 100 x 150 px
        const off = Number(pf.offset) || 0;   // the frame stands this far off the wall
        const [x0, y0] = pf.wall === 'u0' ? P(off, a1, z1) : P(a0, off, z1);
        const b = (pf.wall === 'u0' ? -1 : 1) * (len * 30) / 100;
        s.img.parentElement.style.transform = `matrix(${(len * 60) / 100}, ${b}, 0, ${sz}, ${x0}, ${y0})`;
      }
    }
    if (m.tyre_spray && typeof m.tyre_spray === 'object') SPRAY = m.tyre_spray;
    // optional subsystems only switch on when their manifest entries are complete and sane
    if (npcWalkSpecs(m.cat) && validSheet(m.cat.sleep) && validSheet(m.cat.sit)) {
      initCat(validSheet(m.cat.stretch) ? m.cat : { ...m.cat, stretch: null });
    }
    if (q.get('janitor') === '3d') { if (npcWalkSpecs(m.janitor) && validSheet(m.janitor.sweep) && validSheet(m.janitor.idle)) initJanitor(m.janitor); } else if (q.get('janitor') === 'always') initMopper();   // default: mods are the jannies
    if (m.door_anims && Array.isArray(m.door_anims)) {
      for (const d of m.door_anims) if (validSheet({ ...d, anchor: [0, 0] }) && Number.isFinite(d.x) && Number.isFinite(d.y)) doorAnims[d.door] = d;
    }
    if (m.umbrella?.open && m.umbrella?.fold) UMB = m.umbrella;
    if (m.items && typeof m.items === 'object') ITEMS = m.items;
    if (m.vehicles && typeof m.vehicles === 'object') {
      VEH = m.vehicles;
      if (m.lanes) LANES = { ...LANES, ...m.lanes };
      // the road runs v 10.6-13.5 with its dashed centre line at v 12 (build_scene.py), so the manifest's far lane
      // (12) drove right-to-left traffic on the dashes: use the far lane's middle instead
      if (LANES.far <= 12.05) LANES.far = 12.75;
      if (m.arrival_stops) STOPS = { ...STOPS, ...m.arrival_stops };
      nextCar = performance.now() + 2500;
      nextBus = performance.now() + rand(8000, 20000);
      // warm the image cache with every light variant, so brake/indicator swaps never flash
      const two = dpr() > 1.3 || (MAXK === Infinity && (devicePixelRatio > 1.3 || innerWidth > 2400));
      for (const dirs of Object.values(VEH)) {
        for (const s of Object.values(dirs || {})) {
          for (const k of ['light', 'light_brake', 'light_indicator', 'light_indicator_only']) {
            const f = (two && s?.[`${k}_2x`]) || s?.[k];
            if (typeof f === 'string') { const im = new Image(); im.src = ART + f; preloaded.push(im); }
          }
        }
      }
    }
    // RESTROOM is baked: only the occupancy light stays, just above the door
    wcLabel = '';
    const [x, y] = P(0, WC_V, 108);
    wcWrap.style.transform = `translate(${x}px, ${y}px) translate(-50%, -100%)`;
    setWC(!!wcBusy);
  }
  let loopSwap = null;   // set in setupArt: switches the light loop between 1080p and 4K with the base art
  const propLoops = [];
  const arcadeKind = (name) => (/arcade/i.test(name || '') ? (/play/i.test(name) ? 'play' : /hiscore|high/i.test(name) ? 'hiscore' : 'attract') : null);
  function stepPropLoops(t) {
    // the cabinet's screen: attract mode, a game while someone actually plays, the hi-score screen after a
    // new high score (older art without those screens: the attract loop just goes dark during a game)
    const playing = !!arcadeBusy && Math.hypot(arcadeBusy.u - ARCADE[0], arcadeBusy.v - ARCADE[1]) < 0.1;
    const kinds = new Set(propLoops.map((l) => arcadeKind(l.p.name)));
    const mode = playing ? 'play' : performance.now() < arcadeHiUntil && kinds.has('hiscore') ? 'hiscore' : 'attract';
    const now = performance.now();
    if (now > nextChase) { chaseUntil[1 + Math.floor(Math.random() * signs.length)] = now + 3500; nextChase = now + rand(20000, 45000); }
    for (const l of propLoops) {
      const bk = bulbKind(l.p.name);
      if (bk) {
        const chasing = (chaseUntil[bk[1]] || 0) > now;
        const o = (bk[2].toLowerCase() === 'chase') === chasing ? '' : '0';
        if (l.el.style.opacity !== o) l.el.style.opacity = o;
      }
      const kind = arcadeKind(l.p.name);
      if (kind) {
        const o = kind === mode ? '' : '0';
        if (l.el.style.opacity !== o) l.el.style.opacity = o;
      }
      const f = Math.floor((t / 1000) * (l.p.fps || 24)) % l.p.frames;
      if (f === l.frame) continue;
      l.frame = f;
      l.el.style.backgroundPosition = `${-(f % l.p.columns) * l.p.w}px ${-Math.floor(f / l.p.columns) * l.p.h}px`;
    }
  }
  function applyArtRes() {
    const two = art.scale2x && dpr() > 1.3;
    // the 58 wet sheets (soft additive rain highlights) stay 1x: at @2x they decode to ~590 MB, more than
    // Chrome's image cache holds, so it re-decoded them every frame (~10 fps; 1x: ~53 fps). ?wet2x=1 = old way
    const wet2x = q.get('wet2x') === '1';
    for (const l of propLoops) {
      const src = ART + (two && l.p.file_2x && (wet2x || !/(^|\/)wet_/.test(l.p.file)) ? l.p.file_2x : l.p.file);
      if (l.src !== src) { l.src = src; l.el.style.backgroundImage = `url("${src}")`; }
    }
    for (const [im, file] of artImgs) {
      const src = ART + (two ? file.replace(/\.png$/, '@2x.png') : file);
      if (im.dataset.src !== src) {
        im.dataset.src = src;
        // a missing @2x file falls back to the 1x one
        im.onerror = two ? () => { im.onerror = null; im.src = ART + file; } : null;
        im.src = src;
      }
    }
  }

  (async () => {
    art = await loadArt();
    useLayout(Number(q.get('layout')) || (LAYOUTS[art?.layout] ? art.layout : 1));   // ?layout= forces one (testing)
    if (art) setupArt(art); else buildProps();
    SB.on('resize', (s) => {
      scale = s;
      if (!art) { redrawBg(); redrawProps(); return; }
      applyArtRes();
      loopSwap?.(dpr());
      traffic.forEach(vehSprites);
      for (const n of npcs) if (n.spec) { sheetStyle(n.el, n.spec); n.f = -1; }   // keeps clock and frame
      for (const w of figures) if (w.umbSpec && w.umb) setImg(w.umb, w.umbSpec.file, w.umbSpec.file_2x, dpr() > 1.3);
      shots.forEach((sh) => sheetStyle(sh.el, sh.spec));
    });
    SB.mountStage($('stage'), { cover: FIT_COVER });
    if (!art) document.fonts?.ready.then(() => { redrawBg(); redrawProps(); });
    requestAnimationFrame(loop);
    SB.start();
  })();
})();
</script>
